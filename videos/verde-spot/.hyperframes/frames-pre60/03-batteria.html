    <script>
      (function () {
        var ID = "03-batteria", D = 3.2, FPS = 30;
        var root = document.querySelector('[data-composition-id="' + ID + '"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return root.querySelectorAll(s); };
        var hash = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

        // typed caption letters
        var capEl = q("#v03-cap"), CAP = "FIG. 3: LA BATTERIA";
        capEl.innerHTML = "";
        for (var c = 0; c < CAP.length; c++) {
          var sp = document.createElement("span");
          sp.textContent = CAP[c] === " " ? " " : CAP[c];
          capEl.appendChild(sp);
        }
        var capChars = capEl.querySelectorAll("span");

        var tl = gsap.timeline({ paused: true });

        // ---- grain swap every 2 frames + deterministic flicker (±3%) ----
        var fx = q("#v03-fx"), flick = q("#v03-flick");
        var steps = Math.ceil(D * FPS / 2);
        for (var s = 0; s < steps; s++) {
          var t = s * 2 / FPS;
          tl.set(fx, { attr: { "data-g": String(Math.floor(hash(s + 3) * 6) % 6) } }, t);
          tl.set(flick, { opacity: 0.02 + 0.5 * (hash(s * 7 + 1) - 0.5) * 0.06 }, t);
        }

        // ---- camera: stepped push-in across the whole shot ----
        tl.fromTo(q("#v03-world"), { scale: 1, x: 0 }, { scale: 1.05, x: -10, duration: D, ease: "steps(16)" }, 0);

        // ---- Scene 1 (0.0–1.0): battery snaps in, red notch blinks, caption types ----
        tl.fromTo(q("#v03-diag"), { x: -1100 }, { x: 0, duration: 0.18, ease: "steps(3)" }, 0);
        var batt = q("#v03-batt");
        tl.fromTo(batt, { scaleY: 0.25, scaleX: 1.35, skewX: -14, opacity: 0 },
          { scaleY: 1.12, scaleX: 0.9, skewX: 6, opacity: 1, duration: 0.12, ease: "power4.in" }, 0.02);
        tl.to(batt, { scaleY: 0.95, scaleX: 1.04, skewX: -3, duration: 0.07, ease: "steps(2)" }, 0.14);
        tl.to(batt, { scaleY: 1, scaleX: 1, skewX: 0, duration: 0.07, ease: "steps(2)" }, 0.21);
        // nervous shake after landing
        var shake = [10, -8, 6, -4, 0];
        for (var k = 0; k < shake.length; k++) tl.set(batt, { x: shake[k] }, 0.3 + k * 0.035);

        // the last red notch blinks, stepped, all shot long
        var notch = q("#v03-notch");
        var bt = 0.36, on = false;
        while (bt < D) {
          tl.set(notch, { opacity: on ? 1 : 0.12 }, bt);
          on = !on;
          bt += on ? 0.14 : 0.2;
        }
        tl.fromTo(q("#v03-bolt"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "steps(3)" }, 0.3);

        // caption typed letter by letter
        for (var i = 0; i < capChars.length; i++) {
          tl.fromTo(capChars[i], { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 0.42 + i * 0.03);
        }
        tl.fromTo(q("#v03-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "steps(6)" }, 0.5);

        // ---- Scene 2 (1.0–2.2): "1%" punches in ----
        var pct = q("#v03-pct");
        tl.fromTo(pct, { scale: 2.6, skewX: -20, opacity: 0, y: -60 },
          { scale: 0.86, skewX: 8, opacity: 1, y: 0, duration: 0.1, ease: "power4.in" }, 1.0);
        tl.to(pct, { scale: 1.07, skewX: -4, duration: 0.06, ease: "steps(2)" }, 1.1);
        tl.to(pct, { scale: 1, skewX: 0, duration: 0.06, ease: "steps(2)" }, 1.16);
        // parole in libertà: letters land distorted then settle unevenly
        tl.fromTo(q("#v03-p1"), { scaleY: 1.4, scaleX: 0.8 }, { scaleY: 1, scaleX: 1, duration: 0.16, ease: "steps(3)" }, 1.06);
        tl.fromTo(q("#v03-p2"), { scaleY: 0.7, scaleX: 1.35, rotation: 8 }, { scaleY: 1.06, scaleX: 0.96, rotation: -4, duration: 0.18, ease: "steps(3)" }, 1.08);
        // jerky tremor on the number through the rest of the shot
        for (var j = 0; j < 14; j++) {
          var tj = 1.32 + j * 0.13;
          tl.set(pct, { x: (hash(j + 40) - 0.5) * 16, rotation: (hash(j + 70) - 0.5) * 3 }, tj);
        }
        // speed lines to the right flash in with the punch
        var sps = [q("#v03-sp1"), q("#v03-sp2"), q("#v03-sp3")];
        for (var m = 0; m < sps.length; m++) {
          tl.fromTo(sps[m], { scaleX: 0, transformOrigin: "0% 50%", x: -40 }, { scaleX: 1, x: 0, duration: 0.12, ease: "steps(3)" }, 1.08 + m * 0.04);
        }
