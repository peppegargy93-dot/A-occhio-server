  <script>
    (function () {
      const D = 3.8, FPS = 30;
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector('[data-composition-id="05-maestra"] ' + s);
      const qa = (s) => document.querySelectorAll('[data-composition-id="05-maestra"] ' + s);

      // ---- archival grain (swap tile every 2 frames) + flicker (+-3%) ----
      const tiles = [0, 1, 2, 3, 4, 5].map((i) => q('#v05-g' + i));
      const flick = [0.02, 0.05, 0.01, 0.04, 0.0, 0.03, 0.05, 0.015, 0.035, 0.005, 0.045, 0.025];
      const steps = Math.ceil(D * FPS / 2);
      for (let k = 0; k < steps; k++) {
        const t = (k * 2) / FPS;
        const cur = k % 6, prev = (k + 5) % 6;
        if (k > 0) tl.set(tiles[prev], { attr: { opacity: 0 } }, t);
        tl.set(tiles[cur], { attr: { opacity: 1 } }, t);
        tl.set(q('#v05-flicker'), { opacity: 0.6 * flick[(k * 7) % flick.length] }, t);
      }

      // ---- macro camera: slow push toward the sheets ----
      tl.fromTo(q('#v05-cam'), { scale: 1, transformOrigin: '540px 1150px' }, { scale: 1.05, duration: D, ease: 'none' }, 0);

      // ---- Scene 1 (0.0-1.4): teacher, sheets, caption ----
      tl.fromTo(q('#v05-teacher'), { y: 130, opacity: 0 }, { y: 40, opacity: 1, duration: 0.3, ease: 'steps(4)' }, 0);
      tl.fromTo(q('#v05-sheetL'), { y: 60, rotation: -9, opacity: 0 }, { y: 0, rotation: -2.5, opacity: 1, duration: 0.24, ease: 'steps(3)' }, 0.12);
      tl.fromTo(q('#v05-sheetR'), { y: 60, rotation: 9, opacity: 0 }, { y: 0, rotation: 2.5, opacity: 1, duration: 0.24, ease: 'steps(3)' }, 0.22);
      // caption typed letter by letter
      const chars = qa('#v05-caption span');
      chars.forEach((c, i) => tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: true }, 0.3 + i * 0.04));
      tl.fromTo(q('#v05-caption-rule'), { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: 'steps(5)' }, 0.3 + chars.length * 0.04);
      // eyes compare the two identical sheets (nervous, stepped)
      const eyes = q('#v05-eyes');
      tl.fromTo(eyes, { x: 0, y: 0 }, { x: -9, y: 6, duration: 0.05, ease: 'steps(1)' }, 0.45);
      tl.to(eyes, { x: 9, y: 6, duration: 0.05, ease: 'steps(1)' }, 0.75);
      tl.to(eyes, { x: -9, y: 6, duration: 0.05, ease: 'steps(1)' }, 0.98);
      tl.to(eyes, { x: 9, y: 7, duration: 0.05, ease: 'steps(1)' }, 1.16);
      tl.fromTo(q('#v05-head'), { rotation: 0 }, { rotation: -5, transformOrigin: '540px 520px', duration: 0.05, ease: 'steps(1)' }, 0.75);
      tl.to(q('#v05-head'), { rotation: 4, duration: 0.05, ease: 'steps(1)' }, 1.16);
      tl.fromTo(q('#v05-brows'), { y: 0 }, { y: 8, duration: 0.05, ease: 'steps(1)' }, 1.2);

      // ---- Scene 2 (1.4-2.4): blade pen slashes the copy ----
      const pen = q('#v05-pen');
      tl.fromTo(pen, { x: 260, y: 640, rotation: 44, autoAlpha: 0 }, { x: 590, y: 1060, autoAlpha: 1, duration: 0.24, ease: 'steps(4)' }, 1.0);
      tl.to(pen, { x: 560, y: 1028, rotation: 40, duration: 0.12, ease: 'power2.out' }, 1.3);   // wind-up
      tl.to(pen, { x: 612, y: 1096, rotation: 45, duration: 0.04, ease: 'steps(1)' }, 1.44);
      tl.to(pen, { x: 978, y: 1458, duration: 0.12, ease: 'expo.in' }, 1.5);                    // the slash
      tl.fromTo(q('#v05-gash'), { attr: { 'stroke-dashoffset': 501 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.12, ease: 'expo.in' }, 1.5);
      // the cut splits the sheet
      tl.fromTo(q('#v05-halfA'), { x: 0, y: 0, rotation: 0 }, { x: 22, y: -26, rotation: -4, transformOrigin: '260px 80px', duration: 0.18, ease: 'steps(3)' }, 1.62);
      tl.fromTo(q('#v05-halfB'), { x: 0, y: 0, rotation: 0 }, { x: -20, y: 22, rotation: 3, transformOrigin: '100px 260px', duration: 0.18, ease: 'steps(3)' }, 1.62);
      // impact shake
      const sh = q('#v05-shake');
      const shakeX = [14, -12, 9, -7, 5, -3, 0], shakeY = [-8, 7, -5, 4, -2, 1, 0];
