  <script>
    (function () {
      const DUR = 4.0;
      const STILL_FROM = 2.8; // last 1.2 s fully still
      const FPS = 30;
      const tl = gsap.timeline({ paused: true });

      // ---------- Paper grain on green: 6 tiles, fixed seeds ----------
      const SEEDS = [5, 19, 31, 43, 59, 71];
      let g = "";
      SEEDS.forEach(function (seed, i) {
        g +=
          '<svg id="v12-grain-' + i + '" viewBox="0 0 1080 1920" preserveAspectRatio="none" style="opacity:0">' +
          '<image width="1080" height="1920" preserveAspectRatio="none" opacity="0.3" href="data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">' +
          '<filter id="f" x="0" y="0" width="100%" height="100%">' +
          '<feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="' + seed + '" stitchTiles="stitch"/>' +
          '<feComponentTransfer result="n"><feFuncA type="identity"/></feComponentTransfer>' +
          '<feColorMatrix in="n" type="matrix" values="0 0 0 0 0.078  0 0 0 0 0.078  0 0 0 0 0.078  2.4 0 0 0 -1.25" result="dark"/>' +
          '<feColorMatrix in="n" type="matrix" values="0 0 0 0 0.937  0 0 0 0 0.902  0 0 0 0 0.824  0 -2.4 0 0 1.05" result="light"/>' +
          '<feMerge><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>' +
          "</filter>" +
          '<rect width="1080" height="1920" filter="url(#f)"/></svg>') + '"/></svg>';
      });
      document.getElementById("v12-grain").innerHTML = g;
      const tiles = SEEDS.map(function (_, i) { return document.getElementById("v12-grain-" + i); });
      const flicker = document.getElementById("v12-flicker");
      const STEP = 2 / FPS;
      const nSteps = Math.round(STILL_FROM / STEP);
      for (let i = 0; i <= nSteps; i++) {
        const t = i * STEP;
        tl.set(tiles[i % 6], { opacity: 1 }, t);
        if (i > 0) tl.set(tiles[(i - 1) % 6], { opacity: 0 }, t);
        const f = i === nSteps ? 0.03 : 0.03 + 0.03 * Math.sin(i * 2.71) * Math.cos(i * 1.37);
        tl.set(flicker, { opacity: f }, t);
      }
      // from STILL_FROM on: grain + flicker frozen on the last tile

      // ---------- Scene 1: the stamp lands (scale 1.35 → 0.94 → 1) ----------
      const stamp = document.getElementById("v12-stamp");
      const stage = document.getElementById("v12-stage");
      tl.fromTo(stamp, { scale: 1.35, opacity: 0 }, { scale: 0.94, opacity: 1, duration: 0.22, ease: "power3.in" }, 0.1);
      tl.to(stamp, { scale: 1, duration: 0.3, ease: "power1.out" }, 0.32);
      // thud: the whole sheet takes the hit
      tl.fromTo(stage, { y: 0 }, { y: 10, duration: 0.05, ease: "power1.out" }, 0.32);
      tl.to(stage, { y: 0, duration: 0.3, ease: "sine.out" }, 0.37);

      // ---------- Scene 2: "Facciamola passare." slides in softly ----------
      tl.fromTo("#v12-slogan",
        { x: -70, opacity: 0 },
        { x: 0, opacity: 1, duration: 1.0, ease: "power2.out" },
        0.85);

      // ---------- Scene 3: typewriter lines ----------
      function typeLine(id, text, start, end) {
        const host = document.getElementById(id);
        host.innerHTML = text.split("").map(function (ch) {
          return '<span class="v12-ch">' + ch + "</span>";
        }).join("");
        const chars = host.querySelectorAll(".v12-ch");
        const per = (end - start) / chars.length;
        chars.forEach(function (c, i) {
          tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.001 }, start + i * per);
        });
      }
      typeLine("v12-phone", "Numero verde 800 420 420", 2.0, 2.45);
      typeLine("v12-sign", "Comitato per il Verde", 2.4, 2.78);
      // leaf emblem settles in with the signature (done before STILL_FROM)
      tl.fromTo("#v12-leaf",
        { opacity: 0, scale: 0.7, rotation: -14, y: 10 },
        { opacity: 1, scale: 1, rotation: 0, y: 0, duration: 0.4, ease: "sine.out" },
        2.36);

      // ---------- Scene 4: hold still until the end ----------
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["12-finale"] = tl;
    })();
  </script>
