    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "04-conto", D = 3.6, FPS = 30;
        var root = document.querySelector('[data-composition-id="' + ID + '"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return root.querySelectorAll(s); };
        var hash = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

        // ---- build the digit column: one floor per character, top to bottom ----
        var DIGITS = "-1.247,00", FLOOR_H = 116, BASE = 1400;
        var col = q("#v04-col"), floors = [];
        for (var d = 0; d < DIGITS.length; d++) {
          var f = document.createElement("div");
          f.className = "v04-floor";
          f.textContent = DIGITS[d] === "-" ? "−" : DIGITS[d];
          var fromBottom = DIGITS.length - 1 - d;
          f.style.top = (BASE - (fromBottom + 1) * FLOOR_H) + "px";
          col.appendChild(f);
          floors[fromBottom] = f; // floors[0] = ground floor
        }
        var N = floors.length;

        // dust blocks: 3 per floor, laid out at the column base
        var dustWrap = q("#v04-dustwrap"), dust = [];
        for (var u = 0; u < N * 3; u++) {
          var b = document.createElement("div");
          b.className = "v04-dust" + (u % 3 === 1 ? " v04-d2" : "");
          b.style.left = (520 + (hash(u + 5) - 0.5) * 120) + "px";
          b.style.top = (1330 + (hash(u + 9) - 0.5) * 50) + "px";
          dustWrap.appendChild(b);
          dust.push(b);
        }

        // typed caption
        var capEl = q("#v04-cap"), CAP = "FIG. 4: IL CONTO";
        capEl.innerHTML = "";
        for (var c = 0; c < CAP.length; c++) {
          var sp = document.createElement("span");
          sp.textContent = CAP[c] === " " ? " " : CAP[c];
          capEl.appendChild(sp);
        }
        var capChars = capEl.querySelectorAll("span");

        var tl = gsap.timeline({ paused: true });

        // ---- grain swap every 2 frames + deterministic flicker ----
        var fx = q("#v04-fx"), flick = q("#v04-flick");
        var steps = Math.ceil(D * FPS / 2);
        for (var s = 0; s < steps; s++) {
          var t = s * 2 / FPS;
          tl.set(fx, { attr: { "data-g": String(Math.floor(hash(s + 13) * 6) % 6) } }, t);
          tl.set(flick, { opacity: 0.02 + 0.5 * (hash(s * 7 + 4) - 0.5) * 0.06 }, t);
        }

        // ---- camera: stepped drift toward the vanishing point ----
        tl.fromTo(q("#v04-world"), { scale: 1, y: 0 }, { scale: 1.06, y: 24, duration: D, ease: "steps(18)" }, 0);

        // ---- Scene 1 (0.0–1.3): the skyscraper of red digits rises, then collapses floor by floor ----
        for (var i = 0; i < N; i++) {
          tl.fromTo(floors[i], { y: 260, opacity: 0, scaleY: 0.4 },
            { y: 0, opacity: 1, scaleY: 1, duration: 0.06, ease: "steps(2)" }, 0.02 + i * 0.045);
        }
        tl.fromTo(q("#v04-floorp"), { x: -1080 }, { x: 0, duration: 0.15, ease: "steps(3)" }, 0);
        // nervous wobble at the top before it goes
        tl.set(col, { x: 8, rotation: 1.2, transformOrigin: "50% 100%" }, 0.5);
        tl.set(col, { x: -10, rotation: -1.6 }, 0.55);
        tl.set(col, { x: 6, rotation: 0.8 }, 0.6);
        tl.set(col, { x: 0, rotation: 0 }, 0.64);

        // collapse: ground floor crushes, everything above drops one squashed storey; repeat upward
        var SQ = 0.2, DROP = FLOOR_H * (1 - SQ), T0 = 0.66, DT = 0.07;
        for (var j = 0; j < N; j++) {
          var tc = T0 + j * DT;
          // floor j crushes into rubble (lands slightly skewed, offset sideways)
          tl.to(floors[j], {
            scaleY: SQ, x: (hash(j + 31) - 0.5) * 60, rotation: (hash(j + 57) - 0.5) * 14,
            duration: DT * 0.8, ease: "steps(2)"
          }, tc);
          // everything above drops
          for (var a = j + 1; a < N; a++) {
            tl.to(floors[a], { y: DROP * (j + 1), duration: DT * 0.8, ease: "steps(2)" }, tc);
          }
          // dust bursts out — mostly to the right
          for (var e = 0; e < 3; e++) {
            var db = dust[j * 3 + e];
            var dx = 90 + hash(j * 3 + e + 2) * 200;
            dx = e === 0 ? -dx * 0.6 : dx;
            tl.fromTo(db, { x: 0, y: -DROP * 0 - j * FLOOR_H * SQ, opacity: 1, scale: 1, rotation: 0 },
              { x: dx, y: -j * FLOOR_H * SQ - 60 - hash(j + e) * 120, opacity: 0, scale: 0.4, rotation: 90,
                duration: 0.45, ease: "steps(6)" }, tc);
          }
        }

        // caption typed letter by letter
        for (var k = 0; k < capChars.length; k++) {
          tl.fromTo(capChars[k], { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 0.3 + k * 0.035);
        }

        // ---- Scene 2 (1.3–3.6): calendar "27" snaps in, then recedes jittering to the vanishing point ----
        var pls = qa(".v04-pl");
        for (var p = 0; p < pls.length; p++) {
          tl.to(pls[p], { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "steps(5)" }, 1.25 + p * 0.03);
        }
        tl.fromTo(q("#v04-vp"), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "steps(1)" }, 1.4);

        var cal = q("#v04-cal");
        tl.fromTo(cal, { scale: 1.5, skewX: -14, opacity: 0, y: -80 },
          { scale: 0.92, skewX: 6, opacity: 1, y: 0, duration: 0.1, ease: "power4.in" }, 1.32);
        tl.to(cal, { scale: 1.04, skewX: -3, duration: 0.06, ease: "steps(2)" }, 1.42);
        tl.to(cal, { scale: 1, skewX: 0, duration: 0.06, ease: "steps(2)" }, 1.48);
        tl.fromTo(q("#v04-n2"), { scaleY: 1.35, scaleX: 0.85 }, { scaleY: 1, scaleX: 1, duration: 0.15, ease: "steps(3)" }, 1.38);
        tl.fromTo(q("#v04-n7"), { scaleY: 0.75, scaleX: 1.25, rotation: -6 }, { scaleY: 1.05, scaleX: 0.97, rotation: 3, duration: 0.17, ease: "steps(3)" }, 1.4);
        // back pages show briefly as the stack the page is torn from
        tl.fromTo(q("#v04-back1"), { opacity: 0, x: 0, y: 0, rotation: 0 }, { opacity: 1, x: 18, y: 16, rotation: 2, duration: 0.05, ease: "steps(1)" }, 1.36);
        tl.fromTo(q("#v04-back2"), { opacity: 0, x: 0, y: 0, rotation: 0 }, { opacity: 1, x: 36, y: 32, rotation: 4, duration: 0.05, ease: "steps(1)" }, 1.38);

        // recede: shrink toward VP (540,560) in nervous steps, with a jitter pulse at each step
        // page center is at (540, 300 + 0.4*720 = 588) via transform-origin 50% 40%
        var RS = 12, R0 = 1.7, R1 = 3.5;
        for (var r = 1; r <= RS; r++) {
          var pr = r / RS;
          var tr = R0 + (R1 - R0) * (r - 1) / RS;
          var sc = 1 - 0.9 * Math.pow(pr, 0.8);
          tl.to(cal, { scale: sc, y: -28 * pr, x: (hash(r + 90) - 0.5) * 40 * (1 - pr * 0.6),
            rotation: (hash(r + 120) - 0.5) * 10, duration: 0.05, ease: "steps(1)" }, tr);
        }
        // back pages fall behind first, faster
        tl.to(q("#v04-back1"), { scale: 0.3, y: -30, opacity: 0.0, duration: 0.6, ease: "steps(4)" }, 1.7);
        tl.to(q("#v04-back2"), { scale: 0.3, y: -30, opacity: 0.0, duration: 0.5, ease: "steps(4)" }, 1.7);
