    (function () {
      var D = 2.8;

      var qa = function (s) { return document.querySelectorAll('[data-composition-id="09-svolta"] ' + s); };

      var order = [0, 2, 1, 3, 2, 0, 3, 1];

      var steps = Math.ceil(D * 15);
      for (var i = 0; i <= steps; i++) {

        tl.set(tiles[order[i % order.length]], { opacity: 0.16 }, t);
        tl.set(flick, { opacity: 0.03 + 0.025 * Math.sin(i * 2.399) * Math.cos(i * 0.77) }, t);
      }

      // ---- Scene 1 (0.0–1.0): same light, drifting slowly; red off, green on (click) ----
      var light = q("#v09-light");

        { opacity: 1, scale: 1, duration: 0.28, ease: "power1.out" }, 0.65);

      // ---- Scene 2 (1.0–1.2): cut-out disc for exactly 6 frames @30fps, then round again ----
      var cut = q("#v09-cut");
      var green = q("#v09-green");
      tl.fromTo(cut, { autoAlpha: 0 }, { autoAlpha: 0, duration: 0.001 }, 0);
      tl.set(cut, { autoAlpha: 1 }, 1.0);
      tl.set(green, { autoAlpha: 0 }, 1.0);
      tl.set(cut, { autoAlpha: 0 }, 1.2);
      tl.set(green, { autoAlpha: 1 }, 1.2);

      // ---- speed lines: in softly, then straight → soft curves ----
      var lines = [q("#v09-l0"), q("#v09-l1"), q("#v09-l2"), q("#v09-l3")];
      tl.fromTo(lines, { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "sine.out", stagger: 0.12 }, 0.15);

        "M630 800 C740 750 850 860 980 790",
        "M600 940 C700 890 820 1000 960 930",
        "M640 1080 C750 1030 860 1140 980 1070"

      // background planes sway gently

      tl.to(title, { y: -10, rotation: -1.2, duration: 0.7, ease: "sine.inOut" }, 2.1);
