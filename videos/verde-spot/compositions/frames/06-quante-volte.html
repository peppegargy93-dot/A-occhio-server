  <div id="v06-root" data-composition-id="06-quante-volte" data-start="0" data-duration="2.5" data-width="1080" data-height="1920">

    <!-- ground -->
    <div id="v06-ground" class="clip v06-layer v06-ground" data-start="0" data-duration="2.5" data-track-index="0">
      <svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" style="position:absolute;left:0;top:0;">
        <defs>
          <filter id="v06-fibre"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.08" numOctaves="3" seed="7"/><feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.16  0 0 0 0.55 -0.12"/></filter>
          <filter id="v06-stain"><feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="2" seed="23"/><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.2  0 0 0 0.9 -0.38"/></filter>
        </defs>
        <rect width="1080" height="1920" filter="url(#v06-fibre)" opacity="0.5"/>
        <rect width="1080" height="1920" filter="url(#v06-stain)" opacity="0.6"/>
      </svg>
    </div>

    <!-- Scene 1: hard-cut flashes, exactly 6 frames (0.2 s) each -->
    <div id="v06-f1" class="clip v06-layer" data-start="0" data-duration="0.2" data-track-index="1">
      <svg class="v06-layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><polygon points="0,700 1080,380 1080,1240 0,1520" fill="#D9CDB2"/></svg>
      <svg id="v06-a1" class="v06-flash-art" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"><use href="#v06-s-card"/></svg>
    </div>
    <div id="v06-f2" class="clip v06-layer" data-start="0.2" data-duration="0.2" data-track-index="1">
      <svg class="v06-layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><polygon points="0,420 1080,760 1080,1500 0,1180" fill="#D9CDB2"/></svg>
      <svg id="v06-a2" class="v06-flash-art" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"><use href="#v06-s-engine"/></svg>
    </div>
    <div id="v06-f3" class="clip v06-layer" data-start="0.4" data-duration="0.2" data-track-index="1">
      <svg class="v06-layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><polygon points="0,640 1080,440 1080,1300 0,1460" fill="#D9CDB2"/></svg>
      <svg id="v06-a3" class="v06-flash-art" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
        <use href="#v06-s-tile"/>
        <text x="430" y="218" text-anchor="middle" font-family="Anton" font-size="130" fill="#EFE6D2">99+</text>
      </svg>
    </div>
    <div id="v06-f4" class="clip v06-layer" data-start="0.6" data-duration="0.2" data-track-index="2">
      <svg class="v06-layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><polygon points="0,380 1080,700 1080,1520 0,1240" fill="#D9CDB2"/></svg>
      <svg id="v06-a4" class="v06-flash-art" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"><use href="#v06-s-badge"/></svg>
    </div>
    <div id="v06-f5" class="clip v06-layer" data-start="0.8" data-duration="0.2" data-track-index="2">
      <svg class="v06-layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><polygon points="0,720 1080,420 1080,1280 0,1500" fill="#D9CDB2"/></svg>
      <svg id="v06-a5" class="v06-flash-art" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"><use href="#v06-s-alert"/></svg>
    </div>

    <!-- Scene 2: all five reappear and spin into a vortex -->
    <div id="v06-vortex" class="clip v06-layer" data-start="1.0" data-duration="1.2" data-track-index="2">
      <svg id="v06-spiral" class="v06-layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <g id="v06-spiral-g">
          <path id="v06-sp0" fill="none" stroke="#CE2B37" stroke-width="22" stroke-linecap="butt"/>
          <path id="v06-sp1" fill="none" stroke="#141414" stroke-width="10" stroke-linecap="butt"/>
          <path id="v06-sp2" fill="none" stroke="#CE2B37" stroke-width="22" stroke-linecap="butt"/>
        </g>
      </svg>
      <div id="v06-hub" class="v06-hub">
        <div class="v06-arm" style="transform: rotate(0deg);"><div id="v06-i0" class="v06-item"><svg width="300" height="300" viewBox="0 0 600 600"><use href="#v06-s-card"/></svg></div></div>
        <div class="v06-arm" style="transform: rotate(72deg);"><div id="v06-i1" class="v06-item"><svg width="300" height="300" viewBox="0 0 600 600"><use href="#v06-s-engine"/></svg></div></div>
        <div class="v06-arm" style="transform: rotate(144deg);"><div id="v06-i2" class="v06-item"><svg width="300" height="300" viewBox="0 0 600 600"><use href="#v06-s-tile"/></svg></div></div>
        <div class="v06-arm" style="transform: rotate(216deg);"><div id="v06-i3" class="v06-item"><svg width="300" height="300" viewBox="0 0 600 600"><use href="#v06-s-badge"/></svg></div></div>
        <div class="v06-arm" style="transform: rotate(288deg);"><div id="v06-i4" class="v06-item"><svg width="300" height="300" viewBox="0 0 600 600"><use href="#v06-s-alert"/></svg></div></div>
      </div>
    </div>
    <div id="v06-title-clip" class="clip v06-layer" data-start="1.0" data-duration="1.2" data-track-index="3">
      <div id="v06-title" class="v06-title"><span>Q</span><span>U</span><span>A</span><span>N</span><span>T</span><span>E</span><span>&nbsp;</span><span>V</span><span>O</span><span>L</span><span>T</span><span>E</span><span>?</span></div>
    </div>

    <!-- vignette, grain, flicker -->
    <div id="v06-vignette" class="clip v06-layer v06-vignette" data-start="0" data-duration="2.5" data-track-index="4"></div>
    <svg id="v06-grain" class="clip v06-layer v06-grain" data-start="0" data-duration="2.5" data-track-index="5" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="v06-n0"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/></filter>
        <filter id="v06-n1"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="13"/><feColorMatrix type="saturate" values="0"/></filter>
        <filter id="v06-n2"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="31"/><feColorMatrix type="saturate" values="0"/></filter>
        <filter id="v06-n3"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="43"/><feColorMatrix type="saturate" values="0"/></filter>
        <filter id="v06-n4"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="67"/><feColorMatrix type="saturate" values="0"/></filter>
        <filter id="v06-n5"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="89"/><feColorMatrix type="saturate" values="0"/></filter>
      </defs>
      <rect id="v06-g0" width="1080" height="1920" filter="url(#v06-n0)"/>
      <rect id="v06-g1" width="1080" height="1920" filter="url(#v06-n1)" visibility="hidden"/>
      <rect id="v06-g2" width="1080" height="1920" filter="url(#v06-n2)" visibility="hidden"/>
      <rect id="v06-g3" width="1080" height="1920" filter="url(#v06-n3)" visibility="hidden"/>
      <rect id="v06-g4" width="1080" height="1920" filter="url(#v06-n4)" visibility="hidden"/>
      <rect id="v06-g5" width="1080" height="1920" filter="url(#v06-n5)" visibility="hidden"/>
    </svg>
    <div id="v06-flicker" class="clip v06-layer v06-flicker" data-start="0" data-duration="2.5" data-track-index="6"></div>
  </div>
  <script>
    (function () {
      const D = 2.2, FPS = 30;
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector('[data-composition-id="06-quante-volte"] ' + s);
      const qa = (s) => document.querySelectorAll('[data-composition-id="06-quante-volte"] ' + s);

      // ---- archival grain (swap every 2 frames) + flicker ----
      const tiles = [0, 1, 2, 3, 4, 5].map((i) => q('#v06-g' + i));
      const flick = [0.02, 0.05, 0.01, 0.04, 0.0, 0.03, 0.05, 0.015, 0.035, 0.005, 0.045, 0.025];
      const steps = Math.ceil(D * FPS / 2);
      for (let k = 0; k < steps; k++) {
        const t = (k * 2) / FPS;
        const cur = k % 6, prev = (k + 5) % 6;
        if (k > 0) tl.set(tiles[prev], { attr: { visibility: 'hidden' } }, t);
        tl.set(tiles[cur], { attr: { visibility: 'visible' } }, t);
        tl.set(q('#v06-flicker'), { opacity: flick[(k * 5) % flick.length] }, t);
      }

      // ---- Scene 1 (0.0-1.0): five hard-cut flashes, each a 6-frame clip ----
      // inside each flash: a jerky stepped punch (scale + tilt), no exit (the clip cut is the exit)
      const tilts = [-6, 5, -4, 7, -5];
      for (let i = 0; i < 5; i++) {
        const a = q('#v06-a' + (i + 1));
        const t0 = i * 0.2;
        tl.fromTo(a, { scale: 1.22, rotation: tilts[i], x: -18 }, { scale: 1, rotation: 0, x: 0, duration: 0.1, ease: 'steps(3)' }, t0);
        tl.to(a, { x: 8, y: -6, duration: 0.033, ease: 'steps(1)' }, t0 + 0.13);
        tl.to(a, { x: -5, y: 4, duration: 0.033, ease: 'steps(1)' }, t0 + 0.166);
      }

      // ---- Scene 2 (1.0-2.2): reappear + spiral vortex ----
      // spiral arms (Archimedean, deterministic)
      function spiral(phase) {
        let d = '';
        for (let j = 0; j <= 120; j++) {
          const th = phase + j * 0.09;
          const r = 30 + j * 5.4;
          const x = 540 + r * Math.cos(th), y = 960 + r * Math.sin(th);
          d += (j ? ' L ' : 'M ') + x.toFixed(1) + ' ' + y.toFixed(1);
        }
        return d;
      }
      ['#v06-sp0', '#v06-sp1', '#v06-sp2'].forEach((s, i) => {
        const p = q(s);
        p.setAttribute('d', spiral(i * 2.094));
        let len = 6000; try { len = p.getTotalLength() || 6000; } catch (e) { len = 6000; }
        p.setAttribute('stroke-dasharray', len);
        tl.fromTo(p, { attr: { 'stroke-dashoffset': len } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.36, ease: 'steps(6)' }, 1.0 + i * 0.04);
      });
      tl.fromTo(q('#v06-spiral-g'), { rotation: 0, svgOrigin: '540 960' }, { rotation: 400, svgOrigin: '540 960', duration: 1.2, ease: 'power2.in' }, 1.0);

      // items pop back in (stepped), then swirl inward, spinning faster and faster
      for (let i = 0; i < 5; i++) {
        const it = q('#v06-i' + i);
        tl.fromTo(it, { scale: 0, x: 400, rotation: -40 }, { scale: 1, duration: 0.12, ease: 'steps(3)' }, 1.0 + i * 0.035);
        tl.to(it, { x: 150, scale: 0.62, rotation: 520 + i * 40, duration: 1.04, ease: 'power2.in' }, 1.16);
      }
      tl.fromTo(q('#v06-hub'), { rotation: 0 }, { rotation: 760, duration: 1.2, ease: 'power3.in' }, 1.0);

      // title slams in: overshoot squash/stretch + skew + per-letter scale distortion
      const title = q('#v06-title');
      tl.fromTo(title, { scale: 2.4, skewX: -22, autoAlpha: 0, transformOrigin: '50% 50%' },
        { scale: 1, skewX: 0, autoAlpha: 1, duration: 0.1, ease: 'steps(3)' }, 1.06);
      tl.to(title, { scaleX: 1.08, scaleY: 0.82, duration: 0.05, ease: 'steps(1)' }, 1.16);
      tl.to(title, { scaleX: 0.97, scaleY: 1.06, duration: 0.05, ease: 'steps(1)' }, 1.21);
      tl.to(title, { scaleX: 1, scaleY: 1, duration: 0.05, ease: 'steps(1)' }, 1.26);
      const ls = [1.6, 0.6, 1.4, 0.75, 1.7, 0.8, 1, 1.5, 0.7, 1.35, 0.65, 1.55, 1.9];
      qa('#v06-title span').forEach((sp, i) => {
        tl.fromTo(sp, { scale: ls[i], y: (i % 2 ? 14 : -14) }, { scale: 1, y: 0, duration: 0.24, ease: 'steps(4)' }, 1.1 + (i % 4) * 0.02);
      });
      // nervous tremor on the title while the vortex accelerates
      const tx = [3, -4, 2, -3, 4, -2, 3, -4, 2, -3];
      tx.forEach((v, i) => tl.set(title, { x: v, rotation: v * 0.15 }, 1.4 + i * 0.08));

      tl.to({}, { duration: 0.001 }, D - 0.001);
      window.__timelines = window.__timelines || {};
      window.__timelines["06-quante-volte"] = tl;
    })();
  </script>
