        function landStamp(el, t, liftAt) {
          var s = t - STAMP_LEAD;
          tl.fromTo(el, { opacity: 0, scale: 1.35, rotation: -12, y: 0 },
                        { opacity: 0.94, scale: 0.94, duration: 0.12, ease: "power3.in" }, s);
          tl.to(el, { scale: 1, duration: 0.22, ease: "back.out(2.4)" }, s + 0.12);
          // thud: stage nudges down a few px on impact
          tl.fromTo(stage, { y: 0 }, { y: 7, duration: 0.05, ease: "power2.out", immediateRender: false }, s + 0.12);
          tl.to(stage, { y: 0, duration: 0.22, ease: "sine.out" }, s + 0.17);

            tl.to(el, { opacity: 0, scale: 1.1, y: -60, duration: 0.3, ease: "sine.in" }, liftAt);
          }
        }

        // ---------- generic soft swap in / out of an illustration group ----------
        function groupIn(el, t) {
          tl.fromTo(el, { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t);
        }
        function groupOut(el, t) {
          tl.to(el, { opacity: 0, x: -70, duration: SWAP_LEAD, ease: "sine.in" }, t);
        }
        // stepped "red" jitter (deterministic offsets, steps)
        function jitter(el, t0, t1, amp) {
          var offs = [-1, 0.8, -0.6, 1, -0.4, 0.7, -0.9, 0.5];
          var n = Math.max(2, Math.floor((t1 - t0) / 0.07));
          for (var i = 0; i < n; i++) tl.set(el, { x: offs[i % offs.length] * amp, rotation: offs[(i + 3) % offs.length] * amp * 0.25 }, t0 + i * 0.07);

        tl.to(q("#v10-circle-green"), { strokeDashoffset: 0, duration: 0.6, ease: "sine.inOut" }, BEATS.maestraA + 0.5);
        // gentle sway to the end
        tl.fromTo(q("#v10-lounger"), { rotation: 0 }, { rotation: -2, svgOrigin: "420 1380", duration: DUR - BEATS.maestraA - 0.9, ease: "sine.inOut" }, BEATS.maestraA + 0.9);
        // smoking: ember glows, smoke puffs rise and drift up-right, fading (finite, explicit tweens until DUR)
        var puffs = qa(".v10-puff");
        tl.set(puffs, { opacity: 0, x: 368, y: 1050, scale: 0.4, rotation: 0, transformOrigin: "50% 50%" }, 0);
        var glow = q("#v10-ember-glow");
        for (var gt = BEATS.maestraA + 0.9, gk = 0; gt < DUR - 0.05; gt += 0.45, gk++) {
          tl.to(glow, { opacity: gk % 2 ? 0.25 : 0.6, scale: gk % 2 ? 1 : 1.25, transformOrigin: "50% 50%", duration: Math.min(0.45, DUR - gt), ease: "sine.inOut" }, gt);
        }
        var drift = [[0, 0], [24, -10], [-14, 8]];
        for (var st = BEATS.maestraA + 0.5, sk = 0; st < DUR - 0.15; st += 0.5, sk++) {
          var pf = puffs[sk % 3], dv = drift[sk % 3];
          var life = Math.min(1.5, DUR - st);
          tl.fromTo(pf, { opacity: 0, x: 376, y: 1040, scale: 0.7, rotation: -10 },
            { x: 376 + (105 + dv[0]) * life / 1.5, y: 1040 - (270 + dv[1]) * life / 1.5, scale: 0.7 + 1.6 * life / 1.5, rotation: 14 * life / 1.5, duration: life, ease: "sine.out", immediateRender: false }, st);
          tl.to(pf, { opacity: 0.95, duration: Math.min(0.25, life), ease: "sine.out" }, st);
          if (life > 0.7) tl.to(pf, { opacity: 0, duration: life - 0.7, ease: "sine.in" }, st + 0.7);
        }
        tl.fromTo(q("#v10-sheet"), { rotation: 0 }, { rotation: 1.5, svgOrigin: "750 1000", duration: DUR - BEATS.maestraA - 0.6, ease: "sine.inOut" }, BEATS.maestraA + 0.6);

        // ================= Atmosphere: grain swap every 2 frames + flicker =================
        var tiles = qa(".v10-grain");
        var flick = q("#v10-flicker");
        var steps = Math.ceil(DUR * 15);
        for (var i = 1; i < steps; i++) {
          var t = i / 15;
          tl.set(tiles[(i + 3) % 4], { opacity: 0 }, t);
          tl.set(tiles[i % 4], { opacity: 1 }, t);
          tl.set(flick, { opacity: 0.015 + 0.04 * (((i * 37) % 11) / 10) }, t);
        }
        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
