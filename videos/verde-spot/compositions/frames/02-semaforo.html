  <script>
    (function () {
      var D = 3.3;
      var q = function (s) { return document.querySelector('[data-composition-id="02-semaforo"] ' + s); };

      var tl = gsap.timeline({ paused: true });

      // ---- film grain (tile swap every 2 frames) + flicker, deterministic ----
      var tiles = [q("#v02-gr0"), q("#v02-gr1"), q("#v02-gr2"), q("#v02-gr3")];
      var order = [0, 2, 1, 3, 2, 0, 3, 1];
      var flick = q("#v02-flick");

      for (var i = 0; i <= steps; i++) {
        var t = i / 15;
        if (t > D) t = D;

        tl.set(flick, { opacity: 0.03 + 0.03 * Math.sin(i * 2.399) * Math.cos(i * 0.77) }, t);
      }

      // ---- Scene 1 (0.0–1.0): traffic light slides in on the diagonal, nervous steps ----
      var light = q("#v02-light");

        tl.to(light, { x: s[0], rotation: s[1], duration: 0.03, ease: "none" }, 0.84 + k * 0.03);

      // typewriter caption
      tl.fromTo(qa("#v02-fig .v02-ch"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, stagger: 0.032 }, 0.3);

        { opacity: 1, scale: 1, duration: 0.12, ease: "steps(3)" }, 1.0);
      tl.fromTo(q("#v02-redflash"), { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" },
        { opacity: 1, duration: 0.001, ease: "none" }, 1.0);
      tl.to(q("#v02-redflash"), { opacity: 0, scale: 1.7, duration: 0.24, ease: "steps(4)" }, 1.001);
      tl.to(light, { rotation: -10.5, x: -8, duration: 0.04, ease: "none" }, 1.0);
      tl.to(light, { rotation: -6.5, x: 6, duration: 0.04, ease: "none" }, 1.04);
      tl.to(light, { rotation: -8, x: 0, duration: 0.04, ease: "none" }, 1.08);

      var carA = q("#v02-carA"), carB = q("#v02-carB"), carC = q("#v02-carC");
      var bodyA = q("#v02-carA .v02-carbody"), bodyB = q("#v02-carB .v02-carbody"), bodyC = q("#v02-carC .v02-carbody");
      var spA = q("#v02-carA .v02-speed"), spB = q("#v02-carB .v02-speed"), spC = q("#v02-carC .v02-speed");

      tl.fromTo(bodyA, { scaleX: 1, skewX: 0, transformOrigin: "100% 100%" },

      tl.to(bodyA, { scaleX: 1, skewX: 0, duration: 0.09, ease: "steps(3)" }, 1.3);
      tl.to(spA, { opacity: 0, duration: 0.06, ease: "steps(2)" }, 1.27);

      // car B slams into A
      tl.fromTo(carB, { x: -1250 }, { x: 0, duration: 0.22, ease: "steps(5)" }, 1.2);
      tl.fromTo(bodyB, { scaleX: 1, skewX: 0, transformOrigin: "100% 100%" },

      tl.to(bodyB, { scaleX: 0.84, skewX: -4, duration: 0.08, ease: "steps(2)" }, 1.45);
      tl.to(spB, { opacity: 0, duration: 0.06, ease: "steps(2)" }, 1.42);
      tl.to(carA, { x: 22, rotation: 3, duration: 0.04, ease: "none" }, 1.42);

      // car C slams into B
      tl.fromTo(carC, { x: -1500 }, { x: 0, duration: 0.22, ease: "steps(5)" }, 1.38);
      tl.fromTo(bodyC, { scaleX: 1, skewX: 0, transformOrigin: "100% 100%" },

      tl.to(bodyC, { scaleX: 0.82, skewX: -5, duration: 0.08, ease: "steps(2)" }, 1.63);
      tl.to(spC, { opacity: 0, duration: 0.06, ease: "steps(2)" }, 1.6);
      tl.to(carB, { x: 30, rotation: -2, duration: 0.04, ease: "none" }, 1.6);
      tl.to(bodyB, { scaleX: 0.66, skewX: -9, duration: 0.04, ease: "none" }, 1.6);
      tl.to(carA, { x: 36, rotation: 5, duration: 0.04, ease: "none" }, 1.6);
      // row rattles after the pile-up
      var rattle = [[0, 1.7, -4], [0, 1.76, 3], [0, 1.82, -2], [0, 1.88, 0]];

      // ---- Scene 3 (2.0–3.3): clock with wild hands; RITARDO! slams in ----
      var clock = q("#v02-clock");
      tl.fromTo(clock, { scale: 0, rotation: -40, transformOrigin: "50% 50%" },

      tl.fromTo(q("#v02-hhour"), { rotation: 0, svgOrigin: "150 150" },

      tl.fromTo(title, { scale: 2.4, skewX: -30, x: -140, opacity: 0, transformOrigin: "50% 50%" },

      tl.to(title, { scaleX: 1.14, scaleY: 0.82, duration: 0.04, ease: "none" }, 2.29);
      tl.to(title, { scaleX: 1, scaleY: 1, duration: 0.12, ease: "back.out(4)" }, 2.33);
      var letterScale = [1.8, 0.6, 1.5, 0.7, 1.6, 0.8, 1.4, 1.9];
