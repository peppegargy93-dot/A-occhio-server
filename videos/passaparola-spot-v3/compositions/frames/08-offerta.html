  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (n) { return document.getElementById("f08-" + n); };

      // split the title into per-letter spans (deterministic)
      var chars = [];
      Array.prototype.forEach.call($("title").querySelectorAll("[data-split]"), function (line) {
        var txt = line.textContent;
        line.textContent = "";
        for (var i = 0; i < txt.length; i++) {
          var s = document.createElement("span");
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          s.textContent = txt[i];
          line.appendChild(s);
          chars.push(s);
        }
      });

      var tl = gsap.timeline({ paused: true });
      var SPRING = "expo.out"; // critically damped, no bounce

      // ---- virtual camera: always moving, two motivated legs ----
      tl.fromTo($("world"), { scale: 1.0, y: 24 }, { scale: 1.02, y: 0, duration: 1.2, ease: "sine.inOut" }, 0);
      tl.to($("world"), { scale: 1.04, y: -14, duration: 1.3, ease: "sine.inOut" }, 1.2);

      // ---- Scene 1 (0.0–1.2): title types, neutral tiles spring in left→right ----
      tl.fromTo(chars, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.26, ease: SPRING, stagger: 0.04 }, 0.05);

      var tileAt = [0.2, 0.38, 0.56];
      tileAt.forEach(function (t, i) {
        var n = i + 1;
        tl.fromTo($("tile" + n), { y: 70, scale: 0.86, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: SPRING }, t);
        tl.fromTo($("word" + n), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: SPRING }, t + 0.1);
      });
      tl.fromTo([$("dot1"), $("dot2")], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.18 }, 0.5);

      // ---- Scene 2 (1.2–2.5): each tile flips to the venue look, one per ~0.25s ----
      var flipAt = [1.2, 1.45, 1.7];
      flipAt.forEach(function (t, i) {
        var n = i + 1;
        tl.fromTo($("flip" + n), { rotationY: 0, transformPerspective: 1100 },
          { rotationY: 180, transformPerspective: 1100, duration: 0.55, ease: "power3.inOut" }, t);
        tl.fromTo($("tile" + n), { scale: 1 }, { scale: 1.05, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
        tl.to($("tile" + n), { scale: 1, duration: 0.35, ease: SPRING }, t + 0.25);
      });

      // subline under the labels
      tl.fromTo($("sub").children, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: SPRING, stagger: 0.12 }, 1.55);

      // ---- mascot (overshoot allowed only here): pop, then a small hop ----
      tl.fromTo($("mascot"), { scale: 0, rotation: -24 }, { scale: 1, rotation: 8, duration: 0.45, ease: "back.out(2.4)" }, 1.3);
      tl.to($("mascot"), { y: -22, rotation: -4, duration: 0.15, ease: "power2.out" }, 1.95);
      tl.to($("mascot"), { y: 0, rotation: 6, duration: 0.3, ease: "back.out(3)" }, 2.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["08-offerta"] = tl;
    })();
  </script>
