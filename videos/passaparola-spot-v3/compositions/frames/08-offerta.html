  <script>
    (function () {
      var $ = function (n) { return document.getElementById("f08-" + n); };

      // split the price into per-letter spans (deterministic)
      var chars = [];
      Array.prototype.forEach.call($("price").querySelectorAll("[data-part]"), function (part) {
        var txt = part.textContent;
        part.textContent = "";
        for (var i = 0; i < txt.length; i++) {
          var s = document.createElement("span");
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          s.textContent = txt[i];
          part.appendChild(s);
          chars.push(s);
        }
      });

      var tl = gsap.timeline({ paused: true });
      var SPRING = "expo.out"; // critically damped, no bounce

      // ---- virtual camera: always moving, two motivated legs ----
      tl.fromTo($("world"), { scale: 1.0, y: 30 }, { scale: 1.035, y: 0, duration: 1.2, ease: "sine.inOut" }, 0);
      tl.to($("world"), { scale: 1.06, y: -24, duration: 1.4, ease: "sine.inOut" }, 1.2);

      // ---- Scene 1 (0.0–1.2): row arrives, icons light up per spoken word ----
      var cards = [$("card1"), $("card2"), $("card3")];
      tl.fromTo(cards, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: SPRING, stagger: 0.05 }, 0);
      tl.fromTo([$("word1"), $("word2"), $("word3")],
        { opacity: 0.22, color: "#9A9A9A" }, { opacity: 0.22, color: "#9A9A9A", duration: 0.01 }, 0);
      tl.fromTo([$("dot1"), $("dot2")], { opacity: 0 }, { opacity: 0.6, color: "#B5392C", duration: 0.2, ease: "power2.out" }, 0.1);

      var lightAt = [0.1, 0.46, 0.84];
      lightAt.forEach(function (t, i) {
        var n = i + 1;
        var strokes = $("lit" + n).querySelectorAll("[pathLength]");
        tl.fromTo(strokes, { attr: { "stroke-dasharray": "1 1", "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.38, ease: "power2.out", stagger: 0.04 }, t);
        tl.fromTo($("fill" + n), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t);
        tl.fromTo($("card" + n), { scale: 0.9 }, { scale: 1, duration: 0.45, ease: SPRING, immediateRender: false }, t);
        tl.fromTo($("word" + n), { opacity: 0.22, color: "#9A9A9A", y: 10 },
          { opacity: 1, color: "#1F1A17", y: 0, duration: 0.3, ease: SPRING, immediateRender: false }, t + 0.02);
      });

      // ---- Scene 2 (1.2–2.6): "Da 400 €" types letter by letter, sub-line follows ----
      tl.fromTo(chars, { opacity: 0, y: 60, scale: 0.86 },
        { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: SPRING, stagger: 0.035 }, 1.2);
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.inOut" }, 1.55);
      tl.fromTo($("sub"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: SPRING }, 1.78);

      // ---- mascot (overshoot allowed only here) ----

      tl.to($("mascot"), { y: -16, duration: 0.14, ease: "power2.out" }, 2.12);
      tl.to($("mascot"), { y: 0, rotation: 4, duration: 0.34, ease: "back.out(3)" }, 2.26);
