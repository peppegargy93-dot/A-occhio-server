      var FID = "05-si-sale";
      var root = document.querySelector('[data-composition-id="05-si-sale"]');
      var q = function (id) { return root.querySelector("#" + id); };

      // critically damped spring (zeta = 1): springy, no overshoot
      function springEase(w) {
        var norm = 1 - (1 + w) * Math.exp(-w);
        return function (p) { return (1 - (1 + w * p) * Math.exp(-w * p)) / norm; };
      }
      var spring = springEase(9);

      function splitChars(el) {
        var text = el.textContent;
        el.textContent = "";
        var out = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.className = "f05-ch";
          s.textContent = text[i];
          el.appendChild(s);
          out.push(s);
        }
        return out;
      }
      var charsA = splitChars(q("f05-title-a"));
      var charsB = splitChars(q("f05-title-b"));

      var tl = gsap.timeline({ paused: true });

      // ---------- camera: motivated legs on .world ----------
      // leg 1: tight on the counter; leg 2: tilt down to reveal the ranking; leg 3: slow settle drift
      tl.fromTo(q("f05-world"), { scale: 1.06, y: 30 }, { scale: 1.03, y: 18, duration: 1.15, ease: "power1.out" }, 0);
      tl.to(q("f05-world"), { scale: 1.0, y: 0, duration: 1.0, ease: "sine.inOut" }, 1.15);
      tl.to(q("f05-world"), { scale: 1.015, y: -6, duration: 0.65, ease: "sine.out" }, 2.15);

      // ---------- Scene 1: counter 34 -> 300 (counting-dynamic-scale) ----------
      var counter = q("f05-counter"), rowCount = q("f05-row-count");
      var state = { v: 34 };
      var COUNT_AT = 0.05, COUNT_DUR = 1.1, COUNT_EASE = "power3.out";
      tl.fromTo(state, { v: 34 }, {
        v: 300, duration: COUNT_DUR, ease: COUNT_EASE,
        onUpdate: function () { var t = String(Math.round(state.v)); counter.textContent = t; rowCount.textContent = t; }
      }, COUNT_AT);
      tl.fromTo(counter, { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo(q("f05-label"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: spring }, 0.2);

      // title A types letter by letter
      tl.fromTo(charsA, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.2, ease: spring, stagger: 0.035 }, 0.12);
      // title B held hidden until Scene 2
      tl.fromTo(charsB, { opacity: 0, y: 22 }, { opacity: 0, y: 22, duration: 0.01 }, 0);

      // ---------- Scene 2: ranking card arrives, Marea climbs #3 -> #1 ----------
      var SLOT = [32, 160, 288];
      tl.fromTo(q("f05-card"), { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.5, ease: spring }, 1.0);
      tl.fromTo(q("f05-row-a"), { y: 0 }, { y: 0, duration: 0.01 }, 0);
      tl.fromTo(q("f05-row-b"), { y: SLOT[1] - SLOT[0] }, { y: SLOT[1] - SLOT[0], duration: 0.01 }, 0);
      tl.fromTo(q("f05-row-marea"), { y: SLOT[2] - SLOT[0] }, { y: SLOT[2] - SLOT[0], duration: 0.01 }, 0);
      tl.fromTo([q("f05-a-r2"), q("f05-b-r3"), q("f05-m-r1")], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      var CLIMB_AT = 1.45, CLIMB_DUR = 0.7;
      tl.fromTo(q("f05-row-hl"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, CLIMB_AT - 0.05);
      tl.fromTo(q("f05-arrow"), { opacity: 0, y: 26, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: spring }, CLIMB_AT);
      tl.to(q("f05-row-marea"), { y: 0, duration: CLIMB_DUR, ease: spring }, CLIMB_AT);
      tl.fromTo(q("f05-row-marea"), { scale: 1 }, { scale: 1.03, duration: 0.3, ease: "power2.out" }, CLIMB_AT);
      tl.to(q("f05-row-marea"), { scale: 1, duration: 0.4, ease: spring }, CLIMB_AT + 0.3);
      tl.to(q("f05-row-b"), { y: SLOT[2] - SLOT[0], duration: 0.55, ease: spring }, CLIMB_AT + 0.08);
      tl.to(q("f05-row-a"), { y: SLOT[1] - SLOT[0], duration: 0.55, ease: spring }, CLIMB_AT + 0.26);
      // rank numbers swap
      tl.fromTo(q("f05-b-r2"), { opacity: 1 }, { opacity: 0, duration: 0.15 }, CLIMB_AT + 0.2);
      tl.to(q("f05-b-r3"), { opacity: 1, duration: 0.15 }, CLIMB_AT + 0.2);
      tl.fromTo(q("f05-a-r1"), { opacity: 1 }, { opacity: 0, duration: 0.15 }, CLIMB_AT + 0.38);
      tl.to(q("f05-a-r2"), { opacity: 1, duration: 0.15 }, CLIMB_AT + 0.38);
      tl.fromTo(q("f05-m-r3"), { opacity: 1, y: 0 }, { opacity: 0, y: 18, duration: 0.18 }, CLIMB_AT + 0.4);
      tl.fromTo(q("f05-m-r1"), { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.3, ease: spring, immediateRender: false }, CLIMB_AT + 0.45);
      // arrow nudge as Marea lands on top

      tl.to(q("f05-arrow"), { y: 0, duration: 0.3, ease: spring }, CLIMB_AT + 0.77);

      // title B completes letter by letter

      window.__timelines = window.__timelines || {};
