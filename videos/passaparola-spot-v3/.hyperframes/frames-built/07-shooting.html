  <script>
    (function () {
      var FID = "07-shooting";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      var q = function (id) { return root.querySelector("#" + id); };

      // split titles into per-letter spans (deterministic)
      function split(el) {
        var txt = el.textContent, out = [];
        el.textContent = "";
        for (var i = 0; i < txt.length; i++) {
          var s = document.createElement("span");
          s.className = "f07-ch";
          s.textContent = txt[i];
          el.appendChild(s);
          out.push(s);
        }
        return out;
      }
      var charsA = split(q("f07-title-a"));
      var charsB = split(q("f07-title-b"));
      var chars = charsA.concat(charsB);

      var tl = gsap.timeline({ paused: true });
      var SPRING = "expo.out";
      var FLY = "expo.inOut";

      // ---------- virtual camera: motivated legs ----------
      tl.fromTo(q("f07-world"), { scale: 1.0, y: 0 }, { scale: 1.045, y: -8, duration: 1.3, ease: "sine.inOut" }, 0);
      tl.to(q("f07-world"), { scale: 1.0, y: 0, duration: 1.0, ease: "power2.out" }, 1.3);
      tl.to(q("f07-world"), { scale: 1.02, y: -6, duration: 0.9, ease: "sine.inOut" }, 2.3);

      // ---------- Scene 1 (0.0–1.2): viewfinder boots, AF locks, title types ----------

      tl.fromTo(q("f07-brackets"), { scale: 1.06 }, { scale: 1, duration: 0.45, ease: SPRING }, 0.02);
      tl.fromTo(q("f07-rec"), { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: SPRING }, 0.08);
      tl.fromTo(q("f07-shutter"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: SPRING }, 0.12);
      [0.45, 0.8, 1.15].forEach(function (t, i) { tl.set(q("f07-recdot"), { opacity: i % 2 === 0 ? 0.2 : 1 }, t); });

      // AF: search -> lock
      tl.fromTo(q("f07-af"), { scale: 1.7, opacity: 0, x: 60, y: -50 }, { scale: 1, opacity: 1, x: 0, y: 0, duration: 0.45, ease: SPRING }, 0.2);
      tl.to(q("f07-af"), { scale: 0.9, duration: 0.06, ease: "power2.out" }, 0.78);
      tl.to(q("f07-af"), { scale: 1, duration: 0.2, ease: SPRING }, 0.84);

      // title types letter by letter (readable from ~0.9s to the end)
      tl.fromTo(chars, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.2, ease: SPRING, stagger: 0.03 }, 0.1);

      // ---------- Scene 2 (1.2–1.6): shutter + white flash ----------
      tl.to(q("f07-shutter-in"), { scale: 0.82, duration: 0.07, ease: "power2.in" }, 1.18);
      tl.to(q("f07-shutter-in"), { scale: 1, duration: 0.2, ease: SPRING }, 1.26);
      tl.fromTo([q("f07-blade-top"), q("f07-blade-bot")], { scaleY: 0 }, { scaleY: 1, duration: 0.08, ease: "power2.in" }, 1.22);
      tl.to([q("f07-blade-top"), q("f07-blade-bot")], { scaleY: 0, duration: 0.12, ease: "power2.out" }, 1.30);
      tl.fromTo(q("f07-flash"), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 1.28);
      tl.to(q("f07-flash"), { opacity: 0, duration: 0.32, ease: "power2.out" }, 1.36);

      // under the flash peak: dark ground + viewfinder chrome go away, title becomes ink
      tl.set([q("f07-ground-dark"), q("f07-vfui"), q("f07-shutter")], { opacity: 0 }, 1.33);
      tl.set(chars, { color: "#1F1A17" }, 1.33);
      tl.set(q("f07-photo"), { boxShadow: "0 40px 80px -24px rgba(31,26,23,0.28), 0 12px 24px -12px rgba(31,26,23,0.18)" }, 1.33);

      // ---------- Scene 3 (1.6–3.2): phone rises, photo flies into the dish slot ----------
      tl.fromTo(q("f07-phone"), { y: 520, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: SPRING }, 1.38);
      tl.fromTo(q("f07-slot-plus"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.6);

      // photo window (60,440 960x781) -> slot (142,748 516x420); transform-origin 0 0
      tl.set(q("f07-photo"), { transformOrigin: "0px 0px" }, 1.59);
      tl.fromTo(q("f07-photo"),
        { x: 0, y: 0, scale: 1, rotation: 0, borderRadius: 28 },
        { x: 120, y: 60, scale: 0.86, rotation: -3, borderRadius: 30, duration: 0.18, ease: "power2.out", immediateRender: false }, 1.6);
      tl.to(q("f07-photo"), { x: 82, y: 308, scale: 0.5375, rotation: 0, borderRadius: 44, duration: 0.5, ease: FLY }, 1.78);
      tl.to(q("f07-slot"), { borderColor: "rgba(224,176,75,0)", duration: 0.1, ease: "none" }, 2.24);
      // settle kiss on landing
      tl.to(q("f07-phone"), { y: 6, duration: 0.07, ease: "power2.out" }, 2.28);
      tl.to(q("f07-phone"), { y: 0, duration: 0.25, ease: SPRING }, 2.35);
      tl.to(q("f07-photo"), { y: 314, duration: 0.07, ease: "power2.out" }, 2.28);
      tl.to(q("f07-photo"), { y: 308, duration: 0.25, ease: SPRING }, 2.35);

      // caption row lands with the photo
      tl.fromTo(q("f07-caption"), { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: SPRING }, 2.3);
      tl.fromTo([q("f07-row1"), q("f07-row2")], { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: SPRING, stagger: 0.06 }, 1.75);

      // swatches pop beside the phone
      tl.fromTo(q("f07-chip1"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: SPRING }, 2.45);
      tl.fromTo(q("f07-hex1"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: SPRING }, 2.55);

      tl.fromTo(q("f07-hex2"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: SPRING }, 2.72);

      window.__timelines = window.__timelines || {};

  </script>
