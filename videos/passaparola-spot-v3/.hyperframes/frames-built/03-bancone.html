<template id="f03-bancone-template">
  <style>
    @font-face { font-family: "Space Grotesk"; font-weight: 500; font-style: normal; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "Space Grotesk"; font-weight: 600; font-style: normal; src: url("assets/fonts/space-grotesk-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Space Grotesk"; font-weight: 700; font-style: normal; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 500; font-style: normal; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }

    #root {
      position: absolute; inset: 0;
      width: 1080px; height: 1920px;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      color: #1F1A17;
    }
    #root * { box-sizing: border-box; }

    /* ---------- full-bleed ground (clip layer) ---------- */
    #f03-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 55% at 50% 30%, #FDFAF4 0%, #FAF6EF 55%, #F1E8DA 100%);
    }

    /* ---------- virtual camera: cam scales about canvas center, world translates ---------- */
    #f03-stage { position: absolute; inset: 0; overflow: hidden; }
    #f03-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #f03-world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

    /* back wall: warm white with a soft ochre lamp glow; extends above for the tilt-down */
    #f03-wall {
      position: absolute; left: -800px; top: -900px; width: 2680px; height: 2345px;
      background:
        radial-gradient(ellipse 620px 520px at 1340px 1500px, rgba(226,176,79,0.16), transparent 70%),
        linear-gradient(#FAF6EF, #F2E9DB);
    }
    /* counter seen from the front: thin top surface + warm wood front face */
    #f03-counter-top {
      position: absolute; left: -800px; top: 1440px; width: 2680px; height: 64px;
      background: linear-gradient(#D9B68C, #C79D6E);
    }
    #f03-counter-edge {
      position: absolute; left: -800px; top: 1500px; width: 2680px; height: 14px;
      background: linear-gradient(#E6C89F, #B88A5B);
      box-shadow: 0 10px 18px -6px rgba(31,26,23,0.35);
    }
    #f03-counter-front {
      position: absolute; left: -800px; top: 1514px; width: 2680px; height: 1400px;
      background:
        repeating-linear-gradient(90deg, transparent 0 358px, rgba(70,40,20,0.22) 358px 361px),
        repeating-linear-gradient(0deg, rgba(90,55,25,0.07) 0 3px, transparent 3px 13px),
        repeating-linear-gradient(0deg, rgba(255,235,200,0.05) 0 1px, transparent 1px 37px),
        linear-gradient(#A8784A, #8A5E36 60%, #6F4A2A);
    }

    /* plaque contact shadow on the counter top */
    #f03-plaque-shadow {
      position: absolute; left: 230px; top: 1436px; width: 620px; height: 56px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(31,26,23,0.42), rgba(31,26,23,0) 70%);
    }

    /* ---------- the NFC plaque: Osteria Marea navy plexiglass ---------- */
    #f03-plaque {
      position: absolute; left: 260px; top: 700px; width: 560px; height: 760px;
      border-radius: 32px;
      background: linear-gradient(165deg, #1A4560 0%, #123247 45%, #0C2434 100%);
      border: 1.5px solid rgba(255,255,255,0.22);
      box-shadow: 0 40px 80px -24px rgba(31,26,23,0.45), 0 12px 24px -12px rgba(31,26,23,0.3), inset 0 2px 0 rgba(255,255,255,0.18);
      overflow: hidden;
    }
    #f03-gloss {
      position: absolute; inset: 0;
      background: linear-gradient(150deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.05) 32%, rgba(255,255,255,0) 46%);
    }
    #f03-sheen {
      position: absolute; left: -260px; top: -200px; width: 150px; height: 1200px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.18), rgba(255,255,255,0));
      rotate: 22deg;
    }
    #f03-logo { position: absolute; left: 170px; top: 64px; width: 220px; height: 110px; }
    #f03-logo svg, #f03-nfc svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .f03-ptxt { position: absolute; left: 0; width: 560px; text-align: center; white-space: nowrap; }
    #f03-venue { top: 196px; font: 600 46px/1 "Space Grotesk", sans-serif; letter-spacing: 0.05em; color: #E0B04B; }
    #f03-divider { position: absolute; left: 240px; top: 272px; width: 80px; height: 3px; border-radius: 2px; background: rgba(224,176,75,0.7); }
    #f03-ask { top: 310px; font: 700 60px/1 "Space Grotesk", sans-serif; letter-spacing: -0.01em; color: #FFFFFF; }
    #f03-nfc { position: absolute; left: 190px; top: 420px; width: 180px; height: 180px; }
    #f03-nfc-glow {
      position: absolute; left: 130px; top: 360px; width: 300px; height: 300px; border-radius: 50%;
      background: radial-gradient(circle, rgba(224,176,75,0.45), rgba(224,176,75,0) 68%);
    }
    #f03-tap { top: 628px; font: 600 44px/1 "Space Grotesk", sans-serif; letter-spacing: 0.02em; color: #E0B04B; }
    #f03-pp { top: 712px; font: 500 18px/1 "Inter", sans-serif; letter-spacing: 0.06em; color: rgba(255,255,255,0.55); }

    /* coral concentric rings, centered on the NFC zone at world (540, 1210) */
    #f03-burst {
      position: absolute; left: 400px; top: 1070px; width: 280px; height: 280px; border-radius: 50%;
      background: radial-gradient(circle, rgba(181,57,44,0.6), rgba(181,57,44,0) 70%);
    }
    .f03-ring { position: absolute; border: 6px solid #B5392C; border-radius: 50%; }
    #f03-ring1 { left: 400px; top: 1070px; width: 280px; height: 280px; }
    #f03-ring2 { left: 310px; top: 980px; width: 460px; height: 460px; }
    #f03-ring3 { left: 210px; top: 880px; width: 660px; height: 660px; }

    /* ---------- phone (screen facing camera); origin = contact point (220,130) ---------- */
    #f03-phone {
      position: absolute; left: 320px; top: 1080px; width: 440px; height: 920px;
      transform-origin: 220px 130px;
      background: #1F1A17; border-radius: 70px; padding: 14px;
      box-shadow: 0 40px 80px -24px rgba(31,26,23,0.45), 0 12px 24px -12px rgba(31,26,23,0.3);
    }
    #f03-screen {
      position: relative; width: 100%; height: 100%;
      border-radius: 56px; overflow: hidden;
      background: linear-gradient(170deg, #34404A 0%, #1E262D 60%, #161B20 100%);
    }
    #f03-island { position: absolute; left: 156px; top: 18px; width: 100px; height: 28px; border-radius: 100px; background: #0E0C0B; }
    #f03-screen-hint {
      position: absolute; left: 106px; top: 16px; width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(224,176,75,0.4), rgba(224,176,75,0) 70%);
    }
    /* screen wakes white from the contact point (screen-local 206,116) */
    #f03-screen-bloom { position: absolute; left: 166px; top: 76px; width: 80px; height: 80px; border-radius: 50%; background: #FFFFFF; }

    /* world-space bloom from the screen center (540,1540) for a guaranteed white fill */
    #f03-bloom { position: absolute; left: 490px; top: 1490px; width: 100px; height: 100px; border-radius: 50%; background: #FFFFFF; }

    /* ---------- title (screen space, approved copy) ---------- */
    #f03-title {
      position: absolute; left: 80px; top: 190px; width: 920px;
      font: 700 132px/1.05 "Space Grotesk", sans-serif;
      letter-spacing: 0.02em; color: #1F1A17; text-align: center;
    }
    .f03-line { display: block; white-space: nowrap; }
    .f03-ch { display: inline-block; }
    .f03-sp { display: inline-block; width: 0.3em; }
    .f03-coral { color: #B5392C; }

    #f03-grain { position: absolute; inset: 0; opacity: 0.08; pointer-events: none; }
    #f03-grain svg { width: 100%; height: 100%; display: block; }
    #f03-page { position: absolute; inset: 0; background: #FFFFFF; }
  </style>

  <div id="root" data-composition-id="03-bancone" data-width="1080" data-height="1920" data-duration="3.4">

    <div id="f03-bg" class="clip" data-start="0" data-duration="3.4" data-track-index="0"></div>

    <div id="f03-stage" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
      <div id="f03-cam">
        <div id="f03-world" data-layout-allow-overflow>
          <div id="f03-wall"></div>
          <div id="f03-plaque-shadow"></div>
          <div id="f03-counter-top"></div>
          <div id="f03-counter-edge"></div>
          <div id="f03-counter-front"></div>

          <div id="f03-plaque">
            <div id="f03-gloss"></div>
            <div id="f03-sheen"></div>
            <div id="f03-logo">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100"><ellipse cx="100" cy="50" rx="94" ry="45" fill="none" stroke="#E0B04B" stroke-width="5"/><path d="M28 58 C 48 36, 68 36, 88 54 S 128 74, 148 52 Q 158 40 168 44 Q 162 50 170 56" fill="none" stroke="#E0B04B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div id="f03-venue" class="f03-ptxt">Osteria Marea</div>
            <div id="f03-divider"></div>
            <div id="f03-ask" class="f03-ptxt">Com'è andata?</div>
            <div id="f03-nfc-glow"></div>
            <div id="f03-nfc">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><circle cx="90" cy="90" r="82" fill="none" stroke="#E0B04B" stroke-width="6"/><circle cx="62" cy="90" r="7" fill="#FFFFFF"/><path d="M80 66 A 34 34 0 0 1 80 114" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><path d="M98 52 A 54 54 0 0 1 98 128" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><path d="M116 40 A 72 72 0 0 1 116 140" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/></svg>
            </div>
            <div id="f03-tap" class="f03-ptxt">Tocca qui</div>
            <div id="f03-pp" class="f03-ptxt">passaparola</div>
          </div>

          <div id="f03-burst"></div>

          <div id="f03-phone">
            <div id="f03-screen">
              <div id="f03-screen-hint"></div>
              <div id="f03-screen-bloom"></div>
              <div id="f03-island"></div>
            </div>
          </div>

          <div id="f03-ring1" class="f03-ring"></div>
          <div id="f03-ring2" class="f03-ring"></div>
          <div id="f03-ring3" class="f03-ring"></div>

          <div id="f03-bloom"></div>
        </div>
      </div>
    </div>

    <div id="f03-title" class="clip" data-start="0" data-duration="3.4" data-track-index="2">
      <span class="f03-line"><span class="f03-ch">B</span><span class="f03-ch">a</span><span class="f03-ch">s</span><span class="f03-ch">t</span><span class="f03-ch">a</span><span class="f03-sp"></span><span class="f03-ch">u</span><span class="f03-ch">n</span></span>
      <span class="f03-line f03-coral"><span class="f03-ch">t</span><span class="f03-ch">o</span><span class="f03-ch">c</span><span class="f03-ch">c</span><span class="f03-ch">o</span><span class="f03-ch">.</span></span>
    </div>

    <div id="f03-grain" class="clip" data-start="0" data-duration="3.4" data-track-index="3">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="none">
        <filter id="f03-noise" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
        <rect width="1080" height="1920" filter="url(#f03-noise)"/>
      </svg>
    </div>

    <div id="f03-page" class="clip" data-start="0" data-duration="3.4" data-track-index="4"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "03-bancone";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector('[id="f03-' + id + '"]'); }
      function $$(cls) { return root.querySelectorAll('[class~="f03-' + cls + '"]'); }

      var cam = $("cam"), world = $("world"), phone = $("phone");
      var tl = gsap.timeline({ paused: true });
      var SPRING = "expo.out"; // critically damped feel, no overshoot

      /* ===== Scene 1 (0.0-1.2): camera tilts down onto the counter; plaque settles centered ===== */
      tl.fromTo(world, { x: 0, y: 560 }, { x: 0, y: 0, duration: 1.15, ease: "power3.out" }, 0);
      tl.fromTo(cam, { scale: 1.08 }, { scale: 1, duration: 1.15, ease: "power3.out" }, 0);
      tl.fromTo($("sheen"), { x: 0 }, { x: 900, duration: 1.0, ease: "power2.inOut" }, 0.3);
      tl.fromTo($("nfc-glow"), { opacity: 0, scale: 0.6 }, { opacity: 0.6, scale: 1, duration: 0.6, ease: SPRING }, 0.7);
      // placeholder "page" stays hidden until the handoff
      tl.fromTo($("page"), { opacity: 0 }, { opacity: 0, duration: 0.01, ease: "none" }, 0);
      tl.fromTo($("bloom"), { scale: 0 }, { scale: 0, duration: 0.01, ease: "none" }, 0);
      tl.fromTo($("screen-bloom"), { scale: 0 }, { scale: 0, duration: 0.01, ease: "none" }, 0);
      tl.fromTo($$("ring"), { opacity: 0, scale: 0.25 }, { opacity: 0, scale: 0.25, duration: 0.01, ease: "none" }, 0);
      tl.fromTo($("burst"), { opacity: 0, scale: 1 }, { opacity: 0, scale: 1, duration: 0.01, ease: "none" }, 0);
      tl.fromTo($$("ch"), { opacity: 0, y: 30 }, { opacity: 0, y: 30, duration: 0.01, ease: "none" }, 0);

      /* ===== Scene 2 (1.2-2.4): slow push; phone slides up and touches the NFC zone; rings ===== */
      tl.to(world, { y: -50, duration: 1.3, ease: "sine.inOut" }, 1.15);
      tl.to(cam, { scale: 1.05, duration: 1.3, ease: "sine.inOut" }, 1.15);

      tl.fromTo(phone, { y: 980, rotation: 7, scale: 1 }, { y: 0, rotation: 0, duration: 0.62, ease: SPRING }, 1.2);
      // press-release on contact
      tl.to(phone, { scale: 0.965, duration: 0.1, ease: "power1.in" }, 1.82);
      tl.to(phone, { scale: 1, duration: 0.4, ease: "power2.out" }, 1.92);
      // nfc blip
      tl.to($("nfc-glow"), { opacity: 1, scale: 1.3, duration: 0.25, ease: SPRING }, 1.9);
      tl.to($("burst"), { opacity: 0.85, scale: 2.2, duration: 0.3, ease: "power2.out" }, 1.92);
      tl.to($("burst"), { opacity: 0.2, duration: 0.45, ease: "power2.in" }, 2.22);
      var rings = [$("ring1"), $("ring2"), $("ring3")];
      rings.forEach(function (r, i) {
        var at = 1.94 + i * 0.11;
        tl.to(r, { scale: 1, opacity: 0.9 - i * 0.2, duration: 0.3, ease: "power2.out" }, at);
        tl.to(r, { scale: 1.22, opacity: 0, duration: 0.45, ease: "power1.in" }, at + 0.3);
      });
      // screen wakes from the contact point
      tl.fromTo($("screen-hint"), { opacity: 0.3, scale: 0.8 }, { opacity: 1, scale: 1.4, duration: 0.25, ease: SPRING }, 1.92);
      tl.to($("screen-bloom"), { scale: 26, duration: 0.55, ease: "power2.inOut" }, 2.05);

      /* ===== Scene 3 (2.4-3.4): title types at top; camera zooms into the white phone screen ===== */
      // title types 1.0-1.58s (as the phone rises); its screen-space layer sits above the stage's white bloom, covered only by the handoff page at 3.18
      tl.to($$("ch"), { opacity: 1, y: 0, duration: 0.18, ease: "power2.out", stagger: 0.033 }, 1.0);

      // coordinate-target zoom onto screen center (540,1540): T = (0, 960-1540), cam scale 2.9
      tl.to(world, { x: 0, y: -580, duration: 0.7, ease: "power3.inOut" }, 2.5);
      tl.to(cam, { scale: 2.9, duration: 0.7, ease: "power3.inOut" }, 2.5);
      tl.to($("bloom"), { scale: 14, duration: 0.5, ease: "power2.in" }, 2.7);

      // handoff: pure white full-bleed, scale 1, for the last 0.2s
      tl.fromTo($("page"), { opacity: 0, scale: 1 }, { opacity: 1, scale: 1, duration: 0.04, ease: "none" }, 3.18);

      tl.set({}, {}, 3.4);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
