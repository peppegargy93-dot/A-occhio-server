  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (n) { return document.getElementById("f07-shooting-" + n); };

      // split headline into per-letter spans (deterministic)
      var head = $("headline");
      var chars = [];
      Array.prototype.forEach.call(head.querySelectorAll("[data-part]"), function (part) {
        var txt = part.textContent;
        part.textContent = "";
        for (var i = 0; i < txt.length; i++) {
          var s = document.createElement("span");
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          s.textContent = txt[i];
          part.appendChild(s);
          chars.push(s);
        }
      });

      var tl = gsap.timeline({ paused: true });
      var SPRING = "expo.out";       // critically damped, springy feel, no bounce
      var WHIP = "expo.inOut";

      // ---- viewfinder chrome boots (0.0–0.4) ----
      tl.fromTo($("vf"), { scale: 1.04, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.5, ease: SPRING }, 0);
      tl.fromTo($("grid"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.fromTo($("brackets"), { scale: 1.06, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: SPRING }, 0.02);
      tl.fromTo($("rec"), { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: SPRING }, 0.06);
      tl.fromTo([$("slot1"), $("slot2"), $("slot3")], { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: SPRING, stagger: 0.05 }, 0.08);
      tl.fromTo($("scrim"), { opacity: 0.35 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.1);

      // REC dot blink (discrete sets, no repeat)
      [0.5, 1.0, 1.5, 2.0, 2.5].forEach(function (t, i) { tl.set($("recdot"), { opacity: i % 2 === 0 ? 0.15 : 1 }, t); });

      // ---- virtual camera: always moving ----
      tl.fromTo($("cam"), { scale: 1.0, y: 0, rotation: -0.6 }, { scale: 1.1, y: -18, rotation: 0.6, duration: 3, ease: "none" }, 0);
      // whip 1 (dish -> hands) and whip 2 (hands -> staff)
      tl.fromTo($("world"), { x: 0 }, { x: -1690, duration: 0.24, ease: WHIP, immediateRender: false }, 0.86);
      tl.to($("world"), { x: -3380, duration: 0.24, ease: WHIP }, 1.72);
      [0.86, 1.72].forEach(function (t) {
        tl.fromTo($("world"), { filter: "blur(0px)" }, { filter: "blur(16px)", duration: 0.12, ease: "power2.in", immediateRender: false }, t);
        tl.to($("world"), { filter: "blur(0px)", duration: 0.12, ease: "power2.out" }, t + 0.12);
      });

      // ---- AF square: search -> lock, per shot ----
