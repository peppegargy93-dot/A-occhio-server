                    <path d="M15.5 4.5 H14 A3 3 0 0 0 11 7.5 V20 M8 11 H15" fill="none" stroke="#FAF6EF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div class="sv05-ico">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5.5" width="18" height="13" rx="4" fill="none" stroke="#FAF6EF" stroke-width="2"/>
                    <path d="M10.5 9.3 L15 12 L10.5 14.7 Z" fill="#FAF6EF"/>
                  </svg>
                </div>
              </div>
            </div>
            <div class="sv05-screen-off"></div>
          </div>
        </div>

        <!-- chat bubble (WhatsApp-like, no logo) -->
        <div class="sv05-abs sv05-bubble">Ciao! Un tavolo per 4 stasera?<svg class="sv05-ticks" viewBox="0 0 30 18" aria-hidden="true"><path d="M2 10 L7 15 L16 4 M12 13 L14 15 L24 4" fill="none" stroke="#5B9BB8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

        <!-- right column, letter by letter on the spoken cues -->
        <div class="sv05-abs sv05-col">
          <div class="sv05-w1" data-split="Menu."></div>
          <div class="sv05-w2" data-split="Prenotazioni."></div>
          <div class="sv05-w3 sv05-coral" data-split="Social."></div>
        </div>

        <div class="sv05-abs sv05-tap-ring"></div>

        <!-- mascot -->
        <div class="sv05-abs sv05-mascot">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 6 L62 37 L95 38 L69 58 L78 91 L50 72 L22 91 L31 58 L5 38 L38 37 Z" fill="#B5392C" stroke="#B5392C" stroke-width="6" stroke-linejoin="round"/>
            <ellipse cx="41" cy="50" rx="5" ry="7" fill="#fff"/><ellipse cx="59" cy="50" rx="5" ry="7" fill="#fff"/>
            <circle cx="42" cy="52" r="3" fill="#1F1A17"/><circle cx="60" cy="52" r="3" fill="#1F1A17"/>
          </svg>
        </div>

        <!-- cursor with coral echo trail (echo-trail primitive, merged inline) -->
        <div class="sv05-abs sv05-ghost"><svg aria-hidden="true"><use href="#sv05-cursor-coral"/></svg></div>
        <div class="sv05-abs sv05-ghost"><svg aria-hidden="true"><use href="#sv05-cursor-coral"/></svg></div>
        <div class="sv05-abs sv05-ghost"><svg aria-hidden="true"><use href="#sv05-cursor-coral"/></svg></div>
        <div class="sv05-abs sv05-ghost"><svg aria-hidden="true"><use href="#sv05-cursor-coral"/></svg></div>
        <div class="sv05-abs sv05-cursor"><svg aria-hidden="true"><use href="#sv05-cursor-ink"/></svg></div>
      </div>
    </div>

    <!-- static deterministic grain -->
    <div id="sv05-grain" class="sv05-grain clip" data-start="0" data-duration="5" data-track-index="2">
      <svg viewBox="0 0 1920 1080" aria-hidden="true">
        <filter id="sv05-grain-f" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
        <rect width="1920" height="1080" filter="url(#sv05-grain-f)"/>
      </svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";
      var FRAME = "05-sito-vetrina";
      var DUR = 5;
      var host = document.querySelector('[data-composition-id="' + FRAME + '"]');
      var scope = host.querySelector(".sv05-world") ? host : document;
      function q(sel) { return scope.querySelector(sel); }
      function qa(sel) { return Array.prototype.slice.call(scope.querySelectorAll(sel)); }

      // ---- deterministic setup: noodle spirals ----
      qa(".sv05-noodle").forEach(function (p) {
        var cx = +p.getAttribute("data-cx"), cy = +p.getAttribute("data-cy");
        var r0 = +p.getAttribute("data-r0"), r1 = +p.getAttribute("data-r1");
        var turns = +p.getAttribute("data-turns"), ph = +p.getAttribute("data-phase");
        var N = 220, d = "";
        for (var i = 0; i <= N; i++) {
          var u = i / N;
          var a = ph + u * turns * Math.PI * 2;
          var r = r0 + (r1 - r0) * u + Math.sin(a * 3 + ph) * 1.6;
          var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.96;
          d += (i === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2) + " ";
        }
        p.setAttribute("d", d);
      });

      // ---- split text into per-letter spans ----
      qa("[data-split]").forEach(function (el) {
        var s = el.getAttribute("data-split");
        el.textContent = "";
        for (var i = 0; i < s.length; i++) {
          var sp = document.createElement("span");
          sp.className = "sv05-ch";
          sp.textContent = s.charAt(i);
          el.appendChild(sp);
        }
      });

      var world = q(".sv05-world");
      var plaque = q(".sv05-plaque");
      var rings = qa(".sv05-ring");
      var nfcDot = q(".sv05-nfc-dot");
      var screenOff = q(".sv05-screen-off");
      var kb = q(".sv05-kb");
      var heroBar = q(".sv05-hero-bar");
      var titleChars = qa(".sv05-title .sv05-ch");
      var sub = q(".sv05-sub");
      var track = q(".sv05-track");
      var pills = qa(".sv05-pill");
      var btn = q(".sv05-btn");
      var ripple = q(".sv05-ripple");
      var icons = qa(".sv05-ico");
      var tapRing = q(".sv05-tap-ring");
      var bubble = q(".sv05-bubble");
      var w1 = qa(".sv05-w1 .sv05-ch"), w2 = qa(".sv05-w2 .sv05-ch"), w3 = qa(".sv05-w3 .sv05-ch");
      var mascot = q(".sv05-mascot");
      var cursor = q(".sv05-cursor");
      var ghosts = qa(".sv05-ghost");

      // app-like spring: critically damped feel (fast out, no overshoot)
      var SPRING = "expo.out";

      var tl = gsap.timeline({ paused: true });

      // ================= virtual camera (single .world wrapper) =================
      // screen = (x, y) + scale * world  (transform-origin 0 0)
      gsap.set(world, { transformOrigin: "0 0" });
      var P0 = { x: 456.1, y: -588.5, scale: 1.45 };   // on the table plaque
      var P1 = { x: 448.8, y: -695.2, scale: 1.6 };    // slow push into the tap
      var P2 = { x: -225, y: -147.5, scale: 1.75 };    // dive into the phone hero
      var P3 = { x: -50, y: -161, scale: 1.3 };        // reposition: site body + right column
      var P3b = { x: -66, y: -178, scale: 1.33 };      // drift toward the button
      var P4 = { x: -90, y: -96, scale: 1.05 };        // travel right to the chat bubble
      var P5 = { x: 134.4, y: -0.5, scale: 0.86 };     // land: whole vitrine
      var P6 = { x: 120, y: -8, scale: 0.875 };        // micro drift, never dead
      tl.fromTo(world, P0, Object.assign({}, P1, { duration: 1.0, ease: "power1.inOut" }), 0);
      tl.fromTo(world, P1, Object.assign({}, P2, { duration: 0.9, ease: "power4.out", immediateRender: false }), 1.0);
      tl.fromTo(world, P2, Object.assign({}, P3, { duration: 1.1, ease: "power2.inOut", immediateRender: false }), 1.9);
      tl.fromTo(world, P3, Object.assign({}, P3b, { duration: 0.3, ease: "sine.inOut", immediateRender: false }), 3.0);
      tl.fromTo(world, P3b, Object.assign({}, P4, { duration: 0.65, ease: "power2.inOut", immediateRender: false }), 3.3);
      tl.fromTo(world, P4, Object.assign({}, P5, { duration: 0.75, ease: "power3.inOut", immediateRender: false }), 3.95);
      tl.fromTo(world, P5, Object.assign({}, P6, { duration: 0.3, ease: "sine.out", immediateRender: false }), 4.7);

      // ================= Scene 1 (0–1s): plaque tap + coral rings =================
      tl.fromTo(plaque, { scale: 1 }, { scale: 0.94, duration: 0.08, ease: "power2.out" }, 0.28);
      tl.fromTo(plaque, { scale: 0.94 }, { scale: 1, duration: 0.5, ease: SPRING, immediateRender: false }, 0.36);
      tl.fromTo(nfcDot, { attr: { r: 6 } }, { attr: { r: 9 }, duration: 0.12, ease: "power2.out" }, 0.3);
      tl.fromTo(nfcDot, { attr: { r: 9 } }, { attr: { r: 6 }, duration: 0.4, ease: SPRING, immediateRender: false }, 0.42);
      rings.forEach(function (r, i) {
        tl.fromTo(r, { scale: 0.3, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 0.95, ease: "power2.out", immediateRender: false }, 0.32 + i * 0.13);
      });
      // phone wakes: the site opens
      tl.fromTo(screenOff, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, 0.55);

      // ================= Scene 2 (1–2s): hero clip (Ken Burns) + title types =================
      tl.fromTo(kb, { scale: 1.06, x: 0, y: 0 }, { scale: 1.2, x: -16, y: -6, duration: 4.45, ease: "none" }, 0.55);
      tl.fromTo(heroBar, { scaleX: 0 }, { scaleX: 1, duration: 4.45, ease: "none" }, 0.55);
      tl.fromTo(titleChars, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none", stagger: 0.045 }, 1.2);
      tl.fromTo(sub, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: SPRING }, 1.75);
      tl.fromTo(track, { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: SPRING }, 1.5);

      // ================= Scene 3 (2–3s): carousel slides left, menu chips, "Menu." =================
      tl.fromTo(track, { x: 0 }, { x: -147, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 2.05);
      tl.fromTo(pills, { opacity: 0, scale: 0.6, y: 8 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: SPRING, stagger: 0.05 }, 2.35);
      tl.fromTo(w1, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: SPRING, stagger: 0.04 }, 2.4);
      tl.fromTo(btn, { opacity: 0, y: 20, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: SPRING }, 2.7);

      // ================= Scene 4 (3–4s): cursor presses "Prenota un tavolo" → chat bubble =================
      tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 2.85);
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.82, duration: 0.07, ease: "power2.out" }, 3.22);
      tl.fromTo(cursor, { scale: 0.82 }, { scale: 1, duration: 0.35, ease: SPRING, immediateRender: false }, 3.29);
      tl.fromTo(btn, { scale: 1 }, { scale: 0.95, duration: 0.07, ease: "power2.out", immediateRender: false }, 3.22);
      tl.fromTo(btn, { scale: 0.95 }, { scale: 1, duration: 0.4, ease: SPRING, immediateRender: false }, 3.29);
      tl.fromTo(ripple, { scale: 0, opacity: 0.55 }, { scale: 7, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 3.24);
      tl.fromTo(w2, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: SPRING, stagger: 0.03 }, 3.3);
      tl.fromTo(bubble, { opacity: 0, scale: 0.4, x: -40, y: 18 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.55, ease: SPRING }, 3.5);

      // ================= Scene 5 (4–5s): social icons pop, "Social.", mascot taps =================
      tl.fromTo(icons, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: SPRING, stagger: 0.08 }, 4.05);
      tl.fromTo(w3, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: SPRING, stagger: 0.04 }, 4.2);
      // mascot: the one element allowed to overshoot
      tl.fromTo(mascot, { opacity: 0, scale: 0, rotation: 12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)" }, 4.3);
      tl.fromTo(mascot, { x: 0, y: 0, rotation: 0 }, { x: -24, y: 16, rotation: -18, duration: 0.12, ease: "power2.in", immediateRender: false }, 4.6);
      tl.fromTo(mascot, { x: -24, y: 16, rotation: -18 }, { x: 0, y: 0, rotation: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 4.72);
      tl.fromTo(icons[2], { scale: 1 }, { scale: 0.84, duration: 0.07, ease: "power2.out", immediateRender: false }, 4.7);
      tl.fromTo(icons[2], { scale: 0.84 }, { scale: 1, duration: 0.3, ease: SPRING, immediateRender: false }, 4.77);
      tl.fromTo(tapRing, { scale: 1, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.7);

      // ================= cursor path + coral echo trail (pure function of time) =================
      var TIP_X = 5.25, TIP_Y = 3.5;
      var A = { x: 1010, y: 1000 }, C = { x: 960, y: 760 }, B = { x: 700, y: 712 }, D = { x: 736, y: 702 };
      var T0 = 2.85, T1 = 3.22, T2 = 3.5;
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      function cursorAt(t) {
        if (t <= T1) {
          var u = easeInOut(clamp01((t - T0) / (T1 - T0)));
          var m = 1 - u;
          return { x: m * m * A.x + 2 * m * u * C.x + u * u * B.x, y: m * m * A.y + 2 * m * u * C.y + u * u * B.y };
        }
        var v = clamp01((t - T2) / (DUR - T2));
        v = v * v * (3 - 2 * v);
        return { x: B.x + (D.x - B.x) * v, y: B.y + (D.y - B.y) * v };
      }
      var ECHO_DELTA = 0.05;
      var bases = ghosts.map(function (g, i) { return 0.6 * (1 - i / ghosts.length); });
      ghosts.forEach(function (g, i) { gsap.set(g, { scale: 1 - 0.04 * (i + 1), transformOrigin: "12% 8%" }); });
      function applyCursor(t) {
        var lp = cursorAt(t);
        gsap.set(cursor, { left: lp.x - TIP_X, top: lp.y - TIP_Y });
        var visible = t >= T0;
        for (var n = 0; n < ghosts.length; n++) {
          var p = cursorAt(Math.max(T0, t - (n + 1) * ECHO_DELTA));
          var dist = Math.hypot(p.x - lp.x, p.y - lp.y);
          var a = visible ? bases[n] * clamp01(dist / 24) : 0;
          gsap.set(ghosts[n], { left: p.x - TIP_X, top: p.y - TIP_Y, opacity: a < 0.003 ? 0 : a });
        }
      }
      var clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () { applyCursor(clock.t); }
      }, 0);
      applyCursor(0);

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
    })();
  </script>
