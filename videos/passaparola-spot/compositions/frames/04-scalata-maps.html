  <div id="root" data-composition-id="04-scalata-maps" data-start="0" data-duration="3" data-width="1920" data-height="1080">

            <div class="f04-rank f04-blur"><span id="f04-trat-r1">1</span><span id="f04-trat-r2">2</span></div>

      <filter id="f04-noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>

  <script>
    (function () {
      var FID = "04-scalata-maps";
      var root = document.querySelector('[data-composition-id="04-scalata-maps"]');
      var q = function (id) { return root.querySelector("#" + id); };

      // Critically damped spring (zeta = 1): springy, no overshoot.
      function springEase(w) {
        var norm = 1 - (1 + w) * Math.exp(-w);
        return function (p) { return (1 - (1 + w * p) * Math.exp(-w * p)) / norm; };
      }
      var spring = springEase(9);
      var springSoft = springEase(6);

      // Italian thousands formatting (2.341)
      function fmtIT(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

      // Split headline into per-character spans (synchronous, deterministic)
      function splitChars(el) {
        var text = el.textContent;
        el.textContent = "";
        var out = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.className = "f04-ch";
          s.textContent = text[i];
          el.appendChild(s);
          out.push(s);
        }
        return out;
      }
      var charsA = splitChars(q("f04-h-a"));
      var charsB = splitChars(q("f04-h-b"));

      var tl = gsap.timeline({ paused: true });

      // ---------- slots for the ranking rows ----------
      var SLOT = [35, 159, 283];
      gsap.set(q("f04-row-trat"), { y: 0 });
      gsap.set(q("f04-row-rist"), { y: SLOT[1] - SLOT[0] });
      gsap.set(q("f04-row-marea"), { y: SLOT[2] - SLOT[0] });

      // ---------- camera: .world legs + never-stopping drift ----------
      function cam(fx, fy, s) { return { x: 960 - fx * s, y: 540 - fy * s, scale: s }; }
      var c0 = cam(800, 470, 1.13), c1 = cam(900, 500, 1.07), c2 = cam(985, 520, 1.04);
      tl.fromTo(q("f04-world"), c0, Object.assign({ duration: 1.4, ease: "power1.out" }, c1), 0);
      tl.to(q("f04-world"), Object.assign({ duration: 1.2, ease: "sine.inOut" }, c2), 1.4);
      // whip left into 05's push-slide (cut at peak velocity)
      tl.to(q("f04-world"), { x: c2.x - 230, duration: 0.4, ease: "power2.in" }, 2.6);
      tl.fromTo(q("f04-stage"), { scale: 1 }, { scale: 1.025, duration: 3, ease: "none" }, 0);

      // ---------- Scene 1: counter 34 -> 300 (counting-dynamic-scale) ----------
      var counter = q("f04-counter"), rowCount = q("f04-row-count");
      var state = { v: 34 };
      var COUNT_AT = 0.1, COUNT_DUR = 1.3, COUNT_EASE = "power3.out";
      tl.fromTo(state, { v: 34 }, {
        v: 300, duration: COUNT_DUR, ease: COUNT_EASE,
        onUpdate: function () { var t = fmtIT(Math.round(state.v)); counter.textContent = t; rowCount.textContent = t; }
      }, COUNT_AT);
      tl.fromTo(counter, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo(q("f04-label"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: spring }, 0.25);
      tl.fromTo(q("f04-strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: spring }, 0.75);

      // ranking card present (it was the setting of frame 01), settles in on a spring
      tl.fromTo(q("f04-card"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: spring }, 0.05);

      // toasts: spring in at each tick group, older ones step down and fade out
      var toasts = [q("f04-toast-1"), q("f04-toast-2"), q("f04-toast-3")];
      var TOAST_AT = [0.18, 0.55, 0.92];
      toasts.forEach(function (t, i) {
        tl.fromTo(t, { opacity: 0, x: 90, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.4, ease: spring }, TOAST_AT[i]);
      });
      // toast 1 steps down when 2 arrives, then leaves when 3 arrives
      tl.to(toasts[0], { y: 78, scale: 0.94, opacity: 0.55, duration: 0.35, ease: spring }, TOAST_AT[1]);
      tl.to(toasts[0], { y: 140, opacity: 0, duration: 0.3, ease: spring }, TOAST_AT[2]);
      tl.to(toasts[1], { y: 78, scale: 0.94, opacity: 0.55, duration: 0.35, ease: spring }, TOAST_AT[2]);
      tl.to(toasts[1], { y: 140, opacity: 0, duration: 0.3, ease: spring }, 1.5);

      // headline part A types letter by letter on "Più recensioni."
      tl.fromTo(charsA, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.22, ease: spring, stagger: 0.04 }, 0.3);

      // ---------- mascot: perched on the counter, hops on each toast ----------
      var M0 = { x: 590, y: 96 };     // on top of the "300"
      var M1 = { x: 1651, y: 72 };    // on top of Osteria Marea row (#1)
      tl.fromTo(q("f04-mascot-pos"), { x: M0.x, y: M0.y }, { x: M0.x, y: M0.y, duration: 0.01 }, 0);
      tl.fromTo(q("f04-mascot"), { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 0.05);
      TOAST_AT.forEach(function (at) {
        tl.to(q("f04-mascot-arc"), { y: -34, duration: 0.14, ease: "power2.out" }, at);
        tl.to(q("f04-mascot-arc"), { y: 0, duration: 0.16, ease: "power2.in" }, at + 0.14);
      });

      // ---------- Scene 2: FLIP reorder — Marea climbs #3 -> #1 ----------
      var CLIMB_AT = 1.45, CLIMB_DUR = 0.7;
      tl.fromTo(q("f04-row-hl"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, CLIMB_AT - 0.05);
      tl.fromTo(q("f04-arrow"), { opacity: 0, y: 24, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: spring }, CLIMB_AT);
      tl.fromTo(q("f04-row-marea"), { y: SLOT[2] - SLOT[0], scale: 1 }, { y: 0, duration: CLIMB_DUR, ease: spring }, CLIMB_AT);
      tl.to(q("f04-row-marea"), { scale: 1.03, duration: 0.3, ease: "power2.out" }, CLIMB_AT);
      tl.to(q("f04-row-marea"), { scale: 1, duration: 0.4, ease: spring }, CLIMB_AT + 0.3);
      // competitors are pushed down as Marea passes them
      tl.fromTo(q("f04-row-rist"), { y: SLOT[1] - SLOT[0] }, { y: SLOT[2] - SLOT[0], duration: 0.55, ease: spring }, CLIMB_AT + 0.08);
      tl.fromTo(q("f04-row-trat"), { y: 0 }, { y: SLOT[1] - SLOT[0], duration: 0.55, ease: spring }, CLIMB_AT + 0.26);
      // rank numbers swap
      tl.fromTo(q("f04-rist-r2"), { opacity: 1 }, { opacity: 0, duration: 0.15 }, CLIMB_AT + 0.2);
      tl.fromTo(q("f04-rist-r3"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, CLIMB_AT + 0.2);
      tl.fromTo(q("f04-trat-r1"), { opacity: 1 }, { opacity: 0, duration: 0.15 }, CLIMB_AT + 0.38);
      tl.fromTo(q("f04-trat-r2"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, CLIMB_AT + 0.38);
      tl.fromTo(q("f04-marea-r3"), { opacity: 1, y: 0 }, { opacity: 0, y: 18, duration: 0.18 }, CLIMB_AT + 0.4);
      tl.fromTo(q("f04-marea-r1"), { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.3, ease: spring }, CLIMB_AT + 0.45);
      // arrow nudge as it lands
      tl.to(q("f04-arrow"), { y: -10, duration: 0.15, ease: "power2.out" }, CLIMB_AT + 0.62);
      tl.to(q("f04-arrow"), { y: 0, duration: 0.3, ease: spring }, CLIMB_AT + 0.77);

      // mascot leaps from the counter onto the top row (overshoot allowed: mascot only)
      var JUMP_AT = 1.55, JUMP_DUR = 0.65;
      tl.to(q("f04-mascot"), { scaleY: 0.8, scaleX: 1.12, duration: 0.1, ease: "power2.out" }, JUMP_AT - 0.1);
      tl.to(q("f04-mascot"), { scaleY: 1, scaleX: 1, duration: 0.2, ease: "back.out(2)" }, JUMP_AT);
      tl.to(q("f04-mascot-pos"), { x: M1.x, y: M1.y, duration: JUMP_DUR, ease: "power1.inOut" }, JUMP_AT);
      tl.to(q("f04-mascot-arc"), { y: -170, duration: JUMP_DUR * 0.5, ease: "power2.out" }, JUMP_AT);
      tl.to(q("f04-mascot-arc"), { y: 0, duration: JUMP_DUR * 0.5, ease: "power2.in" }, JUMP_AT + JUMP_DUR * 0.5);
      tl.to(q("f04-mascot"), { rotation: 360, duration: JUMP_DUR, ease: "power1.inOut" }, JUMP_AT);
      // landing squash + celebratory overshoot
      var LAND = JUMP_AT + JUMP_DUR;
      tl.to(q("f04-mascot"), { scaleY: 0.72, scaleX: 1.2, duration: 0.08, ease: "power2.out" }, LAND);
      tl.to(q("f04-mascot"), { scaleY: 1, scaleX: 1, duration: 0.45, ease: "back.out(3)" }, LAND + 0.08);
      tl.to(q("f04-mascot-arc"), { y: -26, duration: 0.14, ease: "power2.out" }, LAND + 0.2);
      tl.to(q("f04-mascot-arc"), { y: 0, duration: 0.16, ease: "power2.in" }, LAND + 0.34);

      // ---------- Scene 3: headline completes letter by letter ----------
      tl.fromTo(charsB, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.2, ease: spring, stagger: 0.05 }, 2.05);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
