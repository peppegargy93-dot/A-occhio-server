          <div class="f03-ghost"><svg viewBox="0 0 24 24"><path d="M3 2 L20 12 L12 13.5 L8 21 Z" /></svg></div>
          <div class="f03-ghost"><svg viewBox="0 0 24 24"><path d="M3 2 L20 12 L12 13.5 L8 21 Z" /></svg></div>
          <div class="f03-ghost"><svg viewBox="0 0 24 24"><path d="M3 2 L20 12 L12 13.5 L8 21 Z" /></svg></div>
          <div class="f03-ghost"><svg viewBox="0 0 24 24"><path d="M3 2 L20 12 L12 13.5 L8 21 Z" /></svg></div>
          <div class="f03-ghost"><svg viewBox="0 0 24 24"><path d="M3 2 L20 12 L12 13.5 L8 21 Z" /></svg></div>

        </div>

    <div class="f03-grain clip" data-start="0" data-duration="5" data-track-index="2">
      <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <filter id="f03-grain-noise" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch" />

        </filter>

      </svg>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "03-pagina-recensione";
        var nodes = document.querySelectorAll('[data-composition-id="' + FID + '"]');
        var root = nodes[nodes.length - 1];
        function q(sel) {
          return root.querySelector(sel);
        }
        function qa(sel) {
          return Array.prototype.slice.call(root.querySelectorAll(sel));
        }

        // ---- baked closed-form spring (seek-safe, pure function of progress) ----
        function springEase(response, dampingFraction) {
          var w = (2 * Math.PI) / response;
          var z = dampingFraction;
          var pos;
          if (z < 1) {
            var wd = w * Math.sqrt(1 - z * z);
            pos = function (t) {
              return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
            };
          } else {
            pos = function (t) {
              return 1 - Math.exp(-w * t) * (1 + w * t);
            };
          }
          var EPS = 0.001;
          var rate = z * w;
          var SCAN = 12 / rate;
          var N = 4800;
          var T = SCAN;
          for (var i = N; i >= 0; i--) {
            var tt = (i / N) * SCAN;
            if (Math.abs(1 - pos(tt)) > EPS) {
              T = ((i + 1) / N) * SCAN;
              break;
            }
          }
          var xT = pos(T);
          return {
            duration: T,
            ease: function (p) {
              return pos(p * T) + p * (1 - xT);
            },
          };
        }
        var SPR_CAM = springEase(0.3, 1); // ~0.44s pull-back
        var SPR_UI = springEase(0.42, 1); // sheet / card
        var SPR_POP = springEase(0.3, 1); // stars
        var SPR_SNAP = springEase(0.22, 1); // button release
        var SPR_MASCOT = springEase(0.36, 0.62); // mascot only: playful overshoot
        var SPR_MASCOT_LAND = springEase(0.3, 0.6);

        // ---- split text into per-letter spans (deterministic) ----
        qa(".f03-split").forEach(function (el) {
          var text = el.textContent;
          el.textContent = "";
          for (var i = 0; i < text.length; i++) {
            var s = document.createElement("span");
            if (text[i] === " ") {
              s.className = "f03-sp";
            } else {
              s.className = "f03-ch";
              s.textContent = text[i];
            }
            el.appendChild(s);
          }
        });

        // ---- svg-path-draw setup: measured lengths ----
        var ovalOuter = q(".f03-oval-outer");
        var ovalInner = q(".f03-oval-inner");
        var lenOuter = ovalOuter.getTotalLength() * 1.02;
        var lenInner = ovalInner.getTotalLength() * 1.02;
        ovalOuter.style.strokeDasharray = lenOuter;
        ovalInner.style.strokeDasharray = lenInner;

        // ---- virtual camera: focus point (px,py) at scale s, origin 0 0 ----
        function cam(px, py, s) {
          return { x: 960 - s * px, y: 540 - s * py, scale: s };
        }
        var world = q(".f03-world");
        var C0 = cam(335, 475, 4.75); // full-bleed white screen (handoff from frame 02)
        var C1 = cam(960, 540, 1); // phone at sketch position
        var C2 = cam(860, 470, 1.08);
        var C3 = cam(820, 445, 1.1);
        var C4 = cam(1010, 560, 1.04);
        var C5 = cam(470, 725, 1.7); // into the button
        var C6 = cam(960, 540, 1); // wide landed state = sketch

        var tl = gsap.timeline({ paused: true });

        // Camera chain — always moving, ~1s motivated legs
        tl.fromTo(world, C0, Object.assign({}, C1, { duration: SPR_CAM.duration, ease: SPR_CAM.ease }), 0);
        tl.fromTo(world, C1, Object.assign({}, C2, { duration: 0.86, ease: "sine.inOut", immediateRender: false }), SPR_CAM.duration);
        tl.fromTo(world, C2, Object.assign({}, C3, { duration: 0.65, ease: "sine.inOut", immediateRender: false }), 1.3);
        tl.fromTo(world, C3, Object.assign({}, C4, { duration: 0.9, ease: "power2.inOut", immediateRender: false }), 1.95);
        tl.fromTo(world, C4, Object.assign({}, C5, { duration: 0.9, ease: "power3.inOut", immediateRender: false }), 2.85);
        tl.fromTo(world, C5, Object.assign({}, C6, { duration: 1.25, ease: "power3.out", immediateRender: false }), 3.75);

        // ---------- Scene 1 (0.0–1.0): cameo oval draws, name letter by letter ----------
        tl.fromTo(ovalOuter, { strokeDashoffset: lenOuter }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.12);
        tl.fromTo(ovalInner, { strokeDashoffset: -lenInner }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.3);
        qa(".f03-name .f03-ch").forEach(function (ch, i) {
          tl.fromTo(ch, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 0.3 + i * 0.045);
        });

        // ---------- Scene 2 (1.0–1.8): five stars pop in sequence ----------
        qa(".f03-star").forEach(function (st, i) {
          tl.fromTo(st, { scale: 0, opacity: 0, y: 12 }, { scale: 1, y: 0, duration: SPR_POP.duration, ease: SPR_POP.ease }, 1.0 + i * 0.13);
          tl.fromTo(st, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, 1.0 + i * 0.13);
        });

        // mascot: pops beside the phone, hops onto the fifth star
        var mascot = q(".f03-mascot");
        var MH = 38; // half size
        tl.fromTo(mascot, { x: 600 - MH, y: 330 - MH, scale: 0, rotation: -10 }, { scale: 1, rotation: 0, duration: SPR_MASCOT.duration, ease: SPR_MASCOT.ease }, 1.22);
        tl.to(mascot, { x: 459 - MH, duration: 0.34, ease: "power1.inOut" }, 1.46);
        tl.to(mascot, { y: 245 - MH, duration: 0.17, ease: "power2.out" }, 1.46);
        tl.to(mascot, { y: 327 - MH, duration: 0.17, ease: "power2.in" }, 1.63);
        tl.to(mascot, { scaleX: 1.16, scaleY: 0.84, duration: 0.06, ease: "power2.out" }, 1.8);
        tl.to(mascot, { scaleX: 1, scaleY: 1, duration: SPR_MASCOT_LAND.duration, ease: SPR_MASCOT_LAND.ease }, 1.86);

        // ---------- Scene 3 (1.8–2.8): sheet springs up, language pills cycle, headline types ----------
        tl.fromTo(q(".f03-sheet"), { y: 340 }, { y: 0, duration: SPR_UI.duration, ease: SPR_UI.ease }, 1.8);

        var hl = q(".f03-pill-hl");
        var labels = qa(".f03-pill-label");
        gsap.set(labels[0], { color: "#ffffff" });
        var steps = [
          { to: 1, at: 2.12, d: 0.13 },
          { to: 2, at: 2.26, d: 0.13 },
          { to: 3, at: 2.4, d: 0.13 },
          { to: 4, at: 2.54, d: 0.13 },
          { to: 0, at: 2.68, d: 0.22 },
        ];
        var prev = 0;
        steps.forEach(function (s) {
          tl.fromTo(hl, { x: prev * 64 }, { x: s.to * 64, duration: s.d, ease: "power3.inOut", immediateRender: false }, s.at);
          tl.fromTo(labels[prev], { color: "#ffffff" }, { color: "#b5392c", duration: 0.08, ease: "none", immediateRender: false }, s.at + 0.02);
          tl.fromTo(labels[s.to], { color: "#b5392c" }, { color: "#ffffff", duration: 0.08, ease: "none", immediateRender: false }, s.at + s.d - 0.06);
          prev = s.to;
        });
        tl.fromTo(hl, { scale: 1 }, { scale: 1.08, duration: 0.08, ease: "power2.out", immediateRender: false }, 2.9);
        tl.to(hl, { scale: 1, duration: SPR_SNAP.duration, ease: SPR_SNAP.ease }, 2.98);

        qa(".f03-hl1 .f03-ch").forEach(function (ch, i) {
          tl.fromTo(ch, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.0 + i * 0.045);
        });

        // ---------- Scene 4 (2.8–3.8): cursor + coral echo trail, shine, press ----------
        var TIP = { x: 5.75, y: 3.83 }; // arrow tip inside the 46px cursor box
        var P0 = { x: 940, y: 560 };
        var PC = { x: 600, y: 560 };
        var P1 = { x: 340, y: 787 }; // button visual center (world)
        var MOVE_AT = 2.88;
        var MOVE = 0.52;
        function moveEase(u) {
          return 1 - Math.pow(1 - u, 3);
        }
        function bez(a, c, b, u) {
          return (1 - u) * (1 - u) * a + 2 * u * (1 - u) * c + u * u * b;
        }
        // per-axis eases so x/y follow the quadratic curve exactly (pure functions)
        var easeX = function (p) {
          return (bez(P0.x, PC.x, P1.x, moveEase(p)) - P0.x) / (P1.x - P0.x);
        };
        var easeY = function (p) {
          return (bez(P0.y, PC.y, P1.y, moveEase(p)) - P0.y) / (P1.y - P0.y);
        };
        var lead = q(".f03-lead");
        var ghosts = qa(".f03-ghost");
        var layer = q(".f03-cursorlayer");
        tl.fromTo(layer, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, MOVE_AT - 0.04);
        function addPath(el, at) {
          tl.fromTo(el, { x: P0.x - TIP.x }, { x: P1.x - TIP.x, duration: MOVE, ease: easeX }, at);
          tl.fromTo(el, { y: P0.y - TIP.y }, { y: P1.y - TIP.y, duration: MOVE, ease: easeY }, at);
        }
        addPath(lead, MOVE_AT);
        var DELTA = 0.045;
        var BASES = [0.55, 0.42, 0.3, 0.2, 0.12];
        ghosts.forEach(function (g, i) {
          var at = MOVE_AT + (i + 1) * DELTA;
          addPath(g, at);
          tl.fromTo(g, { opacity: 0 }, { opacity: BASES[i], duration: 0.06, ease: "power1.out" }, MOVE_AT + 0.02);
          tl.fromTo(g, { opacity: BASES[i] }, { opacity: 0, duration: 0.16, ease: "power1.in", immediateRender: false }, at + MOVE - 0.2);
        });

        // shine sweep across the button
        tl.fromTo(q(".f03-shine"), { x: -130 }, { x: 420, duration: 0.5, ease: "power2.inOut" }, 3.0);

        // cursor-click-ripple: press (cursor 0.85 / button 0.95) then spring back
        var CLICK = 3.46;
        var btn = q(".f03-btn");
        var leadInner = q(".f03-lead-inner");
        tl.fromTo(leadInner, { scale: 1 }, { scale: 0.85, duration: 0.08, ease: "power2.in" }, CLICK);
        tl.fromTo(btn, { scale: 1 }, { scale: 0.95, duration: 0.08, ease: "power2.in" }, CLICK);
        tl.to(leadInner, { scale: 1, duration: SPR_SNAP.duration, ease: SPR_SNAP.ease }, CLICK + 0.08);
        tl.to(btn, { scale: 1, duration: SPR_SNAP.duration, ease: SPR_SNAP.ease }, CLICK + 0.08);
        qa(".f03-ripple").forEach(function (r, i) {
          tl.fromTo(r, { scale: 0, opacity: 1 }, { scale: 4.2, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, CLICK + 0.02 + i * 0.1);
        });
        // cursor eases off the button after the press
        tl.fromTo(layer, { x: 0, y: 0 }, { x: 32, y: 30, duration: 0.8, ease: "power2.inOut" }, 3.62);

        // ---------- Scene 5 (3.8–5.0): Google stars fill, thank-you card + confetti, mascot celebrates ----------
        var card = q(".f03-card");
        tl.fromTo(card, { x: -300, scale: 0.4 }, { x: 0, scale: 1, duration: SPR_UI.duration, ease: SPR_UI.ease }, 3.76);
        tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 3.76);
        // ochre wipe (transform-only: mask slides in, content counter-slides)
        tl.fromTo(q(".f03-wipe"), { x: -232 }, { x: 0, duration: 0.42, ease: "power2.inOut" }, 3.98);
        tl.fromTo(q(".f03-wipe-inner"), { x: 232 }, { x: 0, duration: 0.42, ease: "power2.inOut" }, 3.98);
        qa(".f03-thanks .f03-ch").forEach(function (ch, i) {
          tl.fromTo(ch, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 4.08 + i * 0.03);
        });
        tl.fromTo(q(".f03-sub"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.45);

        // confetti burst (registry formula: cos(i*.83) / sin(i*.61) / 180+i*37), then gravity
        var BURST = 4.34;
        qa(".f03-particle").forEach(function (p, i) {
          var bx = Math.cos(i * 0.83) * 290;
          var by = -110 - Math.sin(i * 0.61) * 120;
          var br = 180 + i * 37;
          var t1 = BURST + i * 0.012;
          tl.fromTo(p, { x: 0, y: 0, rotation: 0, scale: 0, opacity: 0 }, { x: bx, y: by, rotation: br, scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, t1);
          var t2 = t1 + 0.5;
          tl.fromTo(p, { y: by, rotation: br }, { y: by + 150 + (i % 5) * 22, rotation: br + 140, duration: Math.max(0.1, 5 - t2), ease: "power1.in", immediateRender: false }, t2);
        });

        // mascot celebrates: anticipation, jump + spin to the card corner (playful overshoot)
        tl.to(mascot, { scaleX: 1.12, scaleY: 0.86, duration: 0.08, ease: "power2.out" }, 4.2);
        tl.to(mascot, { x: 1238 - MH, duration: 0.6, ease: "power2.inOut" }, 4.28);
        tl.to(mascot, { y: 40 - MH, duration: 0.32, ease: "power2.out" }, 4.28);
        tl.to(mascot, { y: 106 - MH, duration: SPR_MASCOT_LAND.duration * 0.9, ease: SPR_MASCOT_LAND.ease }, 4.6);
        tl.to(mascot, { scaleX: 1.26, scaleY: 1.26, duration: SPR_MASCOT.duration, ease: SPR_MASCOT.ease }, 4.28);
        tl.fromTo(mascot, { rotation: 0 }, { rotation: 372, duration: 0.7, ease: SPR_MASCOT.ease, immediateRender: false }, 4.28);

        // headline completes in coral
        qa(".f03-hl2 .f03-ch").forEach(function (ch, i) {
          tl.fromTo(ch, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, 4.35 + i * 0.025);
        });

        window.__timelines[FID] = tl;
      })();
    </script>
