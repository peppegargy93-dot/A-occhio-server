    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const ID = "01-maps-problema";
        const DUR = 4;
        const root = document.querySelector('[data-composition-id="' + ID + '"]');
        const $ = (sel) => root.querySelector(sel);
        const $$ = (sel) => Array.from(root.querySelectorAll(sel));
        const NS = "http://www.w3.org/2000/svg";
        const OCHRE = "#E2B04F";
        const GRAY = "#E6DED2";

        function starSvg(color, clip) {
          const svg = document.createElementNS(NS, "svg");
          svg.setAttribute("viewBox", "0 0 24 24");
          const use = document.createElementNS(NS, "use");
          use.setAttribute("href", "#f01-maps-starpath");
          use.setAttribute("fill", color);
          svg.appendChild(use);
          if (clip) svg.style.clipPath = clip;
          return svg;
        }

        // competitor mini star rows (static, 4.5 / 5)
        $$(".f01-maps-ministars").forEach((row) => {
          const r = parseFloat(row.getAttribute("data-rating"));
          for (let i = 0; i < 5; i++) {
            const frac = Math.max(0, Math.min(1, r - i));
            const holder = document.createElement("span");
            holder.style.position = "relative";
            holder.style.width = "26px";
            holder.style.height = "26px";
            const g = starSvg(GRAY);
            g.style.position = "absolute";
            const o = starSvg(OCHRE, "inset(0 " + (100 - frac * 100) + "% 0 0)");
            o.style.position = "absolute";
            holder.appendChild(g);
            holder.appendChild(o);
            row.appendChild(holder);
          }
        });

        // hero star row: gray base + ochre layer wiped per star (4.8 / 5)
        const RATING = 4.8;
        const big = $("#f01-maps-bigstars");
        const golds = [];
        const starBoxes = [];
        for (let i = 0; i < 5; i++) {
          const box = document.createElement("div");
          box.className = "f01-maps-star";
          box.appendChild(starSvg(GRAY));
          const gold = starSvg(OCHRE, "inset(0 100% 0 0)");
          box.appendChild(gold);
          big.appendChild(box);
          golds.push(gold);
          starBoxes.push(box);
        }

        // headline split into per-letter spans (typed letter by letter)
        $$(".f01-maps-line").forEach((line) => {
          const text = line.getAttribute("data-text");
          for (const c of text) {
            const s = document.createElement("span");
            s.className = "f01-maps-ch";
            s.textContent = c === " " ? " " : c;
            line.appendChild(s);
          }
        });

        const tl = gsap.timeline({ paused: true });

        // ---------------- virtual camera (single writer) ----------------
        // keys: world point at screen center + log-scale; each leg ~1s, motivated.
        const L = Math.log;
        const KEYS = [
          { t: 0.0, x: 404, y: 704, s: L(7.6) },
          { t: 1.0, x: 446, y: 702, s: L(6.6), ease: "sine.inOut" }, // macro creep along the stars
          { t: 2.0, x: 640, y: 690, s: L(3.3), ease: "power2.inOut" }, // dolly right to "34 recensioni"
          { t: 2.85, x: 960, y: 540, s: L(1.0), ease: "power3.inOut" }, // fast pull-back: the list
          { t: 4.0, x: 930, y: 534, s: L(1.05), ease: "power2.in" }, // push toward the handoff
        ];
        KEYS.forEach((k) => {
          if (k.ease) k.fn = gsap.parseEase(k.ease);
        });
        function camAt(t) {
          if (t <= KEYS[0].t) return KEYS[0];
          for (let i = 1; i < KEYS.length; i++) {
            const a = KEYS[i - 1];
            const b = KEYS[i];
            if (t <= b.t) {
              const p = b.fn((t - a.t) / (b.t - a.t));
              return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p, s: a.s + (b.s - a.s) * p };
            }
          }
          return KEYS[KEYS.length - 1];
        }
        const world = $("#f01-maps-world");
        const clock = { t: 0 };
        function writeCam() {
          const t = clock.t;
          const c = camAt(t);
          const sc = Math.exp(c.s);
          const ph = (t / DUR) * Math.PI * 2 * 1.5;
          const dx = Math.sin(ph) * 5;
          const dy = Math.sin(ph * 1.3) * 2.5;
          const tx = 960 - c.x * sc + dx;
          const ty = 540 - c.y * sc + dy;
          world.style.transform =
            "translate(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px) scale(" + sc.toFixed(5) + ")";
        }
        writeCam();
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: writeCam }, 0);

        // ---------------- Scene 1 (0.0–1.0): five stars light one by one ----------------
        golds.forEach((g, i) => {
          const at = 0.08 + i * 0.15;
          const frac = Math.max(0, Math.min(1, RATING - i));
          tl.fromTo(
            g,
            { clipPath: "inset(0 100% 0 0)" },
            { clipPath: "inset(0 " + (100 - frac * 100).toFixed(1) + "% 0 0)", duration: 0.22, ease: "power2.out" },
            at
          );
          tl.fromTo(
            starBoxes[i],
            { scale: 0.86 },
            { scale: 1, duration: 0.45, ease: "expo.out" },
            at
          );
        });

        // ---------------- Scene 2 (1.0–2.0): coral underline sweep on "34 recensioni" ----------------
        tl.fromTo(
          "#f01-maps-underline",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.inOut" },
          1.42
        );

        // ---------------- Scene 3 (2.0–3.0): pull-back; competitors fall out of focus ----------------
        tl.fromTo(
          $$(".f01-maps-comp"),
          { filter: "blur(0px)", opacity: 1 },
          { filter: "blur(1.5px)", opacity: 0.8, duration: 0.7, ease: "power2.out" },
          2.1
        );
        tl.fromTo(
          "#f01-maps-sel",
          { scale: 1 },
          { scale: 1.015, duration: 0.6, ease: "expo.out" },
          2.55
        );

        // ---------------- Scene 4 (2.75–4.0): headline types letter by letter ----------------
        const l1 = $$("#f01-maps-l1 .f01-maps-ch");
        const l23 = $$("#f01-maps-l2 .f01-maps-ch").concat($$("#f01-maps-l3 .f01-maps-ch"));
        tl.fromTo(
          l1,
          { opacity: 0, yPercent: 35 },
          { opacity: 1, yPercent: 0, duration: 0.28, ease: "expo.out", stagger: 0.03 },
          2.72
        );
        tl.fromTo(
          l23,
          { opacity: 0, yPercent: 35 },
          { opacity: 1, yPercent: 0, duration: 0.28, ease: "expo.out", stagger: 0.028 },
          3.18
        );

        // sad mascot peeks from behind the card corner (overshoot allowed here only)
        tl.fromTo(
          "#f01-maps-mascot",
          { x: -110, y: -70, rotation: -20 },
          { x: 0, y: 0, rotation: 12, duration: 0.6, ease: "back.out(1.6)" },
          3.3
        );

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
