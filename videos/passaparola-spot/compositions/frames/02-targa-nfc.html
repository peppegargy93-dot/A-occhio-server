<template id="f02-targa-nfc-template">

      position: absolute; inset: 0;

    #f02-targa-nfc-lip {

    /* ---------- the NFC plaque (dark plexiglass) ---------- */
    #f02-targa-nfc-plaque {

    #f02-targa-nfc-phone {

    /* world-space bloom: the review page opening out of the contact point (519,595) */
    #f02-targa-nfc-bloom {

      border-radius: 50%; background: #FFFFFF;
    }

    /* ---------- headline (approved copy) ---------- */
    #f02-targa-nfc-headline {
      position: absolute; left: 1114px; top: 372px; width: 760px;

      white-space: nowrap;
    }
    .f02-targa-nfc-line { display: block; perspective: 600px; }
    .f02-targa-nfc-ch { display: inline-block; }
    .f02-targa-nfc-coral { color: #B5392C; }
    .f02-targa-nfc-sp { display: inline-block; width: 0.32em; }
    #f02-targa-nfc-underline {

    /* foreground bokeh (parallax faster than the world) */
    #f02-targa-nfc-fg { position: absolute; inset: 0; pointer-events: none; }
    .f02-targa-nfc-bokeh { position: absolute; border-radius: 50%; filter: blur(34px); }
    #f02-targa-nfc-bokeh1 { left: 1480px; top: 70px; width: 260px; height: 260px; background: rgba(226,176,79,0.22); }
    #f02-targa-nfc-bokeh2 { left: 120px; top: 120px; width: 180px; height: 180px; background: rgba(181,57,44,0.10); }

    /* ---------- handoff page + grain ---------- */
    #f02-targa-nfc-page { position: absolute; inset: 0; background: #FFFFFF; }
    #f02-targa-nfc-grain { position: absolute; inset: 0; opacity: 0.08; pointer-events: none; }
    #f02-targa-nfc-grain svg { width: 100%; height: 100%; display: block; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "02-targa-nfc";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector('[id="f' + FID + "-" + id + '"]'); }
      function $$(cls) { return root.querySelectorAll('[class~="f' + FID + "-" + cls + '"]'); }

      var cam = $("cam"), world = $("world"), fg = $("fg");
      var phone = $("phone"), mascot = $("mascot");
      var tl = gsap.timeline({ paused: true });

      // Spring vocabulary: critically damped (no overshoot) for camera + UI, overshoot only on the mascot.
      var SPRING = "expo.out";
      var MASCOT_SPRING = "back.out(2.6)";

      // Contact point (chip) in world coords = (519, 595) -> offset from center (-441, +55).
      // Nested-wrapper coordinate-target-zoom: inner translate T = -offset = (441, -55).
      var ZOOM_X = 441, ZOOM_Y = -55, ZOOM_S = 2.6;

      /* ===== Camera leg 1 (0.0-1.05): lateral dolly across the counter, arriving on the plaque ===== */
      tl.fromTo(world, { x: 760, y: 0 }, { x: 0, y: 0, duration: 1.05, ease: "power3.out" }, 0);
      tl.fromTo(cam, { scale: 1.02 }, { scale: 1, duration: 1.05, ease: "power3.out" }, 0);
      tl.fromTo(fg, { x: 1300 }, { x: 0, duration: 1.05, ease: "power3.out" }, 0);
      // plexiglass sheen catches the light as the camera arrives
      tl.fromTo($("sheen"), { x: 0 }, { x: 640, duration: 0.9, ease: "power2.inOut" }, 0.35);
      tl.fromTo($("chip-glow"), { opacity: 0, scale: 0.6 }, { opacity: 0.55, scale: 1, duration: 0.6, ease: SPRING }, 0.55);

      /* ===== Camera leg 2 (1.0-2.0): slow push while the headline types and the phone descends ===== */
      tl.to(world, { x: -14, y: -4, duration: 1.0, ease: "sine.inOut" }, 1.05);
      tl.to(cam, { scale: 1.035, duration: 1.0, ease: "sine.inOut" }, 1.05);
      tl.to(fg, { x: -40, duration: 1.75, ease: "sine.inOut" }, 1.05);

      // "Basta un tocco." letter by letter on the VO
      var chars = $$("ch");
      tl.fromTo(chars,
        { opacity: 0, y: 34, rotationX: -70, transformOrigin: "50% 100%" },
        { opacity: 1, y: 0, rotationX: 0, duration: 0.42, ease: SPRING, stagger: 0.05 }, 1.0);
      tl.fromTo($("underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: SPRING }, 1.62);

      // phone descends from top-right on a critically damped spring; mascot rides its edge
      tl.fromTo(phone,
        { x: 760, y: -860, rotation: -26, scale: 1 },
        { x: 210, y: -85, rotation: -14, duration: 0.85, ease: SPRING }, 1.08);
      tl.fromTo(mascot,
        { scale: 0.3, rotation: -40, y: 10 },
        { scale: 1, rotation: 8, y: 0, duration: 0.6, ease: MASCOT_SPRING }, 1.42);
      tl.to(mascot, { rotation: 0, duration: 0.5, ease: MASCOT_SPRING }, 2.02);

      /* ===== Scene 3 + camera leg 3 (2.0-2.8): contact on the chip, press-release spring, three rings ===== */
      tl.to(world, { x: 60, y: -12, duration: 0.8, ease: "power2.inOut" }, 2.05);
      tl.to(cam, { scale: 1.07, duration: 0.8, ease: "power2.inOut" }, 2.05);

      // approach: phone glides onto the plaque (pivot = contact point)
      tl.to(phone, { x: 0, y: 0, rotation: -6, duration: 0.32, ease: "power3.inOut" }, 2.05);
      // press (linear compression) ...
      tl.to(phone, {
        scale: 0.94,
        boxShadow: "0 14px 24px -12px rgba(31,26,23,0.40), 0 4px 8px -4px rgba(31,26,23,0.30)",
        duration: 0.12, ease: "power1.in"
      }, 2.37);
      // ... release (spring back, start == press end by adjacency)
      tl.to(phone, {
        scale: 1,
        boxShadow: "0 42px 84px -27px rgba(31,26,23,0.36), 0 13px 27px -13px rgba(31,26,23,0.22)",
        duration: 0.5, ease: "back.out(1.3)"
      }, 2.49);
      // burst behind the phone + chip glow peak
      tl.fromTo($("burst"), { scale: 1, opacity: 0 }, { scale: 2.6, opacity: 0.8, duration: 0.35, ease: "power2.out" }, 2.49);
      tl.to($("burst"), { opacity: 0.25, duration: 0.5, ease: "power2.in" }, 2.84);
      tl.to($("chip-glow"), { opacity: 1, scale: 1.25, duration: 0.3, ease: SPRING }, 2.49);
      // three concentric coral rings radiate from the chip (soft beep)
      var rings = [$("ring1"), $("ring2"), $("ring3")];
      rings.forEach(function (r, i) {
        var at = 2.49 + i * 0.11;
        tl.fromTo(r, { scale: 0.25, opacity: 0 }, { scale: 1, opacity: 0.9 - i * 0.2, duration: 0.3, ease: "power2.out" }, at);
        tl.to(r, { scale: 1.25, opacity: 0, duration: 0.5, ease: "power1.in" }, at + 0.3);
      });
      // mascot hop on contact (overshoot allowed here only)
      tl.to(mascot, { y: -34, rotation: -10, duration: 0.16, ease: "power2.out" }, 2.42);
      tl.to(mascot, { y: 0, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 2.58);
      // screen wakes: the review page starts blooming inside the phone from the contact point
      tl.fromTo($("lock-hint"), { opacity: 0.4, scale: 0.8 }, { opacity: 1, scale: 1.4, duration: 0.25, ease: SPRING }, 2.45);
      tl.fromTo($("screen-bloom"), { scale: 0 }, { scale: 15, duration: 0.5, ease: "power2.inOut" }, 2.6);

      /* ===== Scene 4 + camera leg 4 (2.8-3.8): coordinate-target zoom into the screen; page fills frame ===== */
      tl.to(world, { x: ZOOM_X, y: ZOOM_Y, duration: 0.95, ease: "power3.inOut" }, 2.85);
      tl.to(cam, { scale: ZOOM_S, duration: 0.95, ease: "power3.inOut" }, 2.85);
      tl.to(fg, { x: 900, scale: 1.4, duration: 0.95, ease: "power3.inOut" }, 2.85);
      tl.to(phone, { rotation: 0, duration: 0.8, ease: SPRING }, 2.95);
      // world-space bloom: the white page expands out of the contact point past the phone
      // (cover check at 3.8: 2.6 * 12 * 50px = 1560px radius > 1101px half-diagonal)
      tl.fromTo($("bloom"), { scale: 0 }, { scale: 12, duration: 0.7, ease: "power2.in" }, 3.1);
      // handoff: full-bleed white page, scale 1, opacity 1 (identical pixels to the covered bloom)
      tl.fromTo($("page"), { opacity: 0, scale: 1 }, { opacity: 1, scale: 1, duration: 0.04, ease: "none" }, 3.8);

      // hold to the frame's full length
      tl.set({}, {}, 4);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
