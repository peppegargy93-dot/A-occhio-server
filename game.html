<!DOCTYPE html>
<!-- A OCCHIO! v3.0.0 · tabellone rapido + Bonus rimonta + Malus podio -->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#20424E">
<title>A OCCHIO! — Prototipo</title>
<style>
  /* ===========================================================
     A OCCHIO!  —  prototipo party game (single file, no deps)
     Palette: crema, blu petrolio, verde acqua, corallo, ocra
     =========================================================== */
  :root{
    --cream:#F5ECD6;
    --paper:#FBF6E7;
    --paper-2:#FFFDF6;
    --ink:#20424E;       /* blu petrolio scuro */
    --petrol:#2E6B7A;
    --teal:#48A39A;      /* verde acqua */
    --coral:#E0795E;
    --ochre:#E6AC3C;
    --olive:#8FA94E;
    --plum:#9A6A8E;
    --line:rgba(32,66,78,.16);
    --line-soft:rgba(32,66,78,.08);
    --shadow:0 10px 24px -14px rgba(32,66,78,.55);
    --shadow-lg:0 18px 40px -18px rgba(32,66,78,.6);
    --radius:20px;
    --radius-sm:13px;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #FBF4DF 0%, var(--cream) 55%, #EFE3C6 100%);
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  .wrap{
    max-width:540px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:0 14px env(safe-area-inset-bottom);
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:30;
    padding:12px 0 10px;
    background:linear-gradient(180deg, var(--cream) 70%, rgba(245,236,214,0));
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .menu-btn{flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--paper-2);color:var(--ink);font-size:24px;font-weight:900;line-height:1;
    display:grid;place-items:center;box-shadow:var(--shadow);}
  .menu-btn:active{transform:translateY(1px);}
  .menu-btn[hidden]{display:none;}
  .menu-sheet{position:absolute;right:0;top:56px;z-index:45;min-width:210px;
    background:var(--paper-2);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;}
  .menu-sheet[hidden]{display:none;}
  .menu-item{display:block;width:100%;text-align:left;background:transparent;border:none;
    padding:12px 12px;border-radius:10px;font-size:14.5px;font-weight:700;color:var(--ink);font-family:inherit;}
  .menu-item:active{background:var(--line-soft);}
  .menu-item + .menu-item{margin-top:2px;border-top:1px dashed var(--line-soft);}
  .confirm-ov{position:fixed;inset:0;z-index:90;background:rgba(32,66,78,.45);
    display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeUp .15s ease;}
  .confirm-card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;
    padding:20px;width:100%;max-width:360px;box-shadow:var(--shadow-lg);}
  .confirm-msg{font-size:15px;font-weight:700;color:var(--ink);line-height:1.45;margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .eye{
    width:38px;height:38px;border-radius:50%;
    background:var(--paper-2);
    border:2.5px solid var(--ink);
    display:grid;place-items:center;flex:0 0 auto;
    box-shadow:var(--shadow);
    position:relative;
  }
  .eye::before{content:"";width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #5fb6c2 0 30%, var(--petrol) 55%, var(--ink) 100%);
    box-shadow:0 0 0 3px var(--paper-2), inset 0 0 0 4px #fff3;}
  .eye::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;top:11px;left:11px;}
  .brand h1{
    font-family:var(--sans);
    font-weight:900;
    font-size:26px;
    letter-spacing:-1px;
    margin:0;line-height:.95;
    color:var(--ink);
    text-shadow:1.5px 1.5px 0 rgba(224,121,94,.28);
  }
  .brand h1 small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--petrol);text-shadow:none;text-transform:uppercase;margin-top:2px;}

  .statusbar{
    display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;
  }
  .pill{
    font-size:11px;font-weight:800;letter-spacing:.3px;
    background:var(--paper);border:1.5px solid var(--line);
    padding:5px 10px;border-radius:999px;color:var(--ink);
    display:inline-flex;align-items:center;gap:5px;
  }
  .pill.live{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .pill.fen{background:var(--ochre);border-color:#caa02f;color:#3a2c06;}

  main{flex:1;padding-bottom:24px;}

  /* ---------- cards ---------- */
  .card{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin:12px 0;
    min-width:0;
    overflow-wrap:break-word;
  }
  .card.flat{box-shadow:none;}
  .card h2{
    font-size:15px;font-weight:900;letter-spacing:.2px;margin:0 0 4px;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .card h2 .tick{font-size:13px;}
  .sub{font-size:13px;color:#4a6c75;margin:0 0 12px;}
  .tagline{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--petrol);}

  .eyebrow{
    font-size:10.5px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--coral);margin:0 0 6px;
  }

  /* ---------- buttons ---------- */
  button{font-family:inherit;cursor:pointer;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    background:var(--ink);color:var(--paper);
    border:none;border-radius:14px;
    padding:15px 18px;
    font-size:15.5px;font-weight:800;letter-spacing:.2px;
    box-shadow:var(--shadow);
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{transform:translateY(2px) scale(.995);}
  .btn:disabled{opacity:.45;filter:grayscale(.3);cursor:not-allowed;transform:none;}
  .btn.coral{background:var(--coral);color:#fff;}
  .btn.teal{background:var(--teal);color:#08312d;}
  .btn.ochre{background:var(--ochre);color:#3a2c06;}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;}
  .btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:11px;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}
  :focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:6px;}

  /* ---------- setup ---------- */
  .count-row{display:flex;align-items:center;gap:12px;margin:8px 0 4px;}
  .stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper-2);}
  .stepper button{width:46px;height:46px;border:none;background:transparent;font-size:24px;font-weight:800;color:var(--ink);line-height:1;}
  .stepper button:active{background:var(--line-soft);}
  .stepper .val{width:50px;text-align:center;font-size:22px;font-weight:900;}
  .count-lbl{font-size:13px;color:#4a6c75;font-weight:700;}

  .player-input{display:flex;align-items:center;gap:10px;margin:8px 0;}
  .dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.12);}
  .player-input input{
    flex:1;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);
    padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper-2);
    min-width:0;
  }
  .player-input input:focus{border-color:var(--petrol);background:#fff;}

  /* ---------- splash ---------- */
  .splash{
    position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(120% 90% at 50% 30%, #FBF4DF 0%, var(--cream) 55%, #E8DBBE 100%);
    cursor:pointer;padding:24px;text-align:center;transition:transform .12s ease;-webkit-tap-highlight-color:transparent;
  }
  .splash:active{transform:scale(.992);}
  .splash.leaving{animation:splashOut .2s ease forwards;}
  @keyframes splashOut{to{opacity:0;transform:scale(.96);}}
  .splash .logo-eye{width:96px;height:96px;border-radius:50%;background:var(--paper-2);border:5px solid var(--ink);position:relative;box-shadow:var(--shadow-lg);animation:eyePop .6s ease;}
  .splash .logo-eye::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 38% 35%, #5fb6c2 0 30%, var(--petrol) 55%, var(--ink) 100%);}
  .splash .logo-eye::after{content:"";position:absolute;top:34px;left:34px;width:13px;height:13px;border-radius:50%;background:#fff;}
  .splash h1{font-size:54px;font-weight:900;letter-spacing:-3px;margin:6px 0 0;color:var(--ink);text-shadow:3px 3px 0 rgba(224,121,94,.28);animation:eyePop .6s ease .1s both;}
  .splash .tag{font-family:var(--serif);font-style:italic;color:var(--petrol);font-size:15px;animation:fadeUp .6s ease .25s both;}
  .splash .hint{position:absolute;bottom:30px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--petrol);
    background:rgba(255,255,255,.7);border:2px solid var(--petrol);border-radius:999px;padding:9px 18px;box-shadow:var(--shadow-lg);
    animation:fadeUp .6s ease .35s both, hintBob 1.8s ease-in-out .9s infinite;}
  @keyframes hintBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes eyePop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  @keyframes fadeUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- tutorial ---------- */
  .tut-card{min-height:62vh;display:flex;flex-direction:column;}
  .tut-illus{font-size:72px;text-align:center;margin:18px 0 6px;line-height:1;}
  .tut-step{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--coral);text-align:center;}
  .tut-ttl{font-size:26px;font-weight:900;letter-spacing:-.5px;text-align:center;margin:6px 12px 0;line-height:1.05;}
  .tut-txt{font-size:15px;color:#4a5c61;text-align:center;margin:10px 16px 0;line-height:1.5;}
  .tut-dots{display:flex;gap:7px;justify-content:center;margin:18px 0 14px;}
  .tut-dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:all .2s;}
  .tut-dots i.on{background:var(--coral);width:22px;border-radius:999px;}
  .tut-nav{display:flex;gap:10px;margin-top:auto;}
  .tut-nav .btn{flex:1;}

  /* ---------- avatar ---------- */
  .av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:900;
      background-size:cover;background-position:center;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.12);
      flex:0 0 auto;vertical-align:middle;line-height:1;text-transform:uppercase;}
  .player-row{display:flex;align-items:center;gap:11px;margin:10px 0;}
  .av-up{position:relative;flex:0 0 auto;cursor:pointer;display:inline-flex;}
  .av-up .av{width:46px;height:46px;font-size:20px;}
  .av-cam{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--ochre);
      border:2px solid var(--paper);display:grid;place-items:center;font-size:9px;line-height:1;}
  .player-row .pname{flex:1;font-family:inherit;font-size:15.5px;font-weight:600;color:var(--ink);
      padding:12px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper-2);min-width:0;}
  .player-row .pname:focus{border-color:var(--petrol);background:#fff;}
  .master-badge{flex:0 0 auto;font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;background:var(--ochre);color:#3a2c06;border:1.5px solid #caa02f;border-radius:999px;padding:5px 8px;}

  /* ---------- hero card + category options ---------- */
  .card.hero{border:2px solid var(--petrol);box-shadow:var(--shadow-lg);}
  .card.hero h2{color:var(--petrol);}
  .counter-inline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 6px;padding-bottom:12px;border-bottom:1px dashed var(--line-soft);}
  .counter-inline .lbl{font-size:13px;font-weight:800;color:var(--ink);}
  .counter-inline .count-lbl{font-size:11px;color:#7a6f55;display:block;font-weight:600;}
  .catmode{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
  .catmode button{width:100%;text-align:left;display:flex;flex-direction:column;gap:1px;
      border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--paper-2);color:var(--ink);}
  .catmode button b{font-size:14.5px;}
  .catmode button span{font-size:12px;color:#6c7d82;}
  .catmode button.on{border-color:var(--teal);background:#e3f1ee;box-shadow:inset 0 0 0 1.5px var(--teal);}

  /* ---------- question card ---------- */
  .qcard{
    background:linear-gradient(165deg,#fff 0%,var(--paper-2) 100%);
    border:2px solid var(--ink);border-radius:18px;padding:18px 16px;text-align:center;
    box-shadow:var(--shadow-lg);position:relative;
  }
  .qcat{
    display:inline-block;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
    color:#fff;background:var(--petrol);padding:5px 12px;border-radius:999px;margin-bottom:12px;
  }
  .qtext{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.22;margin:4px 6px;}
  .wr-stat.urgent{color:var(--coral);animation:tickPulse .6s ease infinite;font-weight:900;}
  .qhint{font-size:12px;color:#7a6f55;margin-top:10px;font-style:italic;font-family:var(--serif);}
  .scale-badge{display:inline-block;background:var(--ochre);border:2px solid #caa02f;border-radius:10px;
    padding:8px 14px;font-size:13px;font-weight:800;color:#3a2c06;margin:8px 0 4px;animation:tickPulse 1.4s ease 3;}

  /* ---------- timer ---------- */
  .timer-wrap{text-align:center;margin:14px 0 6px;}
  .timer-num{font-size:54px;font-weight:900;letter-spacing:-2px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .timer-num.warn{color:var(--coral);animation:tickPulse 1s ease infinite;}
  @keyframes tickPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  /* ---- animazioni momenti chiave ---- */
  .res-in{animation:rowIn .4s cubic-bezier(.2,1.2,.4,1) both;}
  @keyframes rowIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .ans-pop{animation:ansPop .55s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes ansPop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
  .cell.just{box-shadow:0 0 0 2.5px var(--coral);animation:cellPing .9s ease 2;}
  @keyframes cellPing{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  .pawn.drop{animation:pawnDrop .5s cubic-bezier(.2,1.4,.4,1) both;}
  .pawn.hop{animation:pawnHop .32s cubic-bezier(.3,1.5,.4,1) both;}
  @keyframes pawnHop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-11px) scale(1.14)}100%{transform:translateY(0) scale(1)}}
  @keyframes pawnDrop{from{transform:translateY(-9px) scale(.6);opacity:0}to{transform:none;opacity:1}}
  .trophy-pop{animation:ansPop .7s cubic-bezier(.2,1.5,.4,1) both;}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden;}
  .confetti i{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px;opacity:.95;
    animation:confFall linear both;}
  @keyframes confFall{0%{transform:translateY(-4vh) rotate(0)}100%{transform:translateY(106vh) rotate(560deg);opacity:.7}}
  .vs-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 4px;flex-wrap:wrap;}
  .vs-side{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;background:var(--paper-2);
    border:2.5px solid var(--pc,var(--ink));border-radius:14px;padding:12px 16px;min-width:96px;animation:rowIn .45s cubic-bezier(.2,1.3,.4,1) both;}
  .vs-badge{font-size:24px;font-weight:900;color:var(--coral);animation:tickPulse 1s ease infinite;letter-spacing:1px;}
  .ncc-letter{font-size:72px;font-weight:900;line-height:1;color:var(--petrol);letter-spacing:-2px;margin:8px 0 2px;}
  .ncc-cat{display:inline-block;font-weight:900;font-size:15px;background:var(--ochre);border-radius:999px;padding:7px 16px;color:#3a2c06;}
  .timer-lbl{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#7a6f55;}
  .tbar{height:9px;border-radius:999px;background:var(--line-soft);overflow:hidden;margin-top:10px;}
  .tbar > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--ochre),var(--coral));transition:width 1s linear;}

  /* ---------- roster "scrivete ora" + penne giù ---------- */
  .write-roster{border-top:1px dashed var(--line-soft);}
  .write-row{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px dashed var(--line-soft);}
  .write-row .wr-nm{flex:1;font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wr-stat{font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;color:var(--petrol);min-width:74px;text-align:right;}
  .wr-stat.reduced{color:var(--coral);}
  .wr-stat.down{color:#fff;background:var(--coral);padding:4px 10px;border-radius:999px;font-size:11.5px;letter-spacing:.4px;min-width:0;}
  .pensgiu{padding:32px 16px;}
  .pg-ic{font-size:64px;line-height:1;animation:pgpop .35s ease;}
  .pg-ttl{font-size:42px;font-weight:900;letter-spacing:-2px;color:var(--ink);margin-top:4px;}
  @keyframes pgpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

  /* ---------- answer rows ---------- */
  .ans-row{display:flex;align-items:center;gap:9px;margin:9px 0;}
  .ans-name{display:flex;align-items:center;gap:7px;width:108px;flex:0 0 auto;font-weight:800;font-size:13.5px;}
  .ans-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ans-row input{
    flex:1;font-family:inherit;font-size:18px;font-weight:800;color:var(--ink);text-align:right;
    padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper-2);min-width:0;
  }
  .ans-row input:focus{border-color:var(--petrol);background:#fff;}
  .ans-row input:disabled{background:#efe7d2;opacity:.7;}
  .mini-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;}
  .tag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:999px;letter-spacing:.2px;}
  .tag.malus{background:#fbe0d8;color:#a23a22;}
  .tag.bonus{background:#dff0d6;color:#3f6b22;}
  .tag.crown{background:var(--ochre);color:#3a2c06;}

  /* ---------- reveal / results ---------- */
  .answer-reveal{text-align:center;margin:6px 0 14px;}
  .answer-reveal .lbl{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#7a6f55;}
  .answer-reveal .big{font-size:40px;font-weight:900;letter-spacing:-1.5px;color:var(--coral);line-height:1.05;}
  .res-row{
    display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;margin:7px 0;
    background:var(--paper-2);border:1.5px solid var(--line-soft);
  }
  .res-row.podium{border-color:var(--ochre);background:#fdf3d9;}
  .rank{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;flex:0 0 auto;background:var(--line-soft);color:var(--ink);}
  .rank.r1{background:var(--ochre);color:#3a2c06;}
  .rank.r2{background:#cfd6d8;color:#2b3d42;}
  .rank.r3{background:#e3b08a;color:#5a2e12;}
  .res-mid{flex:1;min-width:0;}
  .res-mid .nm{font-weight:800;font-size:14px;}
  .res-mid .meta{font-size:11.5px;color:#6c7d82;}
  .res-pts{font-weight:900;font-size:16px;color:var(--teal);white-space:nowrap;}
  .res-pts.zero{color:#a8a08a;}

  /* ---------- board ---------- */
  .board{
    position:relative;display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:4px 2px 6px 28px;
  }

  {"cat":"Cultura Pop","q":"Quanti metri è alto C-3PO secondo il databank ufficiale di Star Wars?","a":1.77,"u":"m","f":"La sua altezza ufficiale è 1,77 metri, ma la caratteristica più fuori scala resta la conoscenza di oltre sette milioni di forme di comunicazione. Il suo compagno R2-D2, invece, comunica soprattutto con segnali elettronici.","fs":"https://www.starwars.com/databank/c-3po/"},
  {"cat":"Cultura Pop","q":"In quanti film numerati della saga degli Skywalker, dagli Episodi I a IX, compare R2-D2?","a":9,"u":"film","f":"R2-D2 attraversa tutte e tre le trilogie, servendo Padmé, Anakin e Luke. È uno dei rarissimi personaggi a collegare direttamente l'intero arco cinematografico I-IX.","fs":"https://www.starwars.com/databank/r2-d2"},
  {"cat":"Cultura Pop","q":"In quale anno uscì Steamboat Willie, data celebrata come compleanno di Topolino?","a":1928,"u":"anno","f":"La data simbolica è il 18 novembre 1928, quando il corto fu proiettato al Colony Theatre di New York. Disney usa quella première come compleanno ufficiale di Mickey Mouse.","fs":"https://thewaltdisneycompany.com/press-releases/disney-celebrates-90-years-mickey-mouse-worldwide-festivities/"},
  {"cat":"Cultura Pop","q":"In quale anno aprì Disneyland in California?","a":1955,"u":"anno","f":"Disneyland aprì il 17 luglio su 54 acri ad Anaheim. Il castello della Bella Addormentata era già presente, ma il percorso interno fu aperto soltanto nel 1957.","fs":"https://disneyland.disney.go.com/en-ca/attractions/disneyland/sleeping-beauty-castle-walkthrough/"},
  {"cat":"Cultura Pop","q":"In quale anno debuttò la minifigure LEGO con braccia e gambe mobili?","a":1978,"u":"anno","f":"Le prime minifigure avevano due semplici punti per gli occhi e un sorriso nero. I loro stampi erano così precisi che pezzi del 1978 possono ancora combinarsi con quelli moderni.","fs":"https://www.lego.com/en-us/aboutus/news/2019/october/minifigure-40"},
  {"cat":"Cultura Pop","q":"In quale anno uscì il primo Super Mario Bros. per Famicom in Giappone?","a":1985,"u":"anno","f":"La data giapponese fu il 13 settembre 1985. Nel manuale originale, i Koopa trasformano gli abitanti del Regno dei Funghi persino in pietre, mattoni e piante.","fs":"https://www.nintendo.com/en-gb/Iwata-Asks/Super-Mario-Bros-25th-Anniversary/Vol-1-Itoi-asks-Miyamoto/1-Expressing-the-Inexpressible/1-Expressing-the-Inexpressible-217174.html"},
  {"cat":"Internet","q":"In quale anno Tim Berners-Lee inventò il World Wide Web al CERN?","a":1989,"u":"anno","f":"Il Web nacque per facilitare lo scambio automatico di informazioni tra scienziati. Non coincide con Internet: è uno dei servizi costruiti sopra la rete.","fs":"https://home.cern/science/computing/the-birth-of-the-web/"},
  {"cat":"Internet","q":"In quale anno il CERN mise il software del World Wide Web nel pubblico dominio?","a":1993,"u":"anno","f":"Il 30 aprile 1993 il CERN rese il software liberamente disponibile. Quella scelta evitò licenze proprietarie e permise al Web di diffondersi senza pedaggi tecnologici.","fs":"https://home.cern/science/computing/the-birth-of-the-web/"},
  {"cat":"Internet","q":"In quale anno fu scritto il primo browser WorldWideWeb?","a":1990,"u":"anno","f":"Il primo browser era anche un editor: si potevano non solo leggere, ma creare pagine. Girava sul computer NeXT di Tim Berners-Lee, che ospitò anche il primo server web.","fs":"https://home.cern/science/computing/the-birth-of-the-web/"},
  {"cat":"Internet","q":"Quanti computer host erano collegati alla prima ARPANET entro la fine del 1969?","a":4,"u":"computer","f":"I quattro nodi erano UCLA, Stanford Research Institute, UC Santa Barbara e University of Utah. Il primo messaggio tra host fu inviato da UCLA a Stanford.","fs":"https://www.internetsociety.org/internet/history-internet/brief-history-internet/"},
  {"cat":"Internet","q":"In quale anno si tenne la prima grande dimostrazione pubblica di ARPANET?","a":1972,"u":"anno","f":"La dimostrazione avvenne alla International Computer Communication Conference. Nello stesso anno l'email divenne la prima applicazione davvero popolare della rete.","fs":"https://www.internetsociety.org/internet/history-internet/brief-history-internet/"},
  {"cat":"Internet","q":"Quanti gigabyte gratuiti offriva Gmail al lancio nel 2004?","a":1,"u":"GB","f":"Era circa cento volte lo spazio tipico delle webmail gratuite dell'epoca. La data del lancio, il primo aprile, fece pensare a molti che fosse uno scherzo.","fs":"https://blog.google/products-and-platforms/products/gmail/hitting-send-on-the-next-15-years-of-gmail/"},
  {"cat":"Internet","q":"In quale anno fu lanciato Gmail?","a":2004,"u":"anno","f":"Gmail debuttò il primo aprile con ricerca integrata e messaggi raggruppati in conversazioni. Il suo gigabyte gratuito obbligò il mercato a ripensare il concetto di spazio nella posta elettronica.","fs":"https://blog.google/products-and-platforms/products/gmail/email-is-50-years-old-and-still-where-its/"},
  {"cat":"Internet","q":"Quanti secondi dura Me at the zoo, il primo video caricato su YouTube?","a":19,"u":"secondi","f":"Il cofondatore Jawed Karim parla davanti agli elefanti dello zoo di San Diego. Quel frammento a bassa risoluzione è oggi conservato anche come oggetto di storia digitale dal Victoria and Albert Museum.","fs":"https://blog.youtube/news-and-events/va-museum-youtube-first-video/"},
  {"cat":"Internet","q":"Quanti miliardi di ore di YouTube venivano guardate ogni giorno nel traguardo annunciato nel 2017?","a":1,"u":"miliardi di ore","f":"Guardare un miliardo di ore in sequenza richiederebbe più di centomila anni. YouTube scelse il tempo di visione, non il semplice numero di clic, come misura centrale del coinvolgimento.","fs":"https://blog.youtube/news-and-events/you-know-whats-cool-billion-hours/"},
  {"cat":"Internet","q":"A quanti caratteri fu esteso il limite standard dei tweet nel 2017 per molte lingue?","a":280,"u":"caratteri","f":"Dopo il lancio, soltanto il 5% dei tweet superava i vecchi 140 caratteri. Cinese, giapponese e coreano mantennero il limite precedente perché concentrano più informazione in ogni carattere.","fs":"https://blog.x.com/en_us/topics/product/2017/tweetingmadeeasier"},
  {"cat":"Scienza","q":"A quanti chilometri orari orbita circa il Sistema Solare attorno al centro della Via Lattea?","a":829000,"u":"km/h","f":"Anche a questa velocità vertiginosa, un giro della galassia richiede circa 230 milioni di anni. Il Sole si trova nel Braccio di Orione, una struttura minore della Via Lattea.","fs":"https://science.nasa.gov/solar-system/solar-system-facts/"},
  {"cat":"Scienza","q":"Quanti milioni di anni impiega circa il Sistema Solare per completare un'orbita della Via Lattea?","a":230,"u":"milioni di anni","f":"Un giro galattico viene chiamato talvolta anno cosmico. Dalla formazione del Sole, il Sistema Solare ne avrebbe completati soltanto una ventina.","fs":"https://science.nasa.gov/solar-system/solar-system-facts/"},
  {"cat":"Scienza","q":"Quanti pianeti nani hanno un nome ufficialmente riconosciuto nel Sistema Solare secondo la NASA?","a":5,"u":"pianeti nani","f":"Plutone è solo il più famoso e risulta persino più piccolo della nostra Luna. Oltre Nettuno, nella fascia di Kuiper, orbitano moltissimi altri mondi ghiacciati.","fs":"https://science.nasa.gov/solar-system/solar-system-facts/"},
  {"cat":"Scienza","q":"Quanti pianeti compongono ufficialmente il Sistema Solare?","a":8,"u":"pianeti","f":"I primi quattro sono mondi rocciosi; più lontano troviamo due giganti gassosi e due giganti ghiacciati. Venere è il più caldo, anche se Mercurio è più vicino al Sole.","fs":"https://science.nasa.gov/solar-system/solar-system-facts/"},
  {"cat":"Scienza","q":"Oltre quale percentuale della materia originaria del Sistema Solare è concentrata nel Sole secondo la NASA?","a":99,"u":"%","f":"Il Sole raccolse oltre il 99% della materia disponibile nella nube originaria. Tutti i pianeti, le lune, gli asteroidi e le comete condividono quindi meno dell'1% restante.","fs":"https://science.nasa.gov/solar-system/solar-system-facts/"},
  {"cat":"Scienza","q":"Quante lune orbitano attorno a Plutone?","a":5,"u":"lune","f":"Caronte è così grande rispetto a Plutone da farlo oscillare durante l'orbita. È un rapporto eccezionale tra un mondo e il suo satellite principale.","fs":"https://science.nasa.gov/solar-system/solar-system-facts/"},
  {"cat":"Scienza","q":"Quanti giorni terrestri impiega la Luna per completare un'orbita attorno alla Terra, secondo il valore medio NASA?","a":27.3,"u":"giorni","f":"Durante quell'orbita la Luna resta a una distanza media di circa 384.400 chilometri dalla Terra. Mostra quasi sempre lo stesso emisfero perché rotazione e rivoluzione sono sincronizzate.","fs":"https://science.nasa.gov/learn/basics-of-space-flight/chapter1-2/"},
  {"cat":"Scienza","q":"Quanti giorni terrestri dura un anno su Marte?","a":687,"u":"giorni","f":"L'anno marziano è quasi doppio di quello terrestre, mentre il giorno è sorprendentemente simile al nostro. Questa combinazione produce stagioni molto più lunghe.","fs":"https://pubs.usgs.gov/of/1998/0507a/report.pdf"},
  {"cat":"Scienza","q":"Quanti minuti oltre le 24 ore dura mediamente un giorno solare su Marte?","a":37,"u":"minuti","f":"Il giorno marziano, chiamato sol, dura circa 24 ore e 37 minuti. Per chi controlla i rover dalla Terra, quell'ora di inizio slitta ogni giorno di oltre mezz'ora.","fs":"https://pubs.usgs.gov/of/1998/0507a/report.pdf"},
  {"cat":"Scienza","q":"Quanti chilometri misura circa il raggio medio di Giove secondo la NASA?","a":69911,"u":"km","f":"Giove ha un diametro circa undici volte quello terrestre. Il Sole, a sua volta, ha un diametro approssimativamente dieci volte quello di Giove.","fs":"https://science.nasa.gov/resource/solar-system-sizes/"}
  ,
  {"cat":"Animali","q":"Quanti cuori ha un polpo?","a":3,"u":"cuori","f":"Due cuori spingono il sangue verso le branchie, mentre il terzo lo distribuisce al resto del corpo. Il sangue è blu perché usa emocianina, una molecola a base di rame.","fs":"https://ocean.si.edu/ocean-life/invertebrates/octopuses-squids-and-relatives"},
  {"cat":"Animali","q":"Quanti metri misurava il calamaro gigante più lungo mai documentato scientificamente?","a":13,"u":"m","f":"Nonostante la mole, il calamaro gigante resta elusivo: il primo esemplare fu filmato nel suo ambiente naturale soltanto nel 2012. Gran parte di ciò che sappiamo proviene da carcasse trovate in superficie.","fs":"https://ocean.si.edu/ocean-life/invertebrates/giant-squid"},
  {"cat":"Animali","q":"Qual era, in anni, il limite inferiore dell'età stimata per la femmina di squalo della Groenlandia più grande analizzata nello studio citato dalla NOAA?","a":272,"u":"anni","f":"Per stimarne l'età, i ricercatori hanno datato al carbonio proteine del cristallino formate prima della nascita. L'intervallo completo stimato per quella femmina era addirittura 272-512 anni.","fs":"https://oceanservice.noaa.gov/facts/greenland-shark.html"},
  {"cat":"Animali","q":"A quanti metri arrivò l'immersione record documentata di un pinguino imperatore della colonia di Auster nel 1994?","a":564,"u":"m","f":"Quel pinguino effettuò 11 immersioni oltre i 500 metri e 61 oltre i 400 in appena sei giorni. È una profondità eccezionale persino per questa specie specializzata.","fs":"https://repository.library.noaa.gov/view/noaa/28060/noaa_28060_DS1.pdf"},
  {"cat":"Animali","q":"Quanti centimetri può estendere fuori dalla bocca la lingua di un formichiere gigante?","a":61,"u":"cm","f":"La lingua è collegata allo sterno e può scattare circa 150 volte al minuto. Il formichiere non ha denti: cattura gli insetti grazie alla saliva appiccicosa.","fs":"https://animaldiversity.org/accounts/Myrmecophaga_tridactyla/"},
  {"cat":"Animali","q":"Quante uova depone in media una tartaruga liuto in una covata?","a":105,"u":"uova","f":"Una parte delle uova è priva di tuorlo e non si svilupperà. Dopo aver coperto il nido con la sabbia, la madre torna in mare e non presta altre cure parentali.","fs":"https://animaldiversity.org/accounts/Dermochelys_coriacea/"},
  {"cat":"Animali","q":"A quanti chilometri orari possono nuotare sott'acqua i pinguini, secondo la NOAA?","a":40,"u":"km/h","f":"I pinguini non volano nell'aria, ma sott'acqua usano le ali come pinne. La loro sagoma compatta riduce la resistenza e li trasforma in nuotatori velocissimi.","fs":"https://oceanservice.noaa.gov/facts/penguinsfly.html"},
  {"cat":"Animali","q":"Quanti compartimenti ha lo stomaco di una mucca?","a":4,"u":"compartimenti","f":"La mucca ha un solo stomaco, diviso in rumine, reticolo, omaso e abomaso. Nel rumine, microrganismi specializzati rendono digeribile la fibra vegetale.","fs":"https://www.ars.usda.gov/ARSUserFiles/50901500/EducationalMaterialsMarch2012/rumens%20are%20special.pdf"},
  {"cat":"Animali","q":"Quanti giorni dura in media la gravidanza di un elefante asiatico?","a":659,"u":"giorni","f":"Sono circa 18-22 mesi, la gestazione più lunga del regno animale. Alla nascita un cucciolo può già pesare tra 68 e 158 chilogrammi.","fs":"https://nationalzoo.si.edu/animals/asian-elephant-faqs"},
  {"cat":"Animali","q":"Quanti insetti grandi come zanzare può catturare in un'ora un piccolo vespertilio bruno?","a":1200,"u":"insetti","f":"Questo pipistrello localizza le prede con l'ecolocalizzazione, trasformando gli echi in una mappa sonora. Una colonia può così offrire un enorme servizio naturale di controllo degli insetti.","fs":"https://www.nps.gov/noca/learn/nature/bats.htm"},
  {"cat":"Libri","q":"In quanti capitoli è diviso Alice nel Paese delle Meraviglie?","a":12,"u":"capitoli","f":"Il manoscritto Alice's Adventures Under Ground ne aveva soltanto quattro. Lewis Carroll ampliò la storia a più del doppio, creando dodici capitoli più brevi e intitolati.","fs":"https://searcharchives.bl.uk/catalog/032-002102746"},
  {"cat":"Libri","q":"Quanti sonetti comprende la raccolta di Shakespeare pubblicata nel 1609?","a":154,"u":"sonetti","f":"L'edizione del 1609 si apre con una dedica all'enigmatico «Mr. W.H.», la cui identità non è mai stata stabilita. Solo una piccola parte dei sonetti specifica il genere della persona amata.","fs":"https://www.folger.edu/explore/shakespeares-works/shakespeares-sonnets/about-shakespeares-sonnets/"},
  {"cat":"Libri","q":"Quante righe conta Amleto nell'edizione Folger, il dramma più lungo di Shakespeare?","a":4167,"u":"righe","f":"Il conteggio Folger rende Amleto il testo teatrale shakespeariano più lungo. La sua ampiezza contribuisce alle grandi differenze di durata tra le varie messe in scena.","fs":"https://www.folger.edu/explore/shakespeares-works/frequently-asked-questions/"},
  {"cat":"Libri","q":"Quante righe conta La commedia degli errori nell'edizione Folger?","a":1898,"u":"righe","f":"È il dramma più breve attribuito a Shakespeare secondo il conteggio Folger. La trama concentra scambi d'identità e caos comico attorno a due coppie di gemelli.","fs":"https://www.folger.edu/explore/shakespeares-works/frequently-asked-questions/"},
  {"cat":"Libri","q":"Quante opere teatrali di Shakespeare sono note oggi soltanto perché incluse nel First Folio del 1623?","a":18,"u":"opere","f":"Alla morte di Shakespeare, circa metà dei suoi drammi non era mai stata stampata. Senza il First Folio, capolavori come Macbeth e La tempesta avrebbero potuto andare perduti.","fs":"https://www.folger.edu/explore/shakespeare-in-print/publishing-shakespeare/"},
  {"cat":"Libri","q":"Quanti romanzi scrisse Charles Dickens tra il 1836 e il 1870?","a":15,"u":"romanzi","f":"Dickens usò spesso la pubblicazione a puntate, trasformando l'attesa dei lettori in parte dell'esperienza. Nei suoi libri denunciò povertà e squilibri sociali dell'età vittoriana.","fs":"https://dickensmuseum.com/pages/about-us"},
  {"cat":"Libri","q":"In quante settimane Charles Dickens scrisse Canto di Natale?","a":6,"u":"settimane","f":"L'idea nacque dalla lettura di un rapporto sulle condizioni dei bambini nelle miniere. Dickens trasformò l'indignazione in una storia capace di raggiungere molti più lettori di un pamphlet politico.","fs":"https://dickensmuseum.com/blogs/charles-dickens-museum/10-surprising-facts-about-charles-dickens"},
  {"cat":"Libri","q":"In quanti libri è tradizionalmente suddivisa l'Iliade?","a":24,"u":"libri","f":"La divisione richiama le 24 lettere dell'alfabeto greco ed è condivisa anche dall'Odissea. L'Iliade, però, concentra il racconto su un breve tratto dell'ultimo anno della guerra di Troia.","fs":"https://www.poetryfoundation.org/poets/george-chapman"},
  {"cat":"Libri","q":"In quanti libri interni è organizzato Il Signore degli Anelli, oltre alle appendici?","a":6,"u":"libri","f":"L'opera è spesso venduta in tre volumi, ma la struttura narrativa è in sei libri. Tolkien ne sviluppò il testo dal 1937 fino al completamento nel 1949.","fs":"https://www.tolkienestate.com/writing/david-bratman-the-history-of-middle-earth/"},
  {"cat":"Libri","q":"Quanti anni aveva Rudyard Kipling quando ricevette il Nobel per la Letteratura nel 1907?","a":41,"u":"anni","f":"Nato il 30 dicembre 1865, non aveva ancora compiuto 42 anni al momento del premio. Il Nobel celebrò il talento narrativo dell'autore che aveva già reso celebre Il libro della giungla.","fs":"https://www.nobelprize.org/prizes/literature/1907/kipling/facts/"},
  {"cat":"Arte","q":"Quanti centimetri è alta la Venere di Milo?","a":204,"u":"cm","f":"La statua è scolpita in marmo di Paro e fu ritrovata sull'isola di Milo nel 1820. È composta da due grandi blocchi uniti all'altezza dei fianchi.","fs":"https://collections.louvre.fr/en/ark:/53355/cl010277627"},
  {"cat":"Arte","q":"Quanti centimetri è alta la tela Las Meninas di Velázquez?","a":318,"u":"cm","f":"La tela è monumentale, ma la sua vera vertigine è concettuale: Velázquez raffigura sé stesso mentre dipinge. Specchi, sguardi e spazio trasformano il quadro in una riflessione sulla pittura.","fs":"https://www.museodelprado.es/en/whats-on/exhibition/meta-painting-a-journey-to-the-idea-of-art/1d0500f9-5f3c-4ad0-a345-5626e65fa702"},
  {"cat":"Arte","q":"Quanti centimetri è larga La persistenza della memoria di Salvador Dalí?","a":33,"u":"cm","f":"Il celebre paesaggio degli orologi molli è sorprendentemente piccolo, poco più largo di un foglio A4. Le formiche sul quadrante dorato sono un simbolo di decomposizione ricorrente nell'opera di Dalí.","fs":"https://www.moma.org/collection/works/79018"},
  {"cat":"Arte","q":"Quanti centimetri è alta La ragazza con l'orecchino di perla di Vermeer?","a":44.5,"u":"cm","f":"Non è un ritratto commissionato, ma una «tronie»: lo studio di un volto immaginario. La perla è resa con pochissime pennellate luminose e potrebbe essere un gioiello di fantasia.","fs":"https://www.mauritshuis.nl/en/our-collection/artworks/670-girl-with-a-pearl-earring/"},
  {"cat":"Arte","q":"Quanti centimetri è larga La nascita di Venere di Botticelli?","a":278.5,"u":"cm","f":"A differenza della Primavera, l'opera è dipinta su tela, supporto insolito per una grande pittura fiorentina del Quattrocento. Nei capelli della dea furono aggiunti riflessi dorati.","fs":"https://www.uffizi.it/en/artworks/birth-of-venus"},
  {"cat":"Arte","q":"Quanti centimetri è alto l'Autoritratto con tavolozza di Van Gogh conservato alla National Gallery of Art di Washington?","a":57.79,"u":"cm","f":"Van Gogh lo dipinse nel 1889 durante la convalescenza dopo una crisi. I blu vorticosi dello sfondo contrastano con i toni ramati di capelli e barba.","fs":"https://www.nga.gov/artworks/106382-self-portrait"},
  {"cat":"Arte","q":"Quanti centimetri è alto American Gothic di Grant Wood?","a":78,"u":"cm","f":"I due modelli non erano una coppia: Wood scelse sua sorella e il proprio dentista. La casa dell'Iowa, con la finestra ad arco, diede al dipinto il titolo e l'idea iniziale.","fs":"https://archive.artic.edu/homer_exhb/assets/Rsrc_001087.pdf"},
  {"cat":"Arte","q":"Quanti centimetri è largo Il bacio di Gustav Klimt?","a":180,"u":"cm","f":"La tela è perfettamente quadrata e occupa oltre tre metri quadrati. Klimt unì pittura a olio, foglia d'oro e metalli per trasformare l'abbraccio in una superficie luminosa.","fs":"https://print.belvedere.at/en/p/gustav-klimt-the-kiss-lovers/"},
  {"cat":"Arte","q":"Quanti centimetri è alta la Venere Italica di Antonio Canova conservata agli Uffizi?","a":171.5,"u":"cm","f":"Canova ricevette l'incarico dopo che la Venere de' Medici era stata requisita dai francesi. Invece di copiarla, ideò una dea più dinamica e alta quasi quanto una persona reale.","fs":"https://www.uffizi.it/en/artworks/canova-venus-italica"},
  {"cat":"Arte","q":"Quanti centimetri è larga La maja desnuda di Francisco Goya?","a":191,"u":"cm","f":"Il dipinto fu realizzato prima del 1800 e ha quasi la stessa larghezza di una persona distesa. Goya dipinse anche una versione vestita nella medesima posa.","fs":"https://www.museodelprado.es/en/whats-on/exhibition/didactic-exhibition-the-prado-in-fuengirola/1086a3ef-aa21-43ed-80f4-51dbab98a32c"},
  {"cat":"Cibo e Calorie","q":"Quante chilocalorie forniscono 100 grammi di banana fresca secondo le tabelle CREA?","a":76,"u":"kcal","f":"La stessa quantità apporta circa 350 milligrammi di potassio e 16 di vitamina C. La parte edibile indicata dal CREA è il 65% del frutto intero.","fs":"https://www.alimentinutrizione.it/tabelle-nutrizionali/007510"},
  {"cat":"Cibo e Calorie","q":"Quante chilocalorie forniscono 100 grammi di mela fresca con la buccia secondo le tabelle CREA?","a":44,"u":"kcal","f":"Una porzione da 150 grammi arriva a circa 65 chilocalorie. Il dato considera la buccia e stima come edibile l'85% del frutto acquistato.","fs":"https://www.alimentinutrizione.it/tabelle-nutrizionali/007120"},
  {"cat":"Cibo e Calorie","q":"Quante chilocalorie forniscono 100 grammi di ceci secchi bolliti e scolati secondo le tabelle CREA?","a":132,"u":"kcal","f":"Quei 100 grammi contengono circa 7 grammi di proteine e 45 microgrammi di folati. La cottura del campione è avvenuta senza aggiunta di sale.","fs":"https://www.alimentinutrizione.it/tabelle-nutrizionali/004005"},
  {"cat":"Cibo e Calorie","q":"Quante chilocalorie forniscono 100 grammi di avocado fresco secondo le tabelle CREA?","a":238,"u":"kcal","f":"Il valore energetico dipende soprattutto dai 23 grammi di lipidi presenti. Nella stessa quantità il CREA registra circa 450 milligrammi di potassio.","fs":"https://www.alimentinutrizione.it/tabelle-nutrizionali/007490"},
  {"cat":"Cibo e Calorie","q":"Quante chilocalorie forniscono 100 grammi di carote crude secondo le tabelle CREA?","a":41,"u":"kcal","f":"Le carote sono costituite per circa il 90% da acqua e apportano 3,1 grammi di fibra ogni 100 grammi. Il colore arancio è legato ai carotenoidi.","fs":"https://www.alimentinutrizione.it/tabelle-nutrizionali/005150"},
  {"cat":"Cibo e Calorie","q":"Quante chilocalorie fornisce la porzione edibile da 50 grammi di un uovo di gallina intero secondo le tabelle CREA?","a":64,"u":"kcal","f":"Un uovo intero pesa mediamente 55 grammi: circa 5 sono guscio, 35 albume e 15 tuorlo. La porzione edibile da 50 grammi contiene circa 6,2 grammi di proteine.","fs":"https://www.alimentinutrizione.it/tabelle-nutrizionali/181100"},

  {"cat":"Cibo e Calorie","q":"Quante chilocalorie forniscono 100 grammi di salmone crudo secondo le tabelle CREA?","a":185,"u":"kcal","f":"La stessa quantità contiene circa 18,4 grammi di proteine e 12 grammi di lipidi. La parte edibile stimata è il 65% del pesce intero.","fs":"https://www.alimentinutrizione.it/tabelle-nutrizionali/122400"},
  {"cat":"Cibo e Calorie","q":"Quante chilocalorie forniscono 100 grammi di lenticchie secche bollite e scolate secondo le tabelle CREA?","a":109,"u":"kcal","f":"Quei 100 grammi apportano circa 8,3 grammi di fibra e 3 milligrammi di ferro. Il campione è stato bollito senza sale e poi scolato.","fs":"https://www.alimentinutrizione.it/tabelle-nutrizionali/004505"},
  {"cat":"Spazio & Tempo","q":"Quanti metri è lungo complessivamente il Golden Gate Bridge, includendo gli accessi tra le due spalle?","a":2737,"u":"m","f":"La sola campata principale tra le torri misura 1.280 metri. Quando aprì nel 1937 stabilì il record mondiale per la campata sospesa più lunga.","fs":"https://www.goldengate.org/bridge/history-research/statistics-data/design-construction-stats/"},
  {"cat":"Spazio & Tempo","q":"Quanti metri è alta la Tokyo Skytree?","a":634,"u":"m","f":"Le cifre 6-3-4 possono essere lette in giapponese come «Mu-sa-shi», antico nome della regione. Dal 2011 Guinness la riconosce come la torre autoportante più alta del mondo.","fs":"https://www.tokyo-skytree.jp/about/spec/"},
  {"cat":"Spazio & Tempo","q":"Quanti chilometri misura approssimativamente il Canale di Panama tra Atlantico e Pacifico?","a":80,"u":"km","f":"Il canale non attraversa Panama in linea perfettamente retta: sfrutta laghi artificiali e chiuse per superare il dislivello. La scorciatoia evita alle navi il lungo giro attorno al Sud America.","fs":"https://pancanal.com/en/history-of-the-panama-canal/"},
  {"cat":"Spazio & Tempo","q":"Quanti metri raggiunge la torre centrale di Gesù della Sagrada Família?","a":172.5,"u":"m","f":"Con l'installazione del braccio superiore della croce nel 2026, la basilica ha raggiunto il suo punto più alto. La croce è rivestita di ceramica bianca smaltata e vetro, materiali scelti per riflettere la luce.","fs":"https://blog.sagradafamilia.org/en/phases-construction-jesus-tower/"},
  {"cat":"Spazio & Tempo","q":"Quanti minuti impiega la luce del Sole a raggiungere la Terra secondo il valore NASA di sola andata?","a":8.35,"u":"min","f":"Guardare il Sole significa quindi vederlo com'era poco più di otto minuti prima. La distanza media indicata dalla NASA è di circa 150,2 milioni di chilometri.","fs":"https://science.nasa.gov/earth/facts/"},
  {"cat":"Spazio & Tempo","q":"Quanti secondi impiega la luce per andare dalla Terra alla Luna?","a":1.3,"u":"secondi","f":"Una comunicazione Terra-Luna richiede quindi almeno 2,6 secondi tra andata e ritorno del segnale. Questo ritardo era percepibile nei dialoghi con gli astronauti Apollo.","fs":"https://nightsky.jpl.nasa.gov/docs/moonmission05.pdf"},
  {"cat":"Spazio & Tempo","q":"Quante ore dura una rotazione completa della Terra rispetto alle stelle, nel valore sintetico indicato dalla NASA?","a":23.9,"u":"ore","f":"Il giorno astronomico non coincide esattamente con le 24 ore dell'orologio civile. Mentre ruota, la Terra avanza anche lungo la propria orbita attorno al Sole.","fs":"https://science.nasa.gov/earth/facts/"},
  {"cat":"Spazio & Tempo","q":"Quanti giorni impiega la Terra a completare un'orbita attorno al Sole, secondo la NASA?","a":365.25,"u":"giorni","f":"Il quarto di giorno che avanza ogni anno è il motivo per cui aggiungiamo periodicamente il 29 febbraio. Il calendario riallinea così le date al ciclo delle stagioni.","fs":"https://science.nasa.gov/earth/facts/"},
  {"cat":"Spazio & Tempo","q":"Quanti minuti impiega circa la Stazione Spaziale Internazionale a completare un'orbita terrestre?","a":90,"u":"min","f":"In un giorno la ISS completa circa 16 orbite, facendo assistere l'equipaggio a 16 albe e 16 tramonti. Viaggia a quasi 28.000 chilometri orari.","fs":"https://www.nasa.gov/international-space-station/space-station-facts-and-figures/"},
  {"cat":"Spazio & Tempo","q":"A quanti chilometri sopra la Terra orbita approssimativamente la Stazione Spaziale Internazionale?","a":400,"u":"km","f":"A quella quota esiste ancora una tenue atmosfera che rallenta gradualmente la stazione. Per questo la ISS deve essere periodicamente riportata su un'orbita più alta.","fs":"https://www.nasa.gov/humans-in-space/why-do-research-on-the-international-space-station/"},
  {"cat":"Dati da Bar","q":"Quanti residenti stranieri risultavano in Italia al 31 dicembre 2024 secondo il Censimento Istat?","a":5371251,"u":"persone","f":"Rappresentavano il 9,1% della popolazione residente. Rispetto al 2023, il loro numero era cresciuto del 22,4 per mille.","fs":"https://www.istat.it/comunicato-stampa/censimento-e-dinamica-della-popolazione-anno-2024/"},

  {"cat":"Dati da Bar","q":"Qual è stato il numero medio di figli per donna in Italia nel 2024 secondo Istat?","a":1.18,"u":"figli","f":"È il minimo storico registrato nel Paese, sotto il precedente 1,19 del 1995. Il calo dipende sia dalla fecondità sia dalla riduzione delle generazioni in età fertile.","fs":"https://www.istat.it/comunicato-stampa/natalita-e-fecondita-della-popolazione-residente-anno-2024/"},
  {"cat":"Dati da Bar","q":"Qual era l'età media della popolazione italiana al 1° gennaio 2025 secondo Istat?","a":46.8,"u":"anni","f":"L'età media sintetizza un Paese sempre più anziano. Nella stessa fotografia demografica, solo l'11,9% dei residenti aveva meno di 15 anni.","fs":"https://www.istat.it/infografiche/giornata-mondiale-della-popolazione-2025/"},
  {"cat":"Dati da Bar","q":"Quale percentuale della popolazione italiana aveva almeno 65 anni al 1° gennaio 2025 secondo Istat?","a":24.7,"u":"%","f":"Quasi un residente su quattro rientrava nella fascia 65 anni e oltre. La fascia tra 15 e 64 anni rappresentava invece il 63,4% del totale.","fs":"https://www.istat.it/infografiche/giornata-mondiale-della-popolazione-2025/"},
  {"cat":"Dati da Bar","q":"Quale percentuale della popolazione italiana aveva almeno 85 anni al 1° gennaio 2025 secondo Istat?","a":4.1,"u":"%","f":"Gli ultraottantacinquenni erano più di quattro persone ogni cento. In questa fascia d'età, sei residenti su dieci erano donne.","fs":"https://www.istat.it/infografiche/giornata-mondiale-della-popolazione-2025/"},
  {"cat":"Dati da Bar","q":"Quanti anni era la speranza di vita media alla nascita in Italia nel 2024 secondo Istat?","a":83.4,"u":"anni","f":"Il valore era salito di circa cinque mesi rispetto al 2023. La media nascondeva una differenza: 81,4 anni per gli uomini e 85,5 per le donne.","fs":"https://www.istat.it/produzione-editoriale/rapporto-sdgs-2025-informazioni-statistiche-per-lagenda-2030-in-italia/"},
  {"cat":"Dati da Bar","q":"Quanti componenti aveva in media una famiglia italiana nel biennio 2024-2025 secondo Istat?","a":2.2,"u":"componenti","f":"Vent'anni prima la media era 2,6. Nel 2024-2025 le persone che vivevano sole rappresentavano il 16,9% dell'intera popolazione.","fs":"https://www.istat.it/comunicato-stampa/indicatori-demografici-anno-2025/"},

  {"cat":"Record Assurdi","q":"Quanti centimetri misurava la lingua maschile da Guinness di Nick Stoeberl, verificata nel 2012?","a":10.1,"u":"cm","f":"La misura va dalla punta della lingua al centro del labbro superiore chiuso. Nick ha trasformato il primato in una specialità, arrivando perfino a dipingere con la lingua.","fs":"https://www.guinnessworldrecords.com/news/2023/3/man-with-longest-tongue-in-the-world-laps-up-new-record-title-740894"},

  {"cat":"Record Assurdi","q":"Quanti centimetri di diametro raggiunse la bolla di gomma da masticare record di Chad Fell nel 2004?","a":50.8,"u":"cm","f":"La bolla fu realizzata senza usare le mani e doveva restare intatta per cinque secondi. Chad usò tre pezzi di gomma e li masticò a lungo per ridurne lo zucchero.","fs":"https://www.guinnessworldrecords.com/news/2025/10/he-blew-away-the-competition-the-bubblegum-record-no-ones-been-able-to-pop"},
  {"cat":"Record Assurdi","q":"Quanti centimetri misurava il naso da Guinness di Mehmet Özyürek, ricontrollato nel 2021?","a":8.8,"u":"cm","f":"La misura andava dal ponte alla punta ed era identica a quella rilevata vent'anni prima. Il controllo ha anche smentito, nel suo caso, il mito che il naso continui a crescere per sempre.","fs":"https://www.guinnessworldrecords.com/news/2021/11/i-have-been-blessed-mehmet-ozyurek-on-his-record-breaking-nose-683648"},
  {"cat":"Record Assurdi","q":"Quanti cucchiai riuscì a tenere contemporaneamente sul corpo Abolfazl Saber Mokhtari nel record Guinness del 2025?","a":96,"u":"cucchiai","f":"Aveva già detenuto il record con 85 e poi 88 cucchiai. Durante il tentativo doveva restare immobile mentre un assistente disponeva con pazienza ogni posata.","fs":"https://www.guinnessworldrecords.com/news/2025/5/man-balances-96-spoons-on-body-to-break-own-record-i-can-stick-any-object-to-my-skin"},

  {"cat":"Record Assurdi","q":"In quanti secondi Ryusei Yonee corse 100 metri a quattro zampe nel record Guinness del 2025?","a":14.55,"u":"secondi","f":"Yonee studiò il movimento di cani, gatti e scimmie, poi adattò la tecnica alla pista. Migliorò di oltre un secondo il precedente 15,66 del 2022.","fs":"https://www.guinnessworldrecords.com/news/2025/9/japanese-man-runs-100-m-on-all-fours-in-blistering-time-after-studying-way-animals-move"},

  {"cat":"Tabù","q":"A quanti anni si raggiunge in media la menopausa negli Stati Uniti, secondo il National Institute on Aging?","a":52,"u":"anni","f":"La transizione comincia spesso tra 45 e 55 anni e può durare diversi anni. La menopausa si conferma dopo dodici mesi consecutivi senza mestruazioni o spotting.","fs":"https://www.nia.nih.gov/health/menopause/what-menopause"},

function addUniqueEffect(list, effect){
  if(!effect || list.some(item=>item.id===effect.id)) return false;
  list.push(effect);
  return true;
}

  });
  FENOMENO_MALUS.forEach(effect=>addUniqueEffect(player.malus,effect));
}

// Un'unica funzione autorevole aggiorna le due progressioni personali.
// Restituisce al massimo un evento: il chiamante lo accoda e lo risolve una volta.
function updatePerformanceProgress(player,isOnPodium){
  if(isOnPodium){
    player.outsidePodiumStreak=0;
    player.podiumCount=(Number(player.podiumCount)||0)+1;
    return player.podiumCount%PODIUM_MALUS_STEP===0
      ? {type:"malus",trigger:"podium_tax",podiumCount:player.podiumCount}
      : null;
  }
  player.outsidePodiumStreak=(Number(player.outsidePodiumStreak)||0)+1;
  if(player.outsidePodiumStreak<COMEBACK_BONUS_STREAK)return null;
  player.outsidePodiumStreak=0;
  return {type:"bonus",trigger:"comeback",streak:COMEBACK_BONUS_STREAK};
}

/* ---- Dado: facce a pallini + mini animazione di lancio ---- */
function dieFaceHTML(v){
  const map={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const on=new Set(map[v]||[]);
  let s=""; for(let i=0;i<9;i++) s+=`<i class="pip${on.has(i)?" on":""}"></i>`;
  return s;
}
// fa "rotolare" il dado: cicla le facce rallentando, poi atterra sul valore finale
function spinDie(el, finalVal, pips, done){
  if(!el) { if(done) done(); return; }
  el.classList.add("spinning");
  const steps=[60,70,85,105,135,175,230]; let k=0;
  (function tick(){
    const f=1+rnd(6);
    el.innerHTML = pips ? dieFaceHTML(f) : String(f);
    if(k<steps.length){ setTimeout(tick, steps[k++]); }
    else{
      el.classList.remove("spinning");
      el.innerHTML = pips ? dieFaceHTML(finalVal) : String(finalVal);
      el.classList.add("landed");
      if(navigator.vibrate){ try{ navigator.vibrate(18); }catch(e){} }
      setTimeout(()=>el.classList.remove("landed"), 430);
      if(done) done();
    }
  })();
}

function log(msg, round){

function beginLedger(){S.ledger=[];}
function applyPlayerDelta(player,change={}){
  if(!player)return null;
  const scoreFrom=player.score,posFrom=player.pos;
  const requestedScore=Number(change.score)||0,requestedPos=Number(change.pos)||0;
  player.score=Math.max(0,scoreFrom+requestedScore);
  player.pos=Math.max(0,Math.min(FINISH,posFrom+requestedPos));
  const item={playerId:player.id,name:player.name,color:player.color,scoreFrom,scoreTo:player.score,posFrom,posTo:player.pos,scoreDelta:player.score-scoreFrom,posDelta:player.pos-posFrom,source:change.source||"Partita",detail:change.detail||""};
  if(item.scoreDelta||item.posDelta)S.ledger.push(item);
  return item;
}
function consumeLedger(){const out=S.ledger.slice();S.ledger=[];return out;}
function aggregateLedger(items){
  const byId=new Map();
  (items||[]).forEach(item=>{
    let row=byId.get(item.playerId);
    if(!row){row={playerId:item.playerId,name:item.name,color:item.color,scoreFrom:item.scoreFrom,scoreTo:item.scoreTo,posFrom:item.posFrom,posTo:item.posTo,scoreDelta:0,posDelta:0,sources:[]};byId.set(item.playerId,row);}
    row.scoreTo=item.scoreTo;row.posTo=item.posTo;row.scoreDelta=row.scoreTo-row.scoreFrom;row.posDelta=row.posTo-row.posFrom;
    row.sources.push({label:item.source,detail:item.detail,scoreDelta:item.scoreDelta,posDelta:item.posDelta});
  });
  return [...byId.values()];
}

// Un solo shuffle-bag autorevole per round, Stima Lampo e minigiochi numerici.
// La memoria del ciclo sopravvive a "Nuova partita" e, quando possibile, anche
// alla riapertura della pagina: niente estrazioni casuali indipendenti.
const QUESTION_MEMORY_KEY="aocchio_question_cycle_v2";
const QUESTION_RECENT_LIMIT=40;
const questionId=q=>`${q.cat}\u241f${q.q}`;
function loadQuestionMemory(){
  try{
    const raw=JSON.parse(localStorage.getItem(QUESTION_MEMORY_KEY)||"{}");
    return {used:new Set(Array.isArray(raw.used)?raw.used:[]),recent:Array.isArray(raw.recent)?raw.recent:[]};
  }catch(e){return {used:new Set(),recent:[]};}
}
const QUESTION_MEMORY=loadQuestionMemory();
function saveQuestionMemory(){
  try{localStorage.setItem(QUESTION_MEMORY_KEY,JSON.stringify({used:[...QUESTION_MEMORY.used],recent:QUESTION_MEMORY.recent.slice(-QUESTION_RECENT_LIMIT)}));}catch(e){}
}
function curatedQuestions(){return QUESTIONS.filter(q=>q.f&&q.fs);}
function pruneQuestionMemory(curated){
  const valid=new Set(curated.map(questionId));
  QUESTION_MEMORY.used=new Set([...QUESTION_MEMORY.used].filter(id=>valid.has(id)));
  QUESTION_MEMORY.recent=QUESTION_MEMORY.recent.filter(id=>valid.has(id)).slice(-QUESTION_RECENT_LIMIT);
}
function refillQuestionBag(curated,scope){
  let candidates=scope.filter(q=>!S.used.has(questionId(q))&&!QUESTION_MEMORY.used.has(questionId(q)));
  if(!candidates.length){
    // Il ciclo della selezione attiva è terminato: lo riapriamo senza toccare
    // le domande già uscite nella partita in corso e tenendo fuori le più recenti.
    const scopeIds=new Set(scope.map(questionId));
    QUESTION_MEMORY.used=new Set([...QUESTION_MEMORY.used].filter(id=>!scopeIds.has(id)));
    candidates=scope.filter(q=>!S.used.has(questionId(q))&&!QUESTION_MEMORY.recent.includes(questionId(q)));
    if(!candidates.length)candidates=scope.filter(q=>!S.used.has(questionId(q)));
  }
  S.questionBag=shuffle(candidates.map(questionId));
  saveQuestionMemory();
  return S.questionBag.length>0;
}
function drawFromPool(cat,context="round"){
  const curated=curatedQuestions();pruneQuestionMemory(curated);
  const byId=new Map(curated.map(q=>[questionId(q),q]));
  let scope=cat?curated.filter(q=>q.cat===cat):curated.filter(q=>!OFFCATS.has(q.cat));
  if(!cat&&S.lastQuestionCat){const alternate=scope.filter(q=>q.cat!==S.lastQuestionCat);if(alternate.length)scope=alternate;}
  if(!scope.length)scope=curated.filter(q=>!OFFCATS.has(q.cat));
  const usable=id=>{const q=byId.get(id);return q&&!S.used.has(id)&&scope.includes(q)&&!QUESTION_MEMORY.used.has(id);};
  let index=S.questionBag.findIndex(usable);
  if(index<0){refillQuestionBag(curated,scope);index=S.questionBag.findIndex(id=>byId.has(id)&&!S.used.has(id));}
  // Se una categoria è stata consumata durante la stessa partita, si passa a
  // un'altra categoria attiva invece di ripetere una domanda.
  if(index<0&&cat){
    const fallback=curated.filter(q=>!OFFCATS.has(q.cat)&&!S.used.has(questionId(q)));
    if(fallback.length){refillQuestionBag(curated,fallback);index=0;}
  }
  if(index<0)throw new Error("Mazzo domande esaurito: nessuna ripetizione consentita nella stessa partita.");
  const id=S.questionBag.splice(index,1)[0],q=byId.get(id);
  S.used.add(id);QUESTION_MEMORY.used.add(id);QUESTION_MEMORY.recent.push(id);QUESTION_MEMORY.recent=QUESTION_MEMORY.recent.slice(-QUESTION_RECENT_LIMIT);saveQuestionMemory();
  if(cat&&q.cat!==cat)log(`🔀 Categoria ${esc(cat)} esaurita senza ripetizioni: il mazzo passa a ${esc(q.cat)}.`);
  if(context!=="round")log(`🎴 ${esc(context)} pesca una domanda nuova dal mazzo condiviso.`);
  if(context==="round")S.lastQuestionCat=q.cat;
  return q;
}

function finalizeDraw(cat){
  S.phase="draw";
  S.chosenCat = cat;
  S.question = drawFromPool(cat);
  renderStatus();
  startWriting();
}

function stopTimer(){ if(S.timer.id){clearInterval(S.timer.id); S.timer.id=null;} }
// registro intervalli attivi (timer scrittura + mini-giochi), per fermarli su esci/ricomincia
const ACTIVE_INTERVALS=[];
function track(id){ ACTIVE_INTERVALS.push(id); return id; }
function haltAll(){ ACTIVE_INTERVALS.forEach(clearInterval); ACTIVE_INTERVALS.length=0; stopTimer(); }
function updateTimerUI(){
  const tnum=$("#tnum"), tbar=$("#tbar");
  if(!tnum) return;
  tnum.textContent = Math.max(0,S.timer.left);
  tnum.classList.toggle("warn", S.timer.left<=5);

// stato per giocatore: secondi personali rimasti oppure "PENNA GIÙ"
function updateWriteRoster(){
  const elapsed = S.timer.total - S.timer.left;
  S.players.forEach((p,i)=>{
    const cell=$("#ws"+i); if(!cell) return;
    if(onlineEstimateFor(p)!=null){ cell.textContent="INVIATA ✓"; cell.classList.add("down"); cell.classList.remove("urgent","reduced"); return; }
    const personal = Math.max(0, playerLimit(p) - elapsed);
    if(personal<=0){
      if(!cell.classList.contains("down")){ cell.textContent="PENNA GIÙ ✋"; cell.classList.add("down"); cell.classList.remove("urgent"); if(playerLimit(p)<25) beep(300,180); }
      if(i===0){
        const masterInput=$("#masterEstimate"), masterButton=$("#masterSubmit"), masterStatus=$("#masterStatus");
        if(masterInput && onlineEstimateFor(p)==null){
          masterInput.disabled=true;
          if(masterButton) masterButton.disabled=true;
          if(masterStatus) masterStatus.textContent="Tempo personale scaduto: la lavagnetta del Master è bloccata.";
        }
      }
    } else {
      cell.textContent = personal+"s";
      const limited = playerLimit(p)<25;
      cell.classList.toggle("urgent", limited && personal<=3);
      if(limited && personal<=3 && p._lastTick!==personal){ p._lastTick=personal; beep(760,55); }
    }
  });
}

   ===================================================================== */
function parseEstimate(raw){
  if(raw===null||raw===undefined) return NaN;
  let s = String(raw).trim().replace(/\s/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",",".");
  if(s===""||!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)) return NaN;
  const v = Number(s);
  return Number.isFinite(v)? v : NaN;
}
function sameScoreDistance(a,b){
  if(!Number.isFinite(a)||!Number.isFinite(b))return false;
  const tolerance=Number.EPSILON*Math.max(1,Math.abs(a),Math.abs(b))*8;
  return Math.abs(a-b)<=tolerance;
}
function distanceFormula(entry){
  if(!Number.isFinite(entry.effectiveDist))return "—";
  const parts=[fmtNum(entry.rawDist)];
  if(entry.penaltyMultiplier>1)parts.push(`× ${fmtNum(entry.penaltyMultiplier)}`);
  if(entry.parachuteApplied)parts.push("÷ 2");
  return `${parts.join(" ")} = ${fmtNum(entry.effectiveDist)}`;
}
function buildTieReason(entries,q){
  const finite=entries.filter(e=>Number.isFinite(e.effectiveDist));
  const sameEstimate=finite.length>1&&finite.every(e=>e.est===finite[0].est);
  return {
    type:"distance_tie",
    title:sameEstimate?"Avete dato la stessa risposta":"La distanza valida è identica",
    question:q.q,
    correctAnswer:fmtNum(q.a)+(q.u?" "+q.u:""),
    distance:finite.length?fmtNum(finite[0].effectiveDist):"—",
    sameEstimate,
    players:finite.map(e=>({id:e.id,name:e.name,estimate:fmtNum(e.est),rawDistance:fmtNum(e.rawDist),scoreDistance:fmtNum(e.effectiveDist),penaltyMultiplier:e.penaltyMultiplier,parachuteApplied:!!e.parachuteApplied,formula:distanceFormula(e)}))
  };
}

function calcResults(){
  if(S.phase!=="input") return; // evita doppie chiamate
  const q=S.question;
  // raccogli stime
  const entries = S.players.map((p,i)=>{
    let val = parseEstimate($("#ans"+i)? $("#ans"+i).value : "");
    // malus "A spanne, genio": arrotonda alla decina
    if(!Number.isNaN(val) && p.malus.some(m=>m.round10)){
      val = Math.round(val/10)*10;
    }
    const rawDist=Number.isNaN(val)?Infinity:Math.abs(q.a-val);
    const penaltyMultiplier=p.malus.reduce((f,m)=>m.penalty?f*m.penalty:f,1);
    const effectiveDist=rawDist===Infinity?Infinity:rawDist*penaltyMultiplier;
    return {id:p.id,name:p.name,color:p.color,est:val,rawDist,effectiveDist,dist:effectiveDist,penaltyMultiplier,parachuteApplied:false};
  });

  // Paracadute: la regola è automatica e verificabile. Si consuma soltanto per
  // chi, prima del suo effetto, ha la peggiore distanza valida del round.
  const finiteBeforeParachute=entries.filter(e=>Number.isFinite(e.effectiveDist));
  const worstDistance=finiteBeforeParachute.length?Math.max(...finiteBeforeParachute.map(e=>e.effectiveDist)):null;
  entries.forEach(e=>{
    const p=pById(e.id),bonusIndex=p?p.bonus.findIndex(b=>b.id==="paracadute"):-1;
    if(bonusIndex>=0&&worstDistance!==null&&sameScoreDistance(e.effectiveDist,worstDistance)){
      e.effectiveDist/=2;e.dist=e.effectiveDist;e.parachuteApplied=true;p.bonus.splice(bonusIndex,1);
      log(`🪂 Paracadute: la distanza valida di ${esc(p.name)} viene dimezzata automaticamente (${distanceFormula(e)}).`);
    }
  });

  // ordina per distanza (Infinity = nessuna stima, in fondo)
  const ordered=entries.slice().sort((a,b)=>a.effectiveDist===b.effectiveDist?S.players.findIndex(p=>p.id===a.id)-S.players.findIndex(p=>p.id===b.id):(a.effectiveDist<b.effectiveDist?-1:1));

  // individua i cluster di parità (stessa distanza finita) che toccano il podio (primi 3 validi)
  const clusters=[]; let i=0, validIdx=0;
  while(i<ordered.length){
    let j=i;
    while(j+1<ordered.length && sameScoreDistance(ordered[j+1].effectiveDist,ordered[i].effectiveDist)) j++;
    const size=j-i+1;
    if(size>1 && ordered[i].dist!==Infinity && validIdx<3){
      clusters.push({start:i,end:j,startPlace:validIdx+1,reason:buildTieReason(ordered.slice(i,j+1),q)});
    }
    if(ordered[i].dist!==Infinity) validIdx += size;
    i=j+1;
  }

  S.phase="rolloff";

  function finalize(){
    const duo = S.players.length===2;
    const pts = [3,2,1]; let valids=0;
    ordered.forEach((e,idx)=>{
      e.rank = idx+1;
      if(duo){
        // Duello: segna solo il più vicino — +2 se entro il 30% della risposta, +1 oltre
        const soglia = Math.abs(q.a)*0.30;
        e.pts = (idx===0 && e.dist!==Infinity)? (e.dist<=soglia? 2 : 1) : 0;
      } else {
        e.pts = (e.dist!==Infinity && valids<3)? pts[valids] : 0;
      }
      if(e.dist!==Infinity) valids++;
    });
    ordered.forEach(e=>{
      const p=pById(e.id);
      if(p && p.cecchino){
        if(e.dist===0){ e.pts=4; log(`🔭 COLPO DA CECCHINO! ${esc(p.name)} azzecca la risposta esatta: +4!`); }
        else log(`🔭 Cecchino mancato: ${esc(p.name)} non centra la risposta esatta.`);
        p.cecchino=false;
      }
    });
    S.ranking = ordered;
    const winner = ordered.find(e=>e.pts>0);
    if(duo && winner){
      const soglia=Math.abs(q.a)*0.30;
      log(winner.dist<=soglia? `🎯 Dentro il 30% (distanza ${fmtNum(winner.dist)}, soglia ${fmtNum(Math.round(soglia))}): +2.` : `Oltre il 30% (distanza ${fmtNum(winner.dist)}): solo +1.`);
    }
    S.roundWinnerId = winner? winner.id : null;
    if(winner){
      log(`Risposta: <b>${fmtNum(q.a)}${q.u?" "+q.u:""}</b>. Più vicino: <b>${esc(winner.name)}</b> (${fmtNum(winner.est)}).`);
    } else {
      log(`Risposta: <b>${fmtNum(q.a)}${q.u?" "+q.u:""}</b>. Nessuna stima valida questo round.`);
    }
    S.players.forEach(p=>{ p.voiceNext=false; p.malus = p.malus.filter(m=> m.sticky && p.fenomeno); }); // i malus normali si consumano; quelli della corona restano finché sei Fenomeno
    S.phase="reveal";
    renderReveal();
  }

  // risolve un cluster alla volta con la schermata Fotofinish interattiva
  function resolveCluster(k){
    if(k>=clusters.length) return finalize();
    const c=clusters[k];
    const slice = ordered.slice(c.start, c.end+1);
    const group = slice.map(e=>pById(e.id));
    diceOrder(group, {title:"Fotofinish!",sub:"Stessa distanza valida: sfida di spareggio",startPlace:c.startPlace,maxPlace:3,reason:c.reason}, (orderedPlayers)=>{
      const byId={}; slice.forEach(e=> byId[e.id]=e);
      const newSlice = orderedPlayers.map(p=>byId[p.id]);
      for(let z=0; z<newSlice.length; z++) ordered[c.start+z]=newSlice[z];
      log(`🎲 Fotofinish: ${orderedPlayers.map(p=>esc(p.name)).join(" › ")}.`);
      resolveCluster(k+1);
    });
  }

  if(clusters.length===0) finalize();
  else resolveCluster(0);
}


function questionFunFact(q){
  /*
    Regola editoriale:
    - Mostrare solo curiosità reali e curate.
    - Il campo `f` va scritto insieme alla domanda e deve riferirsi a un fatto verificabile.
    - Non generare frasi automatiche partendo soltanto da categoria o risposta.
  */
  if(q && typeof q.f==="string" && q.f.trim() && typeof q.fs==="string" && q.fs.trim()) return q.f.trim();
  return ""; // fail closed: una domanda non curata non deve essere pescata

}

function questionFunFactSource(q){
  return q&&q.fs?String(q.fs):"";
}

function renderReveal(){
  const q=S.question;
  const rowsHtml = S.ranking.map((e,ix)=>{
    const podium = e.pts>0;
    const rcls = e.rank===1?"r1":e.rank===2?"r2":e.rank===3?"r3":"";
    const hasModifier=e.penaltyMultiplier>1||e.parachuteApplied;
    const distTxt=e.effectiveDist===Infinity?"nessuna stima":`stima ${fmtNum(e.est)} · distanza reale ${fmtNum(e.rawDist)}${hasModifier?` · distanza valida ${distanceFormula(e)}`:""}`;
    return `
      <div class="res-row ${podium?'podium':''} res-in" style="animation-delay:${.35+ix*.18}s">
        <div class="rank ${rcls}">${e.pts>0? e.rank : "–"}</div>
        <div class="res-mid">
          <div class="nm">${avatarHTML(pById(e.id),24)} ${esc(e.name)}</div>
          <div class="meta">${distTxt}</div>
        </div>
        <div class="res-pts ${e.pts? "":"zero"}">${e.pts? "+"+e.pts:"0"}</div>
      </div>`;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <p class="eyebrow">Round ${S.round} · Rivela</p>
      <div class="answer-reveal">
        <div class="lbl">La risposta era</div>
        <div class="big ans-pop">${fmtNum(q.a)}${q.u?" <span style='font-size:18px'>"+esc(q.u)+"</span>":""}</div>
        <div class="qhint" style="font-style:normal">${esc(q.q)}</div>
        <div class="card flat mt-s" style="background:#eef4f0;border-color:#c9ddd2;text-align:left;font-size:12.5px;line-height:1.45"><b>✨ La storia dietro la domanda</b><br>${esc(questionFunFact(q))}<div style="font-size:10px;color:#6b7c76;margin-top:5px">Fonte: ${esc(questionFunFactSource(q))}</div></div>
      </div>
      ${rowsHtml}
      <button type="button" class="btn teal mt" id="advanceBtn">Assegna punti e avanza →</button>
    </div>
    ${logCard()}
  `;
  $("#advanceBtn").addEventListener("click",e=>{e.currentTarget.disabled=true;applyScoringAndMove();});
  wireBoardLog();
  const projectedScores = S.players.map(p=>{
    const e=S.ranking.find(r=>r.id===p.id);
    const roundPoints=e?e.pts:0;
    return {
      name:p.name,
      score:p.score+roundPoints,
      pos:Math.min(FINISH,p.pos+roundPoints),
      color:p.color,
      roundPoints
    };
  });
  onlineBroadcastView({
    kind:"result",
    round:S.round,
    title:"Risultati del round",
    question:q.q,
    answer:fmtNum(q.a)+(q.u?" "+q.u:""),
    funFact:questionFunFact(q),
    funFactSource:questionFunFactSource(q),
    ranking:S.ranking.map(e=>({
      name:e.name,
      color:e.color,
      estimate:e.dist===Infinity?null:fmtNum(e.est),
      distance:e.effectiveDist===Infinity?null:fmtNum(e.effectiveDist),rawDistance:e.rawDist===Infinity?null:fmtNum(e.rawDist),penaltyMultiplier:e.penaltyMultiplier,parachuteApplied:e.parachuteApplied,formula:e.effectiveDist===Infinity?null:distanceFormula(e),
      points:e.pts,
      rank:e.rank
    })),
    scores:projectedScores,
    pendingMovement:true
  });
}

/* =====================================================================
   PUNTEGGIO + MOVIMENTO + FENOMENO
   ===================================================================== */
function applyScoringAndMove(){
  if(S.scoringAppliedRound===S.round)return;
  S.scoringAppliedRound=S.round;
  beginLedger();
  let finaleReached=null;
  const performanceEvents=[];
  S.lastLanded=[];
  // 🔥 Posta Doppia
  S.players.forEach(p=>{
    if(p.doubleNext){
      const e=S.ranking.find(r=>r.id===p.id);
      if(e && e.pts>0){ applyPlayerDelta(p,{score:e.pts,source:"Posta Doppia",detail:`+${e.pts} punti extra`}); log(`🔥 Posta Doppia: ${esc(p.name)} raddoppia (+${e.pts} extra)!`); }
      else { applyPlayerDelta(p,{score:-1,source:"Posta Doppia",detail:"Fuori dal podio: −1 punto"}); log(`🔥 Posta Doppia: ${esc(p.name)} resta fuori dal podio e perde 1 punto.`); }
      p.doubleNext=false;
    }
  });
  // 🤝 Gemelli
  if(S.twins){
    const ea=S.ranking.find(r=>r.id===S.twins.a), eb=S.ranking.find(r=>r.id===S.twins.b);
    if(ea&&eb&&ea.pts>0&&eb.pts>0){
      applyPlayerDelta(pById(S.twins.a),{score:1,source:"Gemelli",detail:"Entrambi a podio"});
      applyPlayerDelta(pById(S.twins.b),{score:1,source:"Gemelli",detail:"Entrambi a podio"});
      log(`🤝 Gemelli: doppio podio! +1 extra a testa.`);
    } else log(`🤝 Gemelli: patto fallito, nessun bonus.`);
    S.twins=null;
  }
  S.ranking.forEach(e=>{
    const p = pById(e.id);
    if(e.pts>0){
      applyPlayerDelta(p,{score:e.pts,pos:e.pts,source:`Round ${S.round}`,detail:`${e.rank}º posto: +${e.pts} punti e +${e.pts} caselle`});
      S.lastLanded.push(p.pos);
      if(p.pos>=FINISH && !finaleReached) finaleReached=p;
    }
    const progressEvent=updatePerformanceProgress(p,e.pts>0);
    if(progressEvent){
      performanceEvents.push({...progressEvent,landerId:p.id});
      if(progressEvent.type==="malus")log(`⛔ Tassa del podio: ${esc(p.name)} raggiunge ${progressEvent.podiumCount} piazzamenti sul podio e riceve un MALUS.`);
      else log(`⭐ Premio rimonta: ${esc(p.name)} resta fuori dal podio per ${COMEBACK_BONUS_STREAK} round di fila e può scegliere un BONUS.`);
    }
  });

  // streak / Fenomeno
  if(S.roundWinnerId){
    S.players.forEach(p=>{
      if(p.id===S.roundWinnerId){ p.streak = (S.lastWinnerId===p.id? p.streak:0)+1; }
      else p.streak=0;
    });
    const w = pById(S.roundWinnerId);
    let becameFenomeno=false;
    if(w.streak>=2 && !w.fenomeno){
      setFenomeno(w);
      becameFenomeno=true;
      log(`👑 <b>${esc(w.name)}</b> vince due round di fila: diventa <b>Il Fenomeno</b>. Prezzo della fama: ✍️ "La Firma del Campione" (mano non dominante, 15s) e 👑 "Il Peso della Corona" (distanza +25%).`);
    }
    S.lastWinnerId = S.roundWinnerId;
    S._becameFenomeno = becameFenomeno;
  } else {
    S.lastWinnerId=null; S._becameFenomeno=false;
  }

  renderStatus();

  const afterMove = ()=>{
    if(finaleReached){
      log(`🏆 <b>${esc(finaleReached.name)}</b> raggiunge la casella ${FINISH}: FINALE!`);
      S.winnerFinal=finaleReached;
      return renderGameOver();
    }
    // Prima risolviamo i premi legati ai risultati, poi l'eventuale casella del percorso.
    S.specialQueue = performanceEvents.slice();
    S.ranking.forEach(e=>{
      if(e.pts>0){
        const p = pById(e.id);
        const type = BOARD[p.pos-1]; // pos 1..FINISH -> index 0..FINISH-1
        if(type && type!=="domanda" && type!=="finale"){
          S.specialQueue.push({type, landerId:p.id, cell:p.pos});
        }
      }
    });
    nextSpecialOrPost();
  };
  return animateLedger(consumeLedger(), afterMove, `Avanzamento del round ${S.round}`);
}

// passa alla prossima casella speciale in coda, o chiude il round
function nextSpecialOrPost(skipTransition){
  if(!skipTransition&&S.ledger&&S.ledger.length){
    const ledger=consumeLedger();
    return animateLedger(ledger,()=>{
      const finalist=ledger.map(item=>pById(item.playerId)).find(p=>p&&p.pos>=FINISH);
      if(finalist){S.winnerFinal=finalist;return renderGameOver();}
      nextSpecialOrPost(true);
    },"Effetto della casella speciale");
  }
  if(S.specialQueue && S.specialQueue.length){
    S.special = S.specialQueue.shift();
    return renderSpecial();
  }
  renderPostRound();
}
