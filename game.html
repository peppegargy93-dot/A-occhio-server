function wireSpecial(type, lander){
  if(type==="bonus"){
    const list=$("#bonusList"),opts=shuffle(BONUS.filter(b=>!lander.bonus.some(owned=>owned.id===b.id))).slice(0,3);let completed=false;
    if(!opts.length){
      completed=true;
      list.innerHTML=`<div class="card flat center"><b>Bonus già completi</b><br><span>${esc(lander.name)} possiede già tutte le carte disponibili.</span></div>`;
      log(`⭐ Premio rimonta già completo: ${esc(lander.name)} possiede tutti i BONUS.`);
      onlineBroadcastCardResolution({icon:"⭐",title:"Premio rimonta",subject:lander.name,effectTitle:"Bonus già completi",description:"Il giocatore possiede già tutte le carte disponibili.",instruction:"Nessun effetto viene duplicato; la partita prosegue."});
      setTimeout(nextSpecialOrPost,850);return;
    }
    list.innerHTML=`<div class="card flat center">📲 ${esc(lander.name)} sceglierà il BONUS dalla propria lavagnetta.</div>`;
    onlineRequestPlayerChoice({chooser:lander,title:"Scegli il tuo BONUS",subject:`Premio rimonta · ${lander.name}`,description:`${COMEBACK_BONUS_STREAK} round consecutivi fuori dal podio: scegli una carta da conservare.`,options:opts.map(b=>({id:b.id,label:`BONUS · ${b.nm}`,description:b.desc}))},(bonusId)=>{
      const b=opts.find(x=>x.id===bonusId);
      if(!b){list.innerHTML=opts.map((x,i)=>`<button type="button" class="choice fallback-bonus" data-i="${i}"><b>BONUS · ${esc(x.nm)}</b><br><span>${esc(x.desc)}</span></button>`).join("");$$(".fallback-bonus",list).forEach(btn=>btn.onclick=()=>{list.querySelectorAll("button").forEach(x=>x.disabled=true);finish(opts[+btn.dataset.i])});return;}
      finish(b);
    });
    function finish(b){
      if(completed||!b)return;completed=true;
      const assigned=addUniqueEffect(lander.bonus,b);
      if(assigned){
        log(`⭐ Premio rimonta: ${esc(lander.name)} sceglie il BONUS "${b.nm}".`);
        onlineBroadcastCardResolution({icon:"⭐",title:"BONUS rimonta assegnato",subject:lander.name,effectTitle:b.nm,description:b.desc,instruction:`${lander.name} conserva questa carta.`});
      }else{
        log(`⭐ BONUS "${b.nm}" non duplicato: ${esc(lander.name)} lo possiede già.`);
        onlineBroadcastCardResolution({icon:"⭐",title:"BONUS non assegnato",subject:lander.name,effectTitle:b.nm,description:"Il giocatore possiede già questa carta.",instruction:"Nessun effetto è stato duplicato; la partita prosegue."});
      }
      setTimeout(nextSpecialOrPost,700);
    }
  }
  else if(type==="voce"){
    $("#voiceGo").addEventListener("click",()=>{
      lander.voiceNext=true;
      log(`📢 ${esc(lander.name)} dovrà dire la prossima stima ad alta voce.`);
      nextSpecialOrPost();
    });
  }
  else if(type==="malus"){
    let m=null;
    for(let attempt=0;attempt<MALUS.length;attempt++){
      const candidate=drawDeckCard("malus",MALUS);
      if(!lander.malus.some(owned=>owned.id===candidate.id)){m=candidate;break;}
    }
    if(!m){
      $("#malusCard").innerHTML=`<strong>⛔ Nessun nuovo MALUS disponibile</strong><div style="font-size:12px;margin-top:3px">${esc(lander.name)} possiede già tutti gli effetti del mazzo.</div>`;
      log(`⛔ Tassa del podio senza duplicati: ${esc(lander.name)} possiede già tutti i MALUS.`);
      onlineBroadcastCardResolution({icon:"⛔",title:"Tassa del podio",subject:lander.name,effectTitle:"Nessun nuovo effetto",description:"Il giocatore possiede già tutti i Malus disponibili.",instruction:"Nessun effetto viene duplicato; la partita prosegue."});
      setTimeout(nextSpecialOrPost,850);return;
    }
    $("#malusCard").innerHTML=`<strong style="color:#a23a22">⛔ MALUS · ${esc(m.nm)}</strong><div style="font-size:12px;color:#7a4536;margin-top:3px">${esc(m.desc)}</div>`;
    const shield=lander.bonus.findIndex(b=>b.id==="scudo");
    if(shield>=0){

      log(`🛡️ ${esc(lander.name)} blocca la Tassa del podio "${m.nm}" con lo Scudo.`);
      onlineBroadcastCardResolution({icon:"🛡️",title:"MALUS bloccato",subject:lander.name,effectTitle:m.nm,description:"La carta Scudo annulla la Tassa del podio.",instruction:"La partita prosegue senza penalità."});
    }else{

          {t:"niente succede",d:0},{t:"-1 casella",d:-1},{t:"-2 caselle!",d:-2}
        ][r-1];
        applyPlayerDelta(lander,{pos:fx.d,source:"Dado Caos",detail:`Tiro ${r}: ${fx.t}`});

        btn.classList.remove("ochre"); btn.classList.add("teal");
        btn.replaceWith(btn.cloneNode(true));

function startTesi(challenger, opponent){
  const card = drawDeckCard("tesi",TESI_CARDS);

  let tesiP, antiP;

  const tt=$("#tesiTargets"); if(tt) tt.classList.add("hide");

  function reading(){

  function debate(side){
    if(iv){clearInterval(iv);iv=null;}

    const who = isTesi? tesiP : antiP;
    const stance = isTesi? card.tesi : card.antitesi;
    root.innerHTML = `
      <div class="card flat" style="background:var(--paper-2)">
        <div class="tesi-cat">${esc(card.prompt)}</div>
        <div class="special-banner" style="padding:4px 0 2px">

        </div>
        <div class="qcard" style="margin:6px 0"><div class="qtext" style="font-size:15.5px">${esc(stance)}</div></div>

          <div class="timer-num" id="tNum">20</div><div class="timer-lbl">secondi per convincere</div>
          <div class="tbar"><i id="tBar"></i></div>
        </div>
        <button type="button" class="btn ghost sm" id="tSkip">${isTesi?"Passa all'Antitesi →":"Vai al voto →"}</button>
      </div>`;
    let left=20; const num=$("#tNum"), bar=$("#tBar");
    iv=track(setInterval(()=>{
      left--; if(num){num.textContent=Math.max(0,left); num.classList.toggle("warn",left<=5);} if(bar) bar.style.width=(Math.max(0,left)/20*100)+"%";
      if(left<=0) advance();
    },1000));
    function advance(){ if(iv){clearInterval(iv);iv=null;} isTesi? debate("anti") : vote(); }
    $("#tSkip").addEventListener("click",advance);
  }

  function vote(){
    if(iv){clearInterval(iv);iv=null;}
    root.innerHTML = `
      <div class="card flat" style="background:var(--paper-2)">
        <div class="tesi-cat">${esc(card.prompt)}</div>
        <p class="eyebrow center mt-s">Il tavolo vota: chi ha convinto di più?</p>
        <div class="choice-grid">
          <button type="button" class="btn teal" id="voteT">Vince la Tesi · ${esc(tesiP.name)}</button>
          <button type="button" class="btn coral" id="voteA">Vince l'Antitesi · ${esc(antiP.name)}</button>
          <button type="button" class="btn ghost" id="voteN">Nessuno convince</button>
        </div>
      </div>`;
    $("#voteT").addEventListener("click",()=>resolve(tesiP,"Tesi"));
    $("#voteA").addEventListener("click",()=>resolve(antiP,"Antitesi"));
    $("#voteN").addEventListener("click",()=>resolve(null));
  }

  function resolve(winner, sideName){
    if(resolved)return;resolved=true;
    if(winner){
      applyPlayerDelta(winner,{score:1,pos:1,source:"Tesi & Antitesi",detail:`Vince la ${sideName}`});
      log(`⚖️ Tesi & Antitesi (${esc(card.tema)}): vince la ${sideName} di <b>${esc(winner.name)}</b>. +1 punto, +1 casella.`);
      renderStatus();

      log(`⚖️ Tesi & Antitesi (${esc(card.tema)}): nessuno convince. <b>Penitenza bipartisan</b>. 🤝`);
    }
    nextSpecialOrPost();
  }

  reading();
}

/* =====================================================================
   ROLL-OFF DADI — schermata dedicata: ognuno tocca il PROPRIO riquadro
   Usata da Fotofinish (parità) e Duello. Niente confusione su "di chi è il dado":
   ogni dado vive dentro il riquadro colorato del suo giocatore.
   ===================================================================== */
function diceOrder(players, opts, done){
  const result=[]; let remaining=players.slice();
  (function step(){
    const place=(opts.startPlace||1)+result.length;
    if(place>(opts.maxPlace||Infinity)){result.push(...remaining);return done(result);}
    if(remaining.length<=1){ if(remaining.length) result.push(remaining[0]); return done(result); }
    const points=S.players.length===2&&place===1?"da +1 a +2 punti":place<=3?`${4-place} ${4-place===1?"punto":"punti"}`:"ordine di classifica";
    const stake=`${place}º posto nel round · ${points}`;
    const reason=opts.reason?{...opts.reason,players:(opts.reason.players||[]).filter(item=>remaining.some(p=>p.id===item.id))}:null;
    diceRollWinner(remaining, {title:opts.title,sub:(opts.sub?opts.sub+" · ":"")+"in palio il "+place+"º posto",stakes:stake,reason}, w=>{
      result.push(w); remaining=remaining.filter(p=>p.id!==w.id); step();
    });
  })();
}

const prefersReducedMotion = ()=> window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function nextBoardStep(from,to){
  return from===to?from:from+(from<to?1:-1);
}
function movementRows(rows){
  return `<div class="movement-list">${rows.map(row=>`<div class="movement-row"><div class="movement-head">${avatarHTML(pById(row.playerId),26)}<b>${esc(row.name)}</b><div class="movement-delta"><span>${row.scoreDelta>=0?"+":""}${row.scoreDelta} pt</span><span class="cell-delta">${row.posDelta>=0?"+":""}${row.posDelta} cas.</span></div></div><div class="movement-source">${row.sources.map(source=>`<b>${esc(source.label)}</b>${source.detail?` · ${esc(source.detail)}`:""}`).join("<br>")}</div></div>`).join("")}</div>`;
}
function animateLedger(items,done,title){
  const rows=aggregateLedger(items);
  if(!rows.length)return done();
  const movers=rows.filter(row=>row.posDelta!==0).map(row=>({id:row.playerId,from:row.posFrom,to:row.posTo}));
  onlineBroadcastView({kind:"map",title:title||"Punti e pedine aggiornati",text:"Ogni variazione deriva dallo stesso registro autorevole del Master.",scores:onlineScores(),map:onlineMap(),round:S.round,movement:rows,winRule:"Raggiungi per primo la Finale per vincere subito. Se nessuno ci arriva entro 15 round, vince chi ha più punti."});
  app.innerHTML=`<div class="card"><p class="eyebrow">Aggiornamento della partita</p><h2><span class="tick">🏁</span> ${esc(title||"Punti e pedine")}</h2><div class="win-rule"><b>Due strade per vincere:</b> raggiungi per primo la Finale; se nessuno ci arriva entro il round ${MAX_ROUNDS}, vince chi ha più punti.</div>${movementRows(rows)}</div>${boardCard(Object.fromEntries(S.players.map(p=>[p.id,(rows.find(row=>row.playerId===p.id)||{}).posFrom??p.pos])))}`;
  wireMapToggle();
  const finish=()=>setTimeout(done,prefersReducedMotion()?250:850);
  if(!movers.length||prefersReducedMotion()||document.hidden)return finish();
  return animateBoardMove(movers,finish,true);
}
function animateBoardMove(movers, done,keepSummary){
  if(prefersReducedMotion() || !movers || movers.length===0 || document.hidden){ return done(); }
  S.phase="moving";
  const positions = {}; S.players.forEach(p=> positions[p.id]=p.pos);
  movers.forEach(m=> positions[m.id]=m.from);
  renderMoveBoard(positions);
  const maxSteps = Math.max(...movers.map(m=>Math.abs(m.to-m.from)), 0);
  let step=0;
  function tick(){
    step++;
    let anyMoved=false;
    movers.forEach(m=>{
      const next=nextBoardStep(positions[m.id],m.to);
      if(next!==positions[m.id]){positions[m.id]=next;anyMoved=true;}
    });
    S.lastLanded = movers.filter(m=>positions[m.id]===m.to).map(m=>m.to);
    renderMoveBoard(positions, movers.map(m=>m.id));
    if(step<maxSteps && anyMoved){ setTimeout(tick, 220); }
    else{ setTimeout(done, 300); }
  }
  setTimeout(tick, 240);
}
function renderMoveBoard(positions, hoppingIds){
  const box = $("#moveBoard");
  const html = boardCard(positions, hoppingIds||[]);
  if(box){ box.outerHTML = html; }
  else{ app.innerHTML = `<div class="card"><p class="eyebrow">Round ${S.round} · Avanzamento</p></div>${html}`; }
}
function boardCard(positions, hoppingIds){
  const landed=new Set(S.lastLanded||[]);
  const hopSet=new Set(hoppingIds||[]);
  const posOf=(p)=> positions? (positions[p.id]!=null?positions[p.id]:p.pos) : p.pos;
  // 🎥 CAMERA: la mappa segue la corsa (stile Mario Party) invece di mostrare tutto in piccolo
  const maxPos=Math.max(0,...S.players.map(p=>posOf(p)));
  let lo=0, hi=BOARD.length, windowed=false;
  if(!S.mapFull && BOARD.length>12){
    hi=Math.min(BOARD.length, Math.max(9, maxPos+3));
    lo=Math.max(0, hi-9);
    windowed = !(lo===0 && hi===BOARD.length);
  }
  const behind=S.players.filter(p=>posOf(p)<lo).sort((a,b)=>b.pos-a.pos);
  const startHere=S.players.filter(p=>posOf(p)===0);
  const startPawns=startHere.map(p=>`<span class="pawn drop${hopSet.has(p.id)?' hop':''}" style="background:${p.color}" title="${esc(p.name)}">${esc(initialOf(p.name))}</span>`).join("");
  const startCell=`<div class="cell start-cell"><span class="n">0</span><span class="cell-main"><span class="ic">🚩</span><span class="cell-name">Partenza</span></span>${startPawns?`<span class="pawns">${startPawns}</span>`:"<span></span>"}</div>`;
  const cells = BOARD.map((type,i)=>{
    const n=i+1;
    if(n<lo || n>hi) return "";
    const here = S.players.filter(p=>posOf(p)===n);
    const pawns = here.map(p=>`<span class="pawn drop${hopSet.has(p.id)?' hop':''}" style="background:${p.color}" title="${esc(p.name)}">${esc(initialOf(p.name))}</span>`).join("");
    return `<div class="cell t-${type}${landed.has(n)?' just':''}" title="${CELL[type].nm}">
        <span class="n">${n}</span>
        <span class="cell-main"><span class="ic">${CELL[type].ic}</span><span class="cell-name">${esc(CELL[type].nm)}</span></span>
        ${pawns?`<span class="pawns">${pawns}</span>`:"<span></span>"}
      </div>`;
  }).join("");
  const behindHtml = behind.length
    ? `<div class="map-behind">↓ più indietro: ${behind.map(p=>`<span class="mb-chip"><i style="background:${p.color}">${esc(initialOf(p.name))}</i>cas. ${posOf(p)}</span>`).join("")}</div>` : "";
  const toggle = BOARD.length>12
    ? `<button type="button" class="map-toggle" id="mapToggle">${S.mapFull? "🎥 Segui la corsa" : "🗺️ Vedi tutta la mappa"}</button>` : "";
  const sub = windowed

let ONLINE_MINI_SEQ=0;
const ONLINE_MINI_CALLBACKS=new Map();
function onlineScores(){
  return S.players.map(p=>({name:p.name,score:p.score,pos:p.pos,color:p.color,outsidePodiumStreak:Number(p.outsidePodiumStreak)||0,podiumCount:Number(p.podiumCount)||0,comebackTarget:COMEBACK_BONUS_STREAK,podiumMalusStep:PODIUM_MALUS_STEP}));
}
function onlineMap(){
  return {
    finish:FINISH,
    cells:BOARD.map((type,i)=>({n:i+1,type,icon:CELL[type].ic,name:CELL[type].nm})),
    players:S.players.map(p=>({name:p.name,pos:p.pos,color:p.color,score:p.score}))
  };
}
function onlineBroadcastView(payload){
  if(!ONLINE || !ONLINE.ws || ONLINE.ws.readyState!==WebSocket.OPEN) return;
  try{ ONLINE.ws.send(JSON.stringify({t:"view",scores:onlineScores(),...payload})); }catch(e){}
}

function onlineEstimateKey(player){
  if(!player)return "";
  return player.onlineToken
    ? `id:${player.onlineToken}`
    : `name:${(player.name||"").trim().toLocaleLowerCase("it-IT")}`;
}
function onlineEstimateFor(player){
  if(!ONLINE||!ONLINE.est)return null;
  const key=onlineEstimateKey(player);
  return Object.prototype.hasOwnProperty.call(ONLINE.est,key)?ONLINE.est[key]:null;
}
function storeOnlineEstimate(message){
  if(!ONLINE)return;
  if(!ONLINE.est)ONLINE.est={};
  const key=message.playerId
    ? `id:${message.playerId}`
    : `name:${(message.name||"").trim().toLocaleLowerCase("it-IT")}`;
  ONLINE.est[key]=message.value;
}
function refreshOnlineEstimates(){
  renderOnlineBar();
  updateWriteRoster();
  checkAllEstimates();
}
function acknowledgeOnlineMasterEvent(message){
  if(!message.eventId||!ONLINE?.ws||ONLINE.ws.readyState!==WebSocket.OPEN)return;
  ONLINE.ws.send(JSON.stringify({t:"master_event_ack",eventId:message.eventId}));
}
function handleOnlineMasterEvent(message){
  if(message.t==="choice_response")resolveOnlineChoice(message);
  else if(message.t==="choice_unavailable")fallbackOnlineChoice(message);
  else if(message.t==="mini_response")resolveOnlineMiniResponse(message);
  else if(message.t==="mini_unavailable")fallbackOnlineMiniResponse(message);
  acknowledgeOnlineMasterEvent(message);
}

function syncJoinedPlayers(joined){
  if(!Array.isArray(joined) || S.phase!=="setup") return;
  const masterName=S.players[0]?.name||"";
  const masterAvatar=S.players[0]?.avatar||null;
  const entries=joined.map(x=>typeof x==="string"?{id:null,name:x}:x).filter(x=>x&&x.name);
  const desired=Math.max(2,Math.min(8,1+entries.length));
  if(S.count!==desired){S.count=desired;syncPlayers();}
  if(S.players[0]){S.players[0].name=masterName;S.players[0].avatar=masterAvatar;}
  entries.slice(0,7).forEach((entry,i)=>{if(S.players[i+1]){S.players[i+1].name=entry.name;S.players[i+1].onlineToken=entry.id||null;}});
  const countVal=$("#countVal");if(countVal)countVal.textContent=S.count;
  if($("#players"))renderPlayerInputs();
}
function onlineRequestPlayerChoice({chooser,title,subject,description,options},callback){
  const masterPlayer=S.players[0];
  if(masterPlayer&&chooser&&chooser.id===masterPlayer.id){callback(null,{reason:"master_local"});return;}
  if(!ONLINE||!ONLINE.ws||ONLINE.ws.readyState!==WebSocket.OPEN){callback(null,{error:"offline",reason:"master_fallback"});return;}
  const requestId=`choice_${Date.now()}_${++ONLINE_CHOICE_SEQ}`;
  // Nessuna scadenza arbitraria: il fallback Master viene aperto soltanto se
  // il server conferma che la lavagnetta autorizzata non è disponibile.
  ONLINE_CHOICE_CALLBACKS.set(requestId,{callback,ready:false});
  ONLINE.ws.send(JSON.stringify({t:"choice_request",requestId,chooser:chooser.name,chooserToken:chooser.onlineToken||"",title,subject,description,options}));
}
function resolveOnlineChoice(m){
  const pending=ONLINE_CHOICE_CALLBACKS.get(m.requestId);if(!pending)return;
  clearTimeout(pending.timer);ONLINE_CHOICE_CALLBACKS.delete(m.requestId);pending.callback(m.optionId,{chooser:m.chooser});
}
function fallbackOnlineChoice(m){
  const pending=ONLINE_CHOICE_CALLBACKS.get(m.requestId);if(!pending)return;
  clearTimeout(pending.timer);ONLINE_CHOICE_CALLBACKS.delete(m.requestId);pending.callback(null,{error:m.msg,reason:m.reason||"master_fallback"});
}
function onlineRequestMiniInputs({players,title,subject,description,icon,fields,seconds=0},onResponse,onUnavailable,onReady){
  const remote=(players||[]).filter(player=>player&&player.onlineToken&&(ONLINE?.players||[]).some(peer=>peer.id===player.onlineToken&&peer.connected));
  if(!remote.length||!ONLINE?.ws||ONLINE.ws.readyState!==WebSocket.OPEN)return null;
  const requestId=`mini_${Date.now()}_${++ONLINE_MINI_SEQ}`;
  ONLINE_MINI_CALLBACKS.set(requestId,{onResponse,onUnavailable,onReady,players:new Map(remote.map(player=>[player.onlineToken,player]))});
  ONLINE.ws.send(JSON.stringify({t:"mini_request",requestId,playerTokens:remote.map(player=>player.onlineToken),title,subject,description,icon,fields,seconds}));
  return {requestId,remoteIds:new Set(remote.map(player=>player.id))};
}
function resolveOnlineMiniReady(message){
  const pending=ONLINE_MINI_CALLBACKS.get(message.requestId);if(!pending)return;
  const player=pending.players.get(message.playerId);if(player)pending.onReady?.(player);
}
function resolveOnlineMiniResponse(message){
  const pending=ONLINE_MINI_CALLBACKS.get(message.requestId);if(!pending)return;
  const player=pending.players.get(message.playerId);if(player)pending.onResponse?.(player,message.values||{});
}
function fallbackOnlineMiniResponse(message){
  const pending=ONLINE_MINI_CALLBACKS.get(message.requestId);if(!pending)return;
  const player=pending.players.get(message.playerId);if(player)pending.onUnavailable?.(player,message.msg||"Lavagnetta non disponibile.");
}
function closeOnlineMini(requestId){
  if(!requestId)return;
  ONLINE_MINI_CALLBACKS.delete(requestId);
  if(ONLINE?.ws?.readyState===WebSocket.OPEN)ONLINE.ws.send(JSON.stringify({t:"mini_cancel",requestId}));
}

function onlineConnect(url, resume=false){
  url=(url||location.origin).trim().replace(/\/$/,"");
  const st=$("#onlineSt"); if(st) st.textContent=resume?"Riconnessione automatica…":"Connessione al server… (se dorme, sveglio in ~30s)";
  clearTimeout(ONLINE_RETRY);
  let ws;
  try{ ws=new WebSocket(url.replace(/^http/,"ws")); }
  catch(e){ if(st) st.textContent="⚠️ Apri il gioco in Safari: "+url+"/gioco"; return; }

  const previous=ONLINE;
  if(!ONLINE) ONLINE={ws:null,code:"",url,est:{},n:0,masterToken:"",connecting:true};
  ONLINE.ws=ws; ONLINE.url=url; ONLINE.connecting=true;

  ws.onerror=()=>{};
  ws.onopen=()=>{
    ONLINE.connecting=false;
    if(ONLINE.code && ONLINE.masterToken){
      ws.send(JSON.stringify({t:"resume_master",code:ONLINE.code,token:ONLINE.masterToken}));
    }else{
      ws.send(JSON.stringify({t:"create"}));
    }
  };
  ws.onmessage=e=>{ let m; try{m=JSON.parse(e.data)}catch(err){return;}
    if(m.t==="room"){
      ONLINE.code=m.code; ONLINE.masterToken=m.token||ONLINE.masterToken; ONLINE.n=m.n||0; ONLINE.players=m.players||ONLINE.players||[]; syncJoinedPlayers(ONLINE.players);
      try{localStorage.setItem("aocchio_master",JSON.stringify({code:ONLINE.code,token:ONLINE.masterToken,url:ONLINE.url}));}catch(e){}
      renderOnlineBar();
      if(!resume) log("🌐 Stanza lavagnette aperta: <b>"+m.code+"</b>",0);
    }
    else if(m.t==="resumed_master"){
      ONLINE.n=m.n||0; ONLINE.players=m.players||ONLINE.players||[]; syncJoinedPlayers(ONLINE.players); renderOnlineBar();
      (m.estimates||[]).forEach(storeOnlineEstimate);
      refreshOnlineEstimates();
      (m.masterEvents||[]).forEach(handleOnlineMasterEvent);
      const s2=$("#onlineSt"); if(s2) s2.textContent="Riconnesso ✓";
    }
    else if(m.t==="peer"){ ONLINE.n=m.n; ONLINE.players=m.players||[]; syncJoinedPlayers(ONLINE.players); renderOnlineBar(); }
    else if(m.t==="bye"){ ONLINE.n=m.n; ONLINE.players=m.players||ONLINE.players||[]; syncJoinedPlayers(ONLINE.players); renderOnlineBar(); }
    else if(m.t==="choice_response"){ handleOnlineMasterEvent(m); }
    else if(m.t==="choice_ready"){const pending=ONLINE_CHOICE_CALLBACKS.get(m.requestId);if(pending){pending.ready=true;const s2=$("onlineSt");if(s2)s2.textContent="Scelta aperta sulla lavagnetta ✓";}}
    else if(m.t==="choice_unavailable"){handleOnlineMasterEvent(m);}
    else if(m.t==="choice_error"){const s2=$("onlineSt");if(s2)s2.textContent="⚠️ "+m.msg;fallbackOnlineChoice(m);}
    else if(m.t==="mini_ready"){resolveOnlineMiniReady(m);}
    else if(m.t==="mini_response"||m.t==="mini_unavailable"){handleOnlineMasterEvent(m);}
    else if(m.t==="mini_error"){const s2=$("onlineSt");if(s2)s2.textContent="⚠️ "+m.msg;}
    else if(m.t==="est"){ storeOnlineEstimate(m); refreshOnlineEstimates(); }
    else if(m.t==="err"){ const s2=$("#onlineSt"); if(s2) s2.textContent="⚠️ "+m.msg; }
  };
  ws.onclose=()=>{
    if(!ONLINE || ONLINE.ws!==ws) return;
    ONLINE.connecting=true;
    renderOnlineBar();
    ONLINE_RETRY=setTimeout(()=>onlineConnect(ONLINE.url,true),1500);
  };
}

function onlineStartFreshRoom(){
  clearTimeout(ONLINE_RETRY);
  ONLINE_CHOICE_CALLBACKS.clear();
  ONLINE_MINI_CALLBACKS.clear();
  const old=ONLINE;
  if(old && old.ws){
    try{
      if(old.ws.readyState===WebSocket.OPEN){
        old.ws.send(JSON.stringify({t:"close_room"}));
      }
      old.ws.onclose=null;
      old.ws.close();
    }catch(e){}
  }
  try{ localStorage.removeItem("aocchio_master"); }catch(e){}
  ONLINE=null;
  setTimeout(()=>{
    if(/^https?:$/.test(location.protocol)) onlineConnect(location.origin,false);
  },250);
}

function renderOnlineBar(){
  const el=$("#onlineBar"); if(!el) return;
  if(ONLINE){
    el.innerHTML = `<div style="font-size:13px">${ONLINE.connecting?"🟠 Riconnessione automatica…":"🌐 Stanza <b>"+ONLINE.code+"</b>"} · 📲 ${ONLINE.n||0} lavagnette collegate · Master su questo telefono</div>
      <div style="font-size:11px;color:#6b6350;margin-top:3px">Gli amici scansionano il QR oppure aprono ${esc(ONLINE.url+"/lavagnetta")} sul telefono</div>
      <img alt="QR stanza" width="110" style="margin-top:6px;border-radius:8px" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(ONLINE.url+"/lavagnetta?c="+ONLINE.code)}">`;
  } else {
    el.innerHTML = `<div style="font-size:12px;font-weight:800">🌐 Lavagnette online</div>
      <input type="url" id="onlineUrl" value="${/^https?:/.test(location.protocol)? location.origin : location.origin}" autocomplete="off"
        style="width:100%;box-sizing:border-box;font-size:13px;border:2px solid var(--ink);border-radius:10px;padding:8px;margin:6px 0 4px">
      <button type="button" class="btn teal sm" id="onlineBtn">Crea stanza →</button>
      <div style="font-size:10.5px;color:#8a7f63;margin-top:4px" id="onlineSt">I telefoni degli amici diventano lavagnette</div>`;
    const b=$("#onlineBtn"); if(b) b.addEventListener("click",()=>onlineConnect(($("#onlineUrl")&&$("#onlineUrl").value)||""));
  }
}
function onlineFill(){
  if(!ONLINE) return;
  $$(".ans-in").forEach(inp=>{
    const player=pById(inp.dataset.playerId);
    const value=onlineEstimateFor(player);
    if(value!=null && inp.value==="") inp.value=value;
  });
}
function initCatChips(){
  document.addEventListener("click", e=>{
    const chip=e.target.closest(".cat-chip"); if(!chip) return;
    const c=chip.dataset.cat;
    if(OFFCATS.has(c)) OFFCATS.delete(c);
    else { if(curatedCats().filter(cat=>!OFFCATS.has(cat)).length<=3){ chip.classList.add("shake"); setTimeout(()=>chip.classList.remove("shake"),300); return; } OFFCATS.add(c); }
    chip.classList.toggle("off", OFFCATS.has(c));
  });
}
function initButtonFeedback(){
  document.addEventListener("pointerdown", e=>{
    const btn=e.target.closest(".btn"); if(!btn) return;
    btn.classList.remove("pressed"); void btn.offsetWidth; btn.classList.add("pressed");
  });
}
function initMenu(){
  menuBtn.addEventListener("click",e=>{
    e.stopPropagation();
    const open = menuSheet.hidden;
    menuSheet.hidden = !open;
    menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click",e=>{
    if(!menuSheet.hidden && e.target!==menuBtn && !menuSheet.contains(e.target)) closeMenu();
  });
  $$(".menu-item", menuSheet).forEach(it=>{
    it.addEventListener("click",()=>{
      const act=it.dataset.act; closeMenu();
      if(act==="restart"){
        confirmAction("Ricominciare la partita da capo con gli stessi giocatori? I punteggi e le posizioni attuali andranno persi.", startGame);
      } else if(act==="home"){
        confirmAction("Uscire dalla partita e tornare alla Home? La partita in corso verrà chiusa.", ()=>{ onlineStartFreshRoom(); renderSetup(); });
      }
    });
  });
}

let _errCount=0, _errLastRound=-1;
window.addEventListener("error",ev=>{
  try{
    if(!S || !S.players || !S.players.length || S.phase==="splash" || S.phase==="setup") return;
    if(document.getElementById("errRescue")) return;
    _errCount = (S.round===_errLastRound)? _errCount+1 : 1;
    _errLastRound = S.round;
    const div=document.createElement("div");
    div.id="errRescue";
    div.innerHTML=`<div class="card" style="position:fixed;left:12px;right:12px;bottom:14px;z-index:99;border:2px solid #e7b4a3;background:#fbe9e2;border-radius:14px;padding:10px 12px">
      <div style="font-size:12px;color:#6b2f1e"><b>⚠️ Intoppo tecnico, riprendo da solo…</b><br>${esc(String(ev.message||"errore sconosciuto")).slice(0,140)}</div></div>`;
    document.body.appendChild(div);
    setTimeout(()=>{
      div.remove(); haltAll();
      try{
        if(_errCount>=2){ log("⚠️ Round saltato per un errore tecnico."); drawQuestion(); }
        else renderPostRound();
      }catch(e){ try{ drawQuestion(); }catch(e2){ try{ renderSetup(); }catch(e3){} } }
    }, 1600);
  }catch(e){}
});
renderSplash();
